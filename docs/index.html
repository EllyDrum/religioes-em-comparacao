  // ============================================================
  // ÍNDICE DE BUSCA
  // ============================================================
  var SEARCH_INDEX = [];
  var SEARCH_TYPES = [
    { key: "todas", label: "Todas" },
    { key: "religiao", label: "Religiões" },
    { key: "rito", label: "Ritos" },
    { key: "pratica", label: "Práticas" },
    { key: "doutrina", label: "Doutrina" },
    { key: "biblia", label: "Bíblia" },
    { key: "historia", label: "História" },
    { key: "conceito", label: "Conceitos" },
  ];
  var SEARCH_TYPE_LABEL = {};
  SEARCH_TYPES.forEach(function (t) { SEARCH_TYPE_LABEL[t.key] = t.label; });

  function buildSearchIndex() {
    SEARCH_INDEX = [];
    function push(type, label, subtitle, reason, href, hayParts) {
      SEARCH_INDEX.push({ type: type, typeLabel: SEARCH_TYPE_LABEL[type] || type, label: label, subtitle: subtitle || "", reason: reason, href: href, haystack: normalizeText(hayParts.join(" | ")) });
    }

    RELIGIONS.forEach(function (r) {
      push("religiao", r.name, "Religião e denominação - ver página completa", "Encontrado no cadastro de religiões e denominações", "#/religiao/" + r.slug,
        [r.name, r.description, r.doctrines.god, r.doctrines.jesus, r.doctrines.salvation, r.doctrines.scripture, r.doctrines.afterlife, r.whatWasAdded]);

      [["Deus", r.doctrines.god], ["Jesus", r.doctrines.jesus], ["Salvação", r.doctrines.salvation], ["Escrituras", r.doctrines.scripture], ["Vida após a morte", r.doctrines.afterlife]].forEach(function (d) {
        push("doutrina", r.name + " - " + d[0], d[1], 'Encontrado na doutrina de "' + d[0] + '" em ' + r.name, "#/religiao/" + r.slug, [d[0], d[1]]);
      });

      push("historia", r.name + " - " + r.foundationYear, "Origem: " + r.originCountry + ". Chegada ao Brasil: " + r.brazilArrival, "Encontrado na linha do tempo histórica", "#/religiao/" + r.slug,
        [r.foundationYear, r.originCountry, r.brazilArrival, r.founder]);

      (r.assessment.verses || []).forEach(function (v) {
        push("biblia", v.ref, (v.text || v.texto || "").slice(0, 140), "Citado na análise bíblica de " + r.name, "#/religiao/" + r.slug, [v.ref, v.text || v.texto]);
      });
    });

    RITUALS.forEach(function (rit) {
      push("rito", rit.name, "Rito e prática - ver o que o Novo Testamento diz", "Encontrado em Análise por rito e prática", "#/biblia/" + rit.id,
        [rit.name, rit.description, rit.nt.context, rit.nt.conclusion]);

      [["Textos que apoiam", rit.nt.supportTexts], ["Textos que limitam", rit.nt.limitTexts], ["Textos que rejeitam", rit.nt.rejectTexts]].forEach(function (g) {
        (g[1] || []).forEach(function (v) {
          push("biblia", v.ref, (v.text || v.texto || "").slice(0, 140), 'Citado em "' + g[0] + '" no rito ' + rit.name, "#/biblia/" + rit.id, [v.ref, v.text || v.texto]);
        });
      });
    });

    Object.keys(MATRIX).forEach(function (slug) {
      var r = findReligion(slug);
      Object.keys(MATRIX[slug]).forEach(function (ritId) {
        var cell = MATRIX[slug][ritId];
        if (!cell || (cell.status !== "sim" && cell.status !== "diferente" && cell.status !== "semelhante")) return;
        var rit = findRitual(ritId);
        push("pratica", r.name + " - " + rit.name, cell.usage || "", "Encontrado na comparação de ritos e práticas", "#/religiao/" + slug, [cell.usage, cell.purpose, cell.similarity]);
      });
    });

    if (typeof WORLDVIEW_TOPICS !== "undefined") {
      WORLDVIEW_TOPICS.forEach(function (t) {
        push("conceito", t.title, t.argument.summary.slice(0, 140), "Encontrado em Ateísmo e Ciência", "#/ateismo/" + t.id,
          [t.title, t.argument.summary, t.response.compatibility, t.response.divergence]);
        (t.response.verses || []).forEach(function (v) {
          push("biblia", v.ref, (v.text || "").slice(0, 140), 'Citado em "' + t.title + '"', "#/ateismo/" + t.id, [v.ref, v.text]);
        });
      });
    }

    Object.keys(GLOSSARY).forEach(function (term) {
      push("conceito", term.charAt(0).toUpperCase() + term.slice(1), GLOSSARY[term], "Termo do glossário teológico", "#/busca?q=" + encodeURIComponent(term), [term, GLOSSARY[term]]);
    });
  }

  function runSearch(query) {
    var q = normalizeText(query);
    if (!q) return [];
    var scored = SEARCH_INDEX.map(function (item) {
      var idx = item.haystack.indexOf(q);
      if (idx === -1) return null;
      return { item: item, score: idx === 0 ? 0 : idx < 20 ? 1 : 2 };
    }).filter(Boolean);
    scored.sort(function (a, b) { return a.score - b.score; });
    var seen = {};
    var out = [];
    scored.forEach(function (s) {
      var key = s.item.type + s.item.label + s.item.subtitle;
      if (seen[key]) return;
      seen[key] = true;
      out.push(s.item);
    });
    return out.slice(0, 60);
  }

  // ---------- Buscas recentes (localStorage - site real hospedado pelo
  // usuário, não um artifact renderizado dentro do Claude) ----------
  function loadRecentSearches() {
    try {
      var raw = window.localStorage && localStorage.getItem("rc_recent_searches");
      var list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list) ? list : [];
    } catch (e) { return []; }
  }
  function saveRecentSearch(q) {
    if (!q) return;
    try {
      var list = loadRecentSearches().filter(function (x) { return x.toLowerCase() !== q.toLowerCase(); });
      list.unshift(q);
      localStorage.setItem("rc_recent_searches", JSON.stringify(list.slice(0, 6)));
    } catch (e) { /* localStorage indisponível - busca continua funcionando normalmente */ }
  }

  // ============================================================
  // ROUTER
  // ============================================================
  function parseHash() {
    var h = (location.hash || "#/").replace(/^#/, "");
    var qIndex = h.indexOf("?");
    var query = {};
    if (qIndex !== -1) {
      new URLSearchParams(h.slice(qIndex + 1)).forEach(function (v, k) { query[k] = v; });
      h = h.slice(0, qIndex);
    }
    var parts = h.split("/").filter(Boolean);
    if (parts.length === 0) return { name: "home", query: query };
    if (parts[0] === "religiao" && parts[1]) return { name: "religiao", slug: parts[1], query: query };
    if (parts[0] === "comparar" && parts[1] && parts[2]) return { name: "compare", a: parts[1], b: parts[2], query: query };
    if (parts[0] === "comparar") return { name: "compare-hub", query: query };
    if (parts[0] === "linha-do-tempo") return { name: "timeline", query: query };
    if (parts[0] === "biblia" && parts[1]) return { name: "biblia", ritual: parts[1], query: query };
    if (parts[0] === "biblia") return { name: "biblia", query: query };
    if (parts[0] === "busca") return { name: "busca", query: query };
    if (parts[0] === "fontes") return { name: "fontes", query: query };
    if (parts[0] === "sobre") return { name: "sobre", query: query };
    if (parts[0] === "ateismo" && parts[1]) return { name: "ateismo", topic: parts[1], query: query };
    if (parts[0] === "ateismo") return { name: "ateismo", query: query };
    if (parts[0] === "ritos") return { name: "home", scrollTo: "ritos-section", query: query };
    return { name: "home", query: query };
  }

  function navHref(route) {
    return {
      home: "#/", comparar: "#/comparar", ritos: "#/ritos", timeline: "#/linha-do-tempo",
      biblia: "#/biblia", sobre: "#/sobre",
    }[route];
  }

  function renderRoute() {
    var route = parseHash();
    var app = $("#app");
    var html = "";
    if (route.name === "busca" && route.query.q) saveRecentSearch(route.query.q);
    if (route.name === "home") html = pageHome();
    else if (route.name === "religiao") html = pageReligion(route.slug);
    else if (route.name === "compare-hub") html = pageCompareHub();
    else if (route.name === "compare") html = pageCompare(route.a, route.b);
    else if (route.name === "timeline") html = pageTimeline();
    else if (route.name === "biblia") html = pageBiblia(route.ritual);
    else if (route.name === "busca") html = pageBusca(route.query.q || "");
    else if (route.name === "fontes") html = pageFontes();
    else if (route.name === "sobre") html = pageSobre();
    else if (route.name === "ateismo") html = pageAteismo(route.topic);
    else html = pageHome();

    app.innerHTML = html;
    updateActiveNav(route);
    window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
    if (route.scrollTo) {
      var el = document.getElementById(route.scrollTo);
      if (el) setTimeout(function () { el.scrollIntoView({ behavior: "smooth", block: "start" }); }, 60);
    }
    postRenderHooks(route);
  }

  function updateActiveNav(route) {
    $all(".main-nav a, .mobile-drawer a").forEach(function (a) { a.classList.remove("active"); });
    var map = { home: "#/", "compare-hub": "#/comparar", compare: "#/comparar", timeline: "#/linha-do-tempo", biblia: "#/biblia", ateismo: "#/ateismo", fontes: "#/fontes", sobre: "#/sobre" };
    var href = map[route.name];
    if (href) $all('a[href="' + href + '"]').forEach(function (a) { a.classList.add("active"); });
  }

  function miniTimeline() {
    var sorted = RELIGIONS.slice().sort(function (a, b) { return a.id - b.id; }).slice(0, 6);
    return '<div class="grid-3">' + sorted.map(function (r) {
      return '<div class="info-card"><span class="badge ' + statusBadgeClass(r.assessment.status) + '">' + esc(r.foundationYear) + '</span><h3 style="margin-top:10px">' + esc(r.name) + "</h3><p>" + esc(r.founder) + "</p></div>";
    }).join("") + "</div>";
  }

  function searchBoxHtml() {
    return (
      '<div class="search-hero">' +
      '<form id="mini-search-form" class="search-box"><input type="text" id="mini-search-input" placeholder="O que você quer pesquisar? Ex.: água, óleo, incorporação..." aria-label="Buscar"><button class="btn btn-gold" type="submit">Buscar</button></form>' +
      '<div class="search-suggestions">' + ["água", "óleo", "roupa branca", "batismo", "monte", "incorporação", "oferenda", "jejum", "espíritos", "salvação"].map(function (t) {
        return '<button type="button" data-action="search-suggestion" data-q="' + t + '">' + t + "</button>";
      }).join("") + "</div>" +
      "</div>"
    );
  }

  function sourcesPreview() {
    var groups = [["Fontes Bíblicas", SOURCES.biblicas], ["Fontes Históricas", SOURCES.historicas], ["Fontes Acadêmicas", SOURCES.academicas], ["Dados Estatísticos", SOURCES.estatisticas]];
    return '<div class="grid-2">' + groups.map(function (g) {
      return '<div class="info-card"><h3>' + g[0] + "</h3><p>" + g[1].map(function (s) { return esc(s.title); }).join(" · ") + "</p></div>";
    }).join("") + "</div>";
  }

    return '<svg class="btn-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  // ---------- Página de religião individual ----------
  function pageReligion(slug) {
    var r = findReligion(slug);
    if (!r) return '<div class="section container"><p>Religião não encontrada.</p><a href="#/">Voltar</a></div>';

    var practiced = RITUALS.filter(function (rit) {
      var c = (MATRIX[slug] || {})[rit.id];
      return c && (c.status === "sim" || c.status === "diferente" || c.status === "semelhante");
    });

    var ritualCards = practiced.map(function (rit) {
      var c = MATRIX[slug][rit.id];
      var st = STATUS[c.status];
      return (
        '<div class="info-card"><div class="flex-between"><h3>' + rit.icon + " " + esc(rit.name) + '</h3><span class="status-pill" style="background:' + st.color + '22;color:' + st.color + '">' + st.icon + " " + st.label + "</span></div>" +
        "<p><strong>Como usa:</strong> " + glossify(c.usage || "-") + "</p>" +
        "<p><strong>Finalidade:</strong> " + glossify(c.purpose || "-") + "</p>" +
        '<button class="link-btn" data-action="open-similarities" data-ritual="' + rit.id + '">Ver religiões com prática semelhante →</button>' +
        "</div>"
      );
    }).join("") || '<p class="small">Nenhum rito de destaque cadastrado nesta lista para esta tradição.</p>';

    var doctrineRows = [
      ["Deus", r.doctrines.god], ["Jesus", r.doctrines.jesus], ["Salvação", r.doctrines.salvation],
      ["Escrituras", r.doctrines.scripture], ["Vida após a morte", r.doctrines.afterlife],
    ];

    return (
      '<section class="religion-hero"><div class="container">' +
      '<a class="btn btn-outline-light btn-sm" href="#/">← Voltar</a>' +
      '<div class="tag" style="margin-top:16px">' + esc(r.category) + "</div>" +
      "<h1>" + esc(r.name) + "</h1>" +
      "<p>" + glossify(r.description) + "</p>" +
      '<div class="facts-grid">' +
      fact("Fundador ou figura central", r.founder) + fact("Ano aproximado", r.foundationYear) +
      fact("País de origem", r.originCountry) + fact("Chegada ao Brasil", r.brazilArrival) +
      fact("Fiéis no mundo", r.followersWorld) + fact("Fiéis no Brasil", r.followersBrazil) +
      "</div></div></section>" +

      '<section class="section"><div class="container">' +
      '<div class="section-head"><div><span class="eyebrow">Doutrina</span><h2>No que acredita?</h2></div></div>' +
      '<div class="doctrine-grid">' + doctrineRows.map(function (d) {
        return '<div class="info-card"><h3>' + d[0] + "</h3><p>" + glossify(d[1]) + "</p></div>";
      }).join("") + "</div></div></section>" +

      '<section class="section" style="background:var(--bg-elevated)"><div class="container">' +
      '<div class="section-head"><div><span class="eyebrow">Práticas</span><h2>Principais Ritos</h2></div></div>' +

  // ============================================================
  // COMPARADOR - motor de comparação tema a tema (dados reais)
  // ============================================================
  // Temas doutrinários (texto livre em data-religions.js) - comparados
  // por sobreposição de palavras-chave reais dos dois textos cadastrados.
  var COMPARE_DOCTRINE_THEMES = [
    { key: "god", icon: "🌌", label: "Deus", field: "god" },
    { key: "jesus", icon: "✝", label: "Jesus", field: "jesus" },
    { key: "salvation", icon: "🔑", label: "Salvação", field: "salvation" },
    { key: "afterlife", icon: "🌅", label: "Vida após a morte", field: "afterlife" },
  ];
  // Temas rituais (categóricos em data-matrix.js) - todos os ritos já
  // cadastrados no sistema entram na comparação, na mesma ordem usada
  // na tabela geral de ritos e práticas.
  var COMPARE_RITUAL_THEME_IDS = [
    "escrituras", "agua", "oracao", "batismo", "ceia-comunhao", "jejum",
    "sacerdocio", "acesso-a-deus", "confissao", "imagens", "oleo-uncao",
    "imposicao-maos", "oferendas", "incorporacao", "peregrinacao",
    "velas-incenso", "roupa-branca",
  ];
  var COMPARE_STOPWORDS = {
    que: 1, como: 1, para: 1, com: 1, uma: 1, um: 1, de: 1, da: 1, do: 1, das: 1, dos: 1,
    em: 1, por: 1, sobre: 1, nao: 1, sao: 1, foi: 1, ser: 1, tem: 1, seu: 1, sua: 1, seus: 1,
    suas: 1, mais: 1, pela: 1, pelo: 1, aos: 1, num: 1, numa: 1, esta: 1, este: 1, isso: 1,
    essa: 1, esse: 1, mas: 1, ou: 1, ao: 1, na: 1, no: 1, se: 1, sem: 1, ja: 1, the: 1, and: 1,
  };
  function compareTokens(str) {
    return normalizeText(str).split(/[^a-z0-9]+/i).filter(function (w) { return w.length > 2 && !COMPARE_STOPWORDS[w]; });
  }
  function jaccardSim(tokensA, tokensB) {
    var setB = {};
    tokensB.forEach(function (t) { setB[t] = true; });
    var union = {}, unionCount = 0, inter = 0, seenA = {};
    tokensA.concat(tokensB).forEach(function (t) { if (!union[t]) { union[t] = true; unionCount++; } });
    tokensA.forEach(function (t) { if (!seenA[t]) { seenA[t] = true; if (setB[t]) inter++; } });
    return unionCount ? inter / unionCount : 0;
  }
  function sharedTokens(tokensA, tokensB, n) {
    var setB = {}, seen = {}, out = [];
    tokensB.forEach(function (t) { setB[t] = true; });
    tokensA.forEach(function (t) { if (setB[t] && !seen[t]) { seen[t] = true; out.push(t); } });
    return out.slice(0, n || 3);
  }
  function excerpt(str, n) {
    str = (str || "").toString().trim();
    if (str.length <= n) return str;
    var cut = str.slice(0, n);
    var lastSpace = cut.lastIndexOf(" ");
    if (lastSpace > n * 0.6) cut = cut.slice(0, lastSpace);
    return cut + "…";
  }

  function compareDoctrineTheme(def, a, b) {
    var aText = a.doctrines[def.field] || "", bText = b.doctrines[def.field] || "";
    var ta = compareTokens(aText), tb = compareTokens(bText);
    var score = jaccardSim(ta, tb);
    var relation = score >= 0.12 ? "semelhante" : "diferente";
    var note;
    if (relation === "semelhante") {
      var shared = sharedTokens(ta, tb, 4);
      note = shared.length
        ? "Pontos em comum identificados nos textos cadastrados de ambas: " + shared.join(", ") + "."
        : "As posições registradas para as duas tradições convergem em termos gerais.";
    } else {
      note = a.shortName + ": “" + excerpt(aText, 100) + "” · " + b.shortName + ": “" + excerpt(bText, 100) + "”";
    }
    return { key: def.key, icon: def.icon, label: def.label, kind: "doctrine", aText: aText, bText: bText, relation: relation, note: note };
  }

  function compareRitualTheme(ritId, a, b) {
    var rit = findRitual(ritId);
    var ca = (MATRIX[a.slug] || {})[ritId], cb = (MATRIX[b.slug] || {})[ritId];
    var sa = ca ? ca.status : "naplica", sb = cb ? cb.status : "naplica";
    var aPractices = sa !== "nao" && sa !== "naplica";
    var bPractices = sb !== "nao" && sb !== "naplica";
    var relation, note;
    if (sa === "naplica" || sb === "naplica") {
      relation = "naplica";
      note = sa === "naplica" && sb === "naplica"
        ? "Não há dado cadastrado sobre " + rit.name + " para nenhuma das duas tradições."
        : "Não há dado comparável sobre " + rit.name + " para " + (sa === "naplica" ? a.shortName : b.shortName) + ".";
    } else if (!aPractices && !bPractices) {
      relation = "naplica";
      note = "Nenhuma das duas tradições pratica " + rit.name + ".";
    } else if (aPractices !== bPractices) {
      relation = "diferente";
      var who = aPractices ? a.shortName : b.shortName, other = aPractices ? b.shortName : a.shortName;
      var whoUsage = aPractices ? ca.usage : cb.usage;
      note = who + " pratica " + rit.name + (whoUsage ? " (" + whoUsage + ")" : "") + "; " + other + " não pratica.";
    } else if (sa === sb) {
      relation = "semelhante";
      note = "Ambas praticam de forma semelhante entre si (" + STATUS[sa].label.toLowerCase() + ").";
    } else {
      relation = "diferente";
      note = a.shortName + ": " + (ca.purpose || ca.usage || STATUS[sa].label) + " · " + b.shortName + ": " + (cb.purpose || cb.usage || STATUS[sb].label);
    }
    return {
      key: ritId, icon: rit.icon, label: rit.name, kind: "ritual", rit: rit,
      aText: ca && ca.usage ? ca.usage : (STATUS[sa] ? STATUS[sa].label : "Não se aplica"),
      bText: cb && cb.usage ? cb.usage : (STATUS[sb] ? STATUS[sb].label : "Não se aplica"),
      relation: relation, note: note,
    };
  }

  function buildComparisonThemes(aSlug, bSlug) {
    var a = findReligion(aSlug), b = findReligion(bSlug);
    var themes = [];
    COMPARE_DOCTRINE_THEMES.forEach(function (def) { themes.push(compareDoctrineTheme(def, a, b)); });
    COMPARE_RITUAL_THEME_IDS.forEach(function (id) { if (findRitual(id)) themes.push(compareRitualTheme(id, a, b)); });
    return themes;
  }

  function summarizeComparison(themes, a, b) {
    var sims = themes.filter(function (t) { return t.relation === "semelhante"; });
    var diffs = themes.filter(function (t) { return t.relation === "diferente"; });
    if (a.assessment.status !== b.assessment.status) {
      diffs.unshift({
        key: "assessment", icon: "⚖️", label: "Avaliação bíblica geral", relation: "diferente",
        note: a.shortName + " está classificada como “" + statusLabel(a.assessment.status) + "”, enquanto " + b.shortName + " está como “" + statusLabel(b.assessment.status) + "”.",
      });
    }
    return { sims: sims, diffs: diffs };
  }

  var COMPARE_RELATION_META = {
    semelhante: { icon: "🟢", label: "Ensinamento semelhante", cls: "rel-sim" },
    diferente: { icon: "🟠", label: "Ensinamento diferente", cls: "rel-diff" },
    naplica: { icon: "⚪", label: "Não se aplica", cls: "rel-na" },
  };
  function compareRelationPill(relation) {
    var m = COMPARE_RELATION_META[relation] || COMPARE_RELATION_META.naplica;
    return '<span class="comparativo-pill ' + m.cls + '">' + m.icon + " " + esc(m.label) + "</span>";

    "idade-media": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3a5 5 0 0 1 5 5c0 2-1 3.2-2 4.2V14h-6v-1.8c-1-1-2-2.2-2-4.2a5 5 0 0 1 5-5Z" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 21v-6h14v6M3 21h18M12 14v3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    reforma: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 5.5C6 4.5 9 4.5 12 6c3-1.5 6-1.5 8-.5v13c-2-1-5-1-8 .5-3-1.5-6-1.5-8-.5v-13Z" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 6v13" stroke-linecap="round"/></svg>',
    "seculo-xix": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 21V10l8-6 8 6v11" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 21v-7h6v7M4 21h16" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    "seculo-xx": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2v3M12 22v-4M5 9l14 0M4 22h16l-2-9H6l-2 9Z" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    contemporaneo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 4 6 4 9s-1.5 6.5-4 9c-2.5-2.5-4-6-4-9s1.5-6.5 4-9Z" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  };

  // Eras usadas para agrupar a linha do tempo como uma árvore histórica.
  // A data exata de cada religião não é alterada - apenas um ano
  // aproximado é extraído do texto já cadastrado (ex.: "~528 a.C." → -528,
  // "1517 / 1530" → 1517) só para decidir em qual bloco cronológico o nó
  // aparece.
  var TIMELINE_ERAS = [
    { key: "antiguidade", label: "Antiguidade", range: "até o ano 499", test: function (y) { return y < 500; } },
    { key: "idade-media", label: "Idade Média", range: "500–1499", test: function (y) { return y >= 500 && y < 1500; } },
    { key: "reforma", label: "Reforma", range: "1500–1799", test: function (y) { return y >= 1500 && y < 1800; } },
    { key: "seculo-xix", label: "Século XIX", range: "1800–1899", test: function (y) { return y >= 1800 && y < 1900; } },
    { key: "seculo-xx", label: "Século XX", range: "1900–1999", test: function (y) { return y >= 1900 && y < 2000; } },
    { key: "contemporaneo", label: "Contemporâneo", range: "a partir de 2000", test: function (y) { return y >= 2000; } },
  ];
  function approxYear(str) {
    if (!str) return null;
    var m = str.match(/(\d{1,4})/);
    if (!m) return null;
    var num = parseInt(m[1], 10);
    return /a\.?\s?c\.?/i.test(str) ? -num : num;
  }
  function eraFor(year) {
    if (year === null) return null;
    for (var i = 0; i < TIMELINE_ERAS.length; i++) if (TIMELINE_ERAS[i].test(year)) return TIMELINE_ERAS[i];
    return null;
  }

  function timelineNode(r) {
    var img = TIMELINE_IMG[r.slug];
    var catColor = TIMELINE_CAT_COLOR[r.category] || "#8b96ad";
    return (
      '<button type="button" class="tl-card" data-action="open-timeline-node" data-slug="' + r.slug + '">' +
      (img ? '<span class="tl-card-img" style="background-image:url(\'' + img + "')\" role=\"img\" aria-label=\"" + esc(r.name) + '"></span>' : "") +
      '<span class="tl-card-body">' +
      '<span class="tl-card-name">' + esc(r.name) + "</span>" +
      '<span class="tl-card-meta">' + esc(r.foundationYear) + " · " + esc(r.originCountry) + "</span>" +
      '<span class="tl-card-desc">' + esc(r.founder) + "</span>" +
      '<span class="tl-card-tag" style="--tag-c:' + catColor + '">' + esc(categoryLabel(r.category)) + "</span>" +
      "</span>" +
      "</button>"
    );
  }

  // Painel especial exibido na coluna "Contemporâneo" quando nenhuma religião
  // cadastrada cai nesse período - convida a examinar o restante do site em
  // vez de deixar a coluna vazia.
  function timelineContemporaryPanel() {
    return (
      '<div class="tl-panel">' +
      '<h4 class="tl-panel-title">O conhecimento aproxima a verdade.</h4>' +
      "<p class=\"tl-panel-text\">Entenda a origem, os fundamentos e as práticas de cada religião e compare com o que a Bíblia ensina.</p>" +
      '<div class="tl-panel-list">' +
      '<span class="tl-panel-item">' + trustIconSVG("shield") + " Informação confiável</span>" +
      '<span class="tl-panel-item">' + trustIconSVG("book") + " Análise imparcial</span>" +
      '<span class="tl-panel-item">' + trustIconSVG("chart") + " Comparação clara</span>" +
      '<span class="tl-panel-item">' + trustIconSVG("heart") + " Respeito a todas as pessoas</span>" +
      "</div>" +
      '<div class="tl-panel-quote"><p>“Conhecereis a verdade, e a verdade vos libertará.”</p><span>João 8:32</span></div>' +
      "</div>"
    );
  }

  function timelineTreeMarkup() {
    var list = RELIGIONS.slice();
    if (STATE.timelineCat !== "todas") list = list.filter(function (r) { return r.category === STATE.timelineCat; });
    var withYear = list.map(function (r) { return { r: r, y: approxYear(r.foundationYear) }; });
    if (STATE.timelinePeriod !== "todas") {
      withYear = withYear.filter(function (x) { var e = eraFor(x.y); return e && e.key === STATE.timelinePeriod; });
    }
    withYear.sort(function (a, b) { return (a.y === null ? 9999 : a.y) - (b.y === null ? 9999 : b.y); });

    if (!withYear.length) return '<div class="timeline-empty">Nenhuma religião encontrada para os filtros selecionados. Tente outra combinação de tradição e período.</div>';

    var byEra = {};
    TIMELINE_ERAS.forEach(function (e) { byEra[e.key] = []; });
    var noEra = [];
    withYear.forEach(function (x) {
      var e = eraFor(x.y);
      if (e) byEra[e.key].push(x.r); else noEra.push(x.r);
    });

    var cols = TIMELINE_ERAS.map(function (e) {
      var items = byEra[e.key];
      var body;
      if (items.length) body = '<div class="tl-col-cards">' + items.map(timelineNode).join("") + "</div>";
      else if (e.key === "contemporaneo" && STATE.timelineCat === "todas") body = timelineContemporaryPanel();
      else body = '<div class="tl-col-empty">Nenhum resultado neste período com os filtros atuais.</div>';
      return (
        '<div class="tl-col">' +
        '<div class="tl-col-head"><span class="tl-col-icon">' + (TIMELINE_ERA_ICON[e.key] || "") + '</span>' +
        '<span class="tl-col-title">' + esc(e.label.toUpperCase()) + '</span>' +
        '<span class="tl-col-range">' + esc(e.range) + "</span></div>" +
        body +
        "</div>"
      );
    }).join("");

    var noEraCol = noEra.length
      ? '<div class="tl-col"><div class="tl-col-head"><span class="tl-col-title">DATA INCERTA</span></div><div class="tl-col-cards">' + noEra.map(timelineNode).join("") + "</div></div>"
      : "";

    return (
      '<div class="tl-grid" style="--tl-zoom:' + STATE.timelineZoom + '">' +
      '<div class="tl-rail"></div>' + cols + noEraCol +
      "</div>"
    );
  }

  function applyTimelineZoom() {
    var el = $(".tl-grid");
    if (el) el.style.setProperty("--tl-zoom", STATE.timelineZoom);
    var lvl = $("#timeline-zoom-level");
    if (lvl) lvl.textContent = Math.round(STATE.timelineZoom * 100) + "%";
  }

  function openTimelineNodeModal(slug, triggerEl) {
    var r = findReligion(slug);
    if (!r) return;
    var content = (
      '<div class="tag" style="background:var(--gray-100);color:var(--text)">' + esc(categoryLabel(r.category)) + "</div>" +
      '<h3 style="margin-top:10px">' + esc(r.name) + "</h3>" +
      '<p class="sub">' + esc(r.foundationYear) + " · " + esc(r.originCountry) + "</p>" +
      '<div class="tl-detail-facts">' +
      fact("Fundador ou figura central", r.founder) + fact("País de origem", r.originCountry) +
      fact("Chegada ao Brasil", r.brazilArrival) + fact("Categoria", categoryLabel(r.category)) +
      "</div>" +
      '<a class="btn btn-gold btn-sm" href="#/religiao/' + r.slug + '" data-action="close-modal">Ver página completa →</a>'
    );
    openModal(content, triggerEl);
  }

  function searchResultsMarkup(q, results, totalCount) {
    if (!q) return '<p class="small text-center">Digite um termo acima para buscar em religiões, ritos, práticas, doutrina, Bíblia, história e conceitos teológicos.</p>';
    return (
      '<p class="small">' + totalCount + ' resultado(s) para "' + esc(q) + '"' + (results.length !== totalCount ? " · mostrando " + results.length : "") + "</p>" +
      results.map(function (r) {
        return (
          '<a href="' + r.href + '" class="info-card search-result-card">' +
          '<span class="src-type-badge">' + esc(r.typeLabel) + "</span>" +
          "<h3>" + highlightMatch(r.label, q) + "</h3>" +
          "<p>" + highlightMatch(r.subtitle || "", q) + "</p>" +
          '<p class="reason">' + esc(r.reason) + "</p>" +
          '<span class="examine">Examinar →</span>' +
          "</a>"
        );
      }).join("") +
      (results.length === 0 ? '<p>Nada encontrado para este filtro. Tente <button class="link-btn" data-action="filter-search" data-type="todas">ver todos os resultados</button> ou outro termo, como <button class="link-btn" data-action="search-suggestion" data-q="água">água</button> ou <button class="link-btn" data-action="search-suggestion" data-q="jejum">jejum</button>.</p>' : "")
    );
  }

  function searchBodyMarkup(q) {
    var all = q ? runSearch(q) : [];
    var counts = {};
    all.forEach(function (r) { counts[r.type] = (counts[r.type] || 0) + 1; });
    if (STATE.searchFilter !== "todas" && !counts[STATE.searchFilter]) STATE.searchFilter = "todas";
    var results = STATE.searchFilter === "todas" ? all : all.filter(function (r) { return r.type === STATE.searchFilter; });
    var recent = !q ? loadRecentSearches() : [];
    var filterChips = q ? SEARCH_TYPES.filter(function (t) { return t.key === "todas" || counts[t.key]; }).map(function (t) {
      var n = t.key === "todas" ? all.length : counts[t.key] || 0;
      return '<button type="button" class="' + (STATE.searchFilter === t.key ? "active" : "") + '" data-action="filter-search" data-type="' + t.key + '">' + esc(t.label) + '<span class="n">(' + n + ")</span></button>";
    }).join("") : "";
    return (
      (q ? '<div class="search-filters">' + filterChips + "</div>" : "") +
      (!q && recent.length ? '<div class="search-recent"><span class="label">Buscas recentes</span><div class="search-suggestions">' + recent.map(function (t) { return '<button type="button" data-action="search-suggestion" data-q="' + esc(t) + '">' + esc(t) + "</button>"; }).join("") + "</div></div>" : "") +
      '<div class="search-results">' + searchResultsMarkup(q, results, all.length) + "</div>"
    );
  }

  function openModal(innerHtml, triggerEl) {
    STATE.lastFocusedEl = triggerEl || document.activeElement;
    var overlay = $("#modal-overlay");
    $("#modal-body").innerHTML = innerHtml;
    overlay.classList.add("open");
    overlay.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    var modal = overlay.querySelector(".modal");
    if (modal) {
      modal.setAttribute("tabindex", "-1");
      setTimeout(function () { modal.focus(); }, 0);
    }
  }
  function closeModal() {
    var overlay = $("#modal-overlay");
    overlay.classList.remove("open");
    overlay.setAttribute("aria-hidden", "true");
    $("#modal-body").innerHTML = "";
    document.body.style.overflow = "";
    if (STATE.lastFocusedEl && typeof STATE.lastFocusedEl.focus === "function") {
      STATE.lastFocusedEl.focus();
    }
    STATE.lastFocusedEl = null;
  }

  // ---------- Comparador bíblico: lógica ----------
  function simplifyRefForApi(ref) {
    var m = ref.match(/^(.+?)\s+(\d+):(.+)$/);
    if (!m) return ref;
    var book = m[1], chapter = m[2], versePart = m[3];
    var firstToken = versePart.split(",")[0].trim();
    return book + " " + chapter + ":" + firstToken;
  }

  function initBibleComparator(prefillRef) {
    var checksEl = $("#bible-version-checks");
    var form = $("#bible-compare-form");
    var resultsEl = $("#bible-results");
    if (!form) return;

    fetchVersions().then(function (versions) {
      var codes = versions.map(function (v) { return (v.version || v.code || v).toString().toLowerCase(); }).filter(function (c) { return c && c.length <= 6; });
      if (!codes.length) codes = Object.keys(VERSION_LABELS);
      var defaultOn = ["nvi", "acf", "ra", "ntlh"].filter(function (c) { return codes.indexOf(c) !== -1; });
      if (!defaultOn.length) defaultOn = codes.slice(0, 3);
      checksEl.innerHTML = codes.map(function (c) {
        var label = VERSION_LABELS[c] || c.toUpperCase();
        return '<label class="version-chip"><input type="checkbox" value="' + esc(c) + '"' + (defaultOn.indexOf(c) !== -1 ? " checked" : "") + "> " + esc(label) + "</label>";
      }).join("");
      if (prefillRef) form.dispatchEvent(new Event("submit"));
    }).catch(function () {
      var codes = ["nvi", "acf", "ra", "ntlh"];
      checksEl.innerHTML =
        '<span class="api-note" style="width:100%">Não foi possível confirmar a lista de versões com o servidor agora - mostrando as versões mais comuns. Se a busca abaixo falhar, tente novamente em instantes.</span>' +
        codes.map(function (c) {
          return '<label class="version-chip"><input type="checkbox" value="' + c + '" checked> ' + esc(VERSION_LABELS[c]) + "</label>";
        }).join("");
      if (prefillRef) form.dispatchEvent(new Event("submit"));
    });

    form.onsubmit = function (e) {
      e.preventDefault();
      var raw = $("#bible-ref-input").value.trim();
      if (!raw) return;
      var refToUse = simplifyRefForApi(raw);
      var selected = $all('#bible-version-checks input[type="checkbox"]:checked').map(function (i) { return i.value; });
      if (!selected.length) { resultsEl.innerHTML = '<p class="api-note">Selecione ao menos uma versão para comparar.</p>'; return; }
      resultsEl.innerHTML = '<p class="small">Buscando…</p>';
      compareVerse(refToUse, selected).then(function (out) {
        resultsEl.innerHTML = out.results.map(function (r) {
          if (r.error) return '<div class="bible-result error"><div class="v-label">' + esc(r.label) + "</div>" + esc(r.error) + "</div>";
          return '<div class="bible-result"><div class="v-label">' + esc(r.label) + '</div><div>“' + esc(r.text) + "”</div></div>";
        }).join("") + '<p class="api-status">Referência interpretada: ' + esc(refToUse) + " · fonte: A Bíblia Digital (ao vivo)</p>";
      }).catch(function (err) {
        resultsEl.innerHTML = '<p class="api-note">' + esc(err.message || "Não foi possível comparar agora. A API bíblica pode estar temporariamente indisponível ou o limite de consultas sem login foi atingido (20/hora). Os versículos já cadastrados no site continuam disponíveis normalmente nas páginas de cada religião.") + "</p>";
      });
    };
  }

  // Assistente de IA na Busca Inteligente: chama a função serverless
  // /api/ask (que consulta a API da Anthropic no servidor) e renderiza
  // a resposta. Guarda de "aiAsking" evita disparar múltiplas
  // requisições simultâneas se o usuário apertar Enter várias vezes.
  function askAI() {
    if (STATE.aiAsking) return;
    var input = $("#ai-ask-input");
    var resultEl = $("#ai-ask-result");
    var btn = $("#ai-ask-submit");
    if (!input || !resultEl) return;
    var question = input.value.trim();
    if (!question) {
      resultEl.innerHTML = aiAskErrorMarkup("Digite uma pergunta antes de enviar.");
      return;
    }
    STATE.aiAsking = true;
    if (btn) btn.disabled = true;
    resultEl.innerHTML = aiAskLoadingMarkup();
    fetch("/api/ask", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ question: question }),
    })
      .then(function (res) {
        return res.json().then(function (data) { return { ok: res.ok, data: data }; });
      })
      .then(function (result) {
        if (!result.ok || result.data.error) {
          resultEl.innerHTML = aiAskErrorMarkup(result.data.error || "Não foi possível obter uma resposta agora. Tente novamente.");
          return;
        }
        resultEl.innerHTML = aiAskAnswerMarkup(result.data.answer, result.data.sources);
      })
      .catch(function () {
        resultEl.innerHTML = aiAskErrorMarkup("Não foi possível conectar ao serviço de IA. Verifique sua conexão e tente novamente.");
      })
      .finally(function () {
        STATE.aiAsking = false;
        if (btn) btn.disabled = false;
      });
  }

  document.addEventListener("input", debounce(function (e) {

  // Parallax muito sutil da hero (título e Bíblia se movem em velocidades
  // levemente diferentes ao mover o mouse / rolar a página, reforçando a
  // sensação de profundidade). Um único listener persistente, religado a
  // #hero a cada evento — a home é a única página com esse elemento, então
  // o custo é desprezível nas demais rotas. Totalmente desativado quando o
  // usuário pede redução de movimento no sistema.
  function initHeroParallax() {
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var raf = null;
    window.addEventListener("mousemove", function (e) {
      var hero = document.getElementById("hero");
      if (!hero) return;
      var r = hero.getBoundingClientRect();
      if (e.clientY < r.top || e.clientY > r.bottom) return;
      var x = e.clientX / window.innerWidth - 0.5;
      var y = e.clientY / window.innerHeight - 0.5;
      if (raf) cancelAnimationFrame(raf);
      raf = requestAnimationFrame(function () {
        var slow = hero.querySelector(".hero-parallax-slow");
        var fast = hero.querySelector(".hero-parallax-fast");
        if (slow) slow.style.transform = "translate3d(" + (x * 5) + "px," + (y * 3) + "px,0)";
        if (fast) fast.style.transform = "translate3d(" + (x * -11) + "px," + (y * -7) + "px,0)";
      });
    }, { passive: true });
    window.addEventListener("scroll", function () {
      var hero = document.getElementById("hero");
      if (!hero) return;
      var p = Math.min(window.scrollY / 900, 1);
      if (raf) cancelAnimationFrame(raf);
      raf = requestAnimationFrame(function () {
        var dots = hero.querySelector(".hero-bg-dots");
        if (dots) dots.style.transform = "translate3d(0," + (p * -16) + "px,0)";
      });
    }, { passive: true });
  }
