  // Assistente de IA na Busca Inteligente: chama a função serverless
  // /api/ask (que consulta a API da Anthropic no servidor) e renderiza
  // a resposta. Guarda de "aiAsking" evita disparar múltiplas
  // requisições simultâneas se o usuário apertar Enter várias vezes.
  function askAI() {
    if (STATE.aiAsking) return;
    var input = $("#ai-ask-input");
    var resultEl = $("#ai-ask-result");
    var btn = $("#ai-ask-submit");
    if (!input || !resultEl) return;
    var question = input.value.trim();
    if (!question) {
      resultEl.innerHTML = aiAskErrorMarkup("Digite uma pergunta antes de enviar.");
      return;
    }
    STATE.aiAsking = true;
    if (btn) btn.disabled = true;
    resultEl.innerHTML = aiAskLoadingMarkup();
    fetch("/api/ask", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ question: question }),
    })
      .then(function (res) {
        return res.json().then(function (data) { return { ok: res.ok, data: data }; });
      })
      .then(function (result) {
        if (!result.ok || result.data.error) {
          resultEl.innerHTML = aiAskErrorMarkup(result.data.error || "Não foi possível obter uma resposta agora. Tente novamente.");
          return;
        }
        resultEl.innerHTML = aiAskAnswerMarkup(result.data.answer, result.data.sources);
      })
      .catch(function () {
        resultEl.innerHTML = aiAskErrorMarkup("Não foi possível conectar ao serviço de IA. Verifique sua conexão e tente novamente.");
      })
      .finally(function () {
        STATE.aiAsking = false;
        if (btn) btn.disabled = false;
      });
  }

  // usuário pede redução de movimento no sistema.
  function initHeroParallax() {
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var raf = null;
    window.addEventListener("mousemove", function (e) {

      if (e.clientY < r.top || e.clientY > r.bottom) return;
      var x = e.clientX / window.innerWidth - 0.5;
      var y = e.clientY / window.innerHeight - 0.5;
      if (raf) cancelAnimationFrame(raf);
      raf = requestAnimationFrame(function () {
        var slow = hero.querySelector(".hero-parallax-slow");
        var fast = hero.querySelector(".hero-parallax-fast");
        if (slow) slow.style.transform = "translate3d(" + (x * 5) + "px," + (y * 3) + "px,0)";

      var hero = document.getElementById("hero");
      if (!hero) return;

/* ============================================================
   EFEITOS SACROS — camada 100% aditiva e independente do app.js:
   partículas douradas ao redor da Bíblia (hero da Home) e rastro
   celestial do cursor. Não lê nem grava nenhum dado do site, não
   participa do roteamento - apenas observa o DOM para ligar/desligar
   os efeitos quando a Home entra/sai de cena.

   Performance: Canvas 2D com poucas partículas, pausado quando fora
   da viewport (IntersectionObserver) ou com a aba oculta
   (visibilitychange); nada roda se o usuário pedir menos movimento
   (prefers-reduced-motion) e a quantidade de partículas cai bastante
   em telas pequenas.
   ============================================================ */
(function () {
  "use strict";

  var reduceMotionQuery = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;
  function prefersReducedMotion() { return !!(reduceMotionQuery && reduceMotionQuery.matches); }

  var finePointerQuery = window.matchMedia ? window.matchMedia("(hover: hover) and (pointer: fine)") : null;
  function hasFinePointer() { return !!(finePointerQuery && finePointerQuery.matches); }

  function isSmallScreen() { return window.innerWidth < 720; }
  function rand(min, max) { return min + Math.random() * (max - min); }
  function now() { return window.performance && performance.now ? performance.now() : Date.now(); }

  // ============================================================
  // Sistema 1 — partículas douradas orgânicas ao redor da Bíblia
  // + pequenas estrelas celestiais muito discretas sobre o mapa-múndi
  // de fundo (mesmo canvas/loop, para manter só uma animação ativa).
  // A luz da Bíblia é sempre maior/mais opaca que a das estrelas do
  // mapa, para preservar a hierarquia visual pedida.
  // ============================================================
  var bibleParticles = (function () {
    var canvas = null, ctx = null, raf = null, particles = [], stars = [], running = false, io = null, lastTime = 0;
    var STAR_PALETTE = ["255,247,222", "230,196,110", "246,228,168", "217,161,62"]; // branco quente, dourado, dourado claro, âmbar

    function maxParticles() {
      if (prefersReducedMotion()) return 0;
      return isSmallScreen() ? 6 : 20;
    }
    function maxStars() {
      if (prefersReducedMotion()) return 0;
      return isSmallScreen() ? 10 : 30;
    }

    function resize() {
      if (!canvas || !canvas.parentElement) return;
      var w = canvas.parentElement.clientWidth, h = canvas.parentElement.clientHeight;
      if (!w || !h) return;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    // Estrelas paradas (sem deslocamento) espalhadas sobre a região do
    // mapa-múndi na foto de fundo (metade esquerda/superior do hero) -
    // só piscam de opacidade e, poucas delas, abrem um halo que se
    // expande e desaparece bem devagar, como uma estrela ao longe.
    // Bem mais fracas/pequenas que as partículas da Bíblia de propósito.
    function spawnStar(w, h, seedLife) {
      return {
        x: rand(w * 0.02, w * 0.63),
        y: rand(h * 0.03, h * 0.5),
        baseRadius: rand(0.6, 1.6),
        color: STAR_PALETTE[Math.floor(rand(0, STAR_PALETTE.length))],
        life: seedLife ? rand(0, 20000) : 0,
        maxLife: rand(15000, 27000),
        twinkleSpeed: rand(0.0004, 0.0011),
        twinklePhase: rand(0, Math.PI * 2),
        baseOpacity: rand(0.2, 0.5),
        halo: Math.random() < 0.15,
        haloPeriod: rand(6500, 11000),
        haloPhaseOffset: rand(0, 9000),
      };
    }

    function drawStars(w, h, dt) {
      var target = maxStars();
      if (target === 0) return;
      while (stars.length < target) stars.push(spawnStar(w, h, true));
      if (stars.length > target) stars.length = target;
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        s.life += dt;
        var lifeRatio = s.life / s.maxLife;
        if (lifeRatio >= 1) { stars[i] = spawnStar(w, h, false); continue; }
        var fade = lifeRatio < 0.12 ? lifeRatio / 0.12 : (lifeRatio > 0.85 ? Math.max(0, 1 - (lifeRatio - 0.85) / 0.15) : 1);
        var twinkle = 0.55 + 0.45 * Math.sin(s.life * s.twinkleSpeed * 6.283 + s.twinklePhase);
        var alpha = s.baseOpacity * fade * twinkle;
        if (alpha > 0.015) {
          var r = s.baseRadius * 2.6;
          var g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r);
          g.addColorStop(0, "rgba(" + s.color + "," + alpha + ")");
          g.addColorStop(0.5, "rgba(" + s.color + "," + (alpha * 0.35) + ")");
          g.addColorStop(1, "rgba(" + s.color + ",0)");
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
          ctx.fill();
        }
        if (s.halo) {
          var pt = ((s.life + s.haloPhaseOffset) % s.haloPeriod) / s.haloPeriod;
          if (pt < 0.55) {
            var ht = pt / 0.55;
            var haloR = 2.5 + ht * 10;
            var haloAlpha = (1 - ht) * 0.16 * fade;
            if (haloAlpha > 0.012) {
              ctx.strokeStyle = "rgba(" + s.color + "," + haloAlpha + ")";
              ctx.lineWidth = 0.75;
              ctx.beginPath();
              ctx.arc(s.x, s.y, haloR, 0, Math.PI * 2);
              ctx.stroke();
            }
          }
        }
      }
    }

    // Nascem numa região aproximada onde a Bíblia aparece na foto de
    // fundo (canto inferior esquerdo do hero) e sobem devagar.
    function spawn(w, h) {
      var narrow = isSmallScreen();
      // Origem bem colada ao livro (não espalhada pela cena toda), para
      // ler claramente como "saindo da Bíblia" - a maior parte nasce
      // rente à capa/lombada e sobe a partir dali.
      var originX = narrow ? w * 0.30 : w * 0.20;
      var originY = narrow ? h * 0.74 : h * 0.63;
      var spreadX = narrow ? w * 0.16 : w * 0.115;
      var spreadY = narrow ? h * 0.075 : h * 0.075;
      return {
        x: originX + rand(-spreadX, spreadX),
        y: originY + rand(-spreadY * 0.5, spreadY),
        size: rand(1.3, 3.2),
        speed: rand(5, 14),
        drift: rand(-3, 3),
        life: 0,
        maxLife: rand(5500, 11000),
        baseOpacity: rand(0.4, 0.95),
        twinkleSpeed: rand(0.0006, 0.0018),
        twinklePhase: rand(0, Math.PI * 2),
        sparkle: Math.random() < 0.35,
      };
    }

    function step(t) {
      if (!running || !canvas) return;
      var dt = lastTime ? Math.min(t - lastTime, 48) : 16;
      lastTime = t;
      var w = canvas.clientWidth, h = canvas.clientHeight;
      ctx.clearRect(0, 0, w, h);

      // Estrelas do mapa desenhadas primeiro (mais fracas/pequenas),
      // depois as partículas da Bíblia por cima - garante que a luz do
      // livro sempre pareça mais forte que a do mapa.
      drawStars(w, h, dt);

      var target = maxParticles();
      if (target === 0) { raf = requestAnimationFrame(step); return; }
      while (particles.length < target) particles.push(spawn(w, h));
      if (particles.length > target) particles.length = target;

      for (var i = particles.length - 1; i >= 0; i--) {
        var p = particles[i];
        p.life += dt;
        p.y -= (p.speed * dt) / 1000;
        p.x += (p.drift * dt) / 1000;
        var lifeRatio = p.life / p.maxLife;
        var fade = lifeRatio < 0.15 ? lifeRatio / 0.15 : (lifeRatio > 0.75 ? Math.max(0, 1 - (lifeRatio - 0.75) / 0.25) : 1);
        var twinkle = 0.7 + 0.3 * Math.sin(p.life * p.twinkleSpeed * 6.283 + p.twinklePhase);
        var alpha = p.baseOpacity * fade * twinkle;
        if (lifeRatio >= 1 || p.y < -12 || alpha <= 0.01) { particles[i] = spawn(w, h); continue; }
        // Núcleo bem brilhante (quase branco) + halo dourado suave em
        // volta - lê como um pequeno "pingo" de luz, não uma mancha.
        var r = p.size * 3.4;
        var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
        g.addColorStop(0, "rgba(255,253,244," + alpha + ")");
        g.addColorStop(0.22, "rgba(255,244,214," + (alpha * 0.9) + ")");
        g.addColorStop(0.5, "rgba(230,196,110," + (alpha * 0.45) + ")");
        g.addColorStop(1, "rgba(230,196,110,0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fill();
        // Um brilho fino em cruz nos "pingos" mais cintilantes -
        // reforça a sensação de brilhante/faiscante sem virar efeito
        // de jogo (linhas muito finas, opacidade baixa).
        if (p.sparkle && twinkle > 0.92) {
          var flareLen = r * 2.6;
          var flareAlpha = alpha * (twinkle - 0.92) * 6;
          ctx.strokeStyle = "rgba(255,250,235," + flareAlpha + ")";
          ctx.lineWidth = 0.7;
          ctx.beginPath();
          ctx.moveTo(p.x - flareLen, p.y); ctx.lineTo(p.x + flareLen, p.y);
          ctx.moveTo(p.x, p.y - flareLen); ctx.lineTo(p.x, p.y + flareLen);
          ctx.stroke();
        }
      }
      raf = requestAnimationFrame(step);
    }

    function onVisibility() {
      if (!canvas) return;
      if (document.hidden) { running = false; if (raf) cancelAnimationFrame(raf); }
      else if (canvas.isConnected) { running = true; lastTime = 0; raf = requestAnimationFrame(step); }
    }

    function start(el) {
      stop();
      if (!el || !el.getContext) return;
      canvas = el; ctx = canvas.getContext("2d");
      if (!ctx || prefersReducedMotion()) { canvas = null; ctx = null; return; }
      resize();
      particles = []; stars = [];
      running = true; lastTime = 0;
      raf = requestAnimationFrame(step);
      window.addEventListener("resize", resize, { passive: true });
      document.addEventListener("visibilitychange", onVisibility);
      if (window.IntersectionObserver) {
        io = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) { if (!running && !document.hidden) { running = true; lastTime = 0; raf = requestAnimationFrame(step); } }
            else { running = false; if (raf) cancelAnimationFrame(raf); }
          });
        }, { threshold: 0.01 });
        io.observe(canvas);
      }
    }

    function stop() {
      running = false;
      if (raf) cancelAnimationFrame(raf);
      raf = null;
      if (io) { io.disconnect(); io = null; }
      window.removeEventListener("resize", resize);
      document.removeEventListener("visibilitychange", onVisibility);
      canvas = null; ctx = null; particles = []; stars = [];
    }

    return { start: start, stop: stop };
  })();

  // A Home é recriada inteira (innerHTML) a cada navegação da SPA -
  // observa #app para religar/desligar as partículas junto com o
  // canvas da Bíblia aparecendo/sumindo, sem tocar no router do
  // app.js.
  function syncBibleCanvas() {
    var el = document.getElementById("hero-bible-canvas");
    if (el) bibleParticles.start(el); else bibleParticles.stop();
  }

  // ============================================================
  // Sistema 2 — rastro celestial do cursor (poeira de luz)
  // ============================================================
  var cursorTrail = (function () {
    var canvas, ctx, raf = null, particles = [], running = false, lastMove = 0, lastTime = 0, lastSpawn = 0;
    var mx = -9999, my = -9999;

    function resize() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(window.innerWidth * dpr);
      canvas.height = Math.round(window.innerHeight * dpr);
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function ensureRunning() {
      if (running) return;
      running = true; lastTime = 0;
      raf = requestAnimationFrame(step);
    }

    // Poeira de estrelas minimalista: poucas partículas, rastro muito
    // curto (vida curta) e um pequeno intervalo mínimo entre
    // nascimentos, mesmo que o mousemove dispare com muito mais
    // frequência - evita qualquer sensação de "rastro denso".
    function onMove(e) {
      mx = e.clientX; my = e.clientY;
      lastMove = now();
      if (lastMove - lastSpawn > 40) {
        lastSpawn = lastMove;
        particles.push({
          x: mx + rand(-1.5, 1.5), y: my + rand(-1.5, 1.5),
          vx: rand(-0.012, 0.012), vy: rand(-0.03, -0.01),
          size: rand(0.9, 1.8), life: 0, maxLife: rand(220, 380),
          warm: Math.random() < 0.5,
        });
      }
      if (particles.length > 16) particles.splice(0, particles.length - 16);
      ensureRunning();
    }

    function step(t) {
      var dt = lastTime ? Math.min(t - lastTime, 48) : 16;
      lastTime = t;
      ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);

      for (var i = particles.length - 1; i >= 0; i--) {
        var p = particles[i];
        p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt;
        var lr = p.life / p.maxLife;
        if (lr >= 1) { particles.splice(i, 1); continue; }
        var alpha = (1 - lr) * 0.5;
        var size = p.size * (1 - lr * 0.35);
        ctx.fillStyle = p.warm ? "rgba(255,244,222," + alpha + ")" : "rgba(230,196,110," + alpha + ")";
        ctx.beginPath();
        ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
        ctx.fill();
      }

      var idle = now() - lastMove > 2000;
      if (!idle && mx > -9000) {
        var g = ctx.createRadialGradient(mx, my, 0, mx, my, 13);
        g.addColorStop(0, "rgba(255,248,230,0.32)");
        g.addColorStop(1, "rgba(255,248,230,0)");
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(mx, my, 13, 0, Math.PI * 2); ctx.fill();
      }

      if (particles.length === 0 && idle) { running = false; return; }
      raf = requestAnimationFrame(step);
    }

    function onVisibility() {
      if (document.hidden) { running = false; if (raf) cancelAnimationFrame(raf); }
    }

    function init() {
      if (prefersReducedMotion() || !hasFinePointer() || isSmallScreen()) return;
      canvas = document.createElement("canvas");
      canvas.className = "celestial-cursor-canvas";
      canvas.setAttribute("aria-hidden", "true");
      document.body.appendChild(canvas);
      ctx = canvas.getContext("2d");
      if (!ctx) return;
      resize();
      window.addEventListener("resize", resize, { passive: true });
      window.addEventListener("mousemove", onMove, { passive: true });
      document.addEventListener("visibilitychange", onVisibility);
    }

    return { init: init };
  })();

  document.addEventListener("DOMContentLoaded", function () {
    syncBibleCanvas();

    renderer.render(scene, camera);
    var rect = canvas.getBoundingClientRect();
    labels.update(camera, rect.width, rect.height);
    raf = requestAnimationFrame(frame);
  }
  frame();

  var ro = observeResize(container, function (w, h) {
    renderer.setSize(w, h, false);
    camera.aspect = w / Math.max(1, h);
    camera.updateProjectionMatrix();
  });

  return {
    focusRegion: function (region) {
      var xy = MAP_REGION_XY[region];
      if (xy) controls.lookAtPoint(new THREE.Vector3(xy[0], 0, xy[1]), true);
    },
    setActive: function (active) {
      if (active && !running) { running = true; frame(); }
      else if (!active && running) { running = false; if (raf) cancelAnimationFrame(raf); raf = null; }
    },
    dispose: function () {
      running = false;
      if (raf) cancelAnimationFrame(raf);
      canvas.removeEventListener("click", onClick);
      controls.dispose();
      ro.disconnect();
      labels.dispose();
      mapTex.dispose();
      renderer.dispose();
      if (renderer.forceContextLoss) renderer.forceContextLoss();
    },
  };
}

// ============================================================
// MODO 4D — Hipercubo espaço-tempo (eixo vertical = tempo)
// ============================================================
// Mesmo dataset (MUSEU_TREE) e mesmo algoritmo de setores angulares por
// contagem de folhas da Opção B, mas aqui o eixo Y é o tempo (via
// yearToT, não-linear — ver museu4dYearToT em app.js) em vez da
// profundidade na árvore. Cada tradição sobe como um filamento; o raio
// horizontal cresce um pouco com a profundidade só para as ramificações
// não se sobreporem, não para representar nenhuma grandeza real.
var HYPERCUBE_HEIGHT = 15;
function museuLayoutHypercube(rootId, tree, yearOf, yearToT) {
  var childrenMap = {};
  tree.forEach(function (n) {
    if (n.parent == null) return;
    (childrenMap[n.parent] = childrenMap[n.parent] || []).push(n.id);
  });
  var leafCache = {};
  function leafCount(id) {
    if (leafCache[id] != null) return leafCache[id];
    var kids = childrenMap[id] || [];
    var v = kids.length ? kids.reduce(function (s, k) { return s + leafCount(k); }, 0) : 1;
    leafCache[id] = v;
    return v;
  }
  var positions = {};
  function place(id, depth, a0, a1) {
    var angle = (a0 + a1) / 2;
    var year = yearOf(id);
    var t = yearToT(year);
    var radius = 0.55 + depth * 0.6;
    positions[id] = {
      depth: depth, angle: angle, year: year, t: t,
      x: radius * Math.cos(angle), z: radius * Math.sin(angle), y: t * HYPERCUBE_HEIGHT,
    };
    var kids = childrenMap[id] || [];
    if (!kids.length) return;
    var total = leafCount(id);
    var cursor = a0;
    kids.forEach(function (k) {
      var span = (a1 - a0) * (leafCount(k) / total);
      place(k, depth + 1, cursor, cursor + span);
      cursor += span;
    });
  }
  place(rootId, 0, 0, Math.PI * 2);
  return positions;
}

function initHypercube(container, callbacks) {
  callbacks = callbacks || {};
  var canvas = container.querySelector("canvas");
  if (!canvas) return null;
  var tree = window.MUSEU_TREE || [];
  var rootId = (tree.filter(function (n) { return !n.parent; })[0] || {}).id;
  var yearOf = callbacks.yearOf || function () { return null; };
  var yearToT = callbacks.yearToT || function () { return 1; };

  var scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0a0704, 0.012);
  var camera = new THREE.PerspectiveCamera(50, 1, 0.1, 300);
  var renderer = makeRenderer(canvas);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;

  scene.add(new THREE.AmbientLight(0xc9a876, 0.5));
  var key = new THREE.DirectionalLight(0xffe4b0, 0.9); key.position.set(6, 16, 8); scene.add(key);
  var rim = new THREE.PointLight(0xe2b04d, 1.0, 60); rim.position.set(-8, 10, -6); scene.add(rim);

  var ground = new THREE.Mesh(new THREE.CircleGeometry(10, 48), new THREE.MeshStandardMaterial({ color: 0x0c0904, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.position.y = -0.1; scene.add(ground);

  // eixo vertical do tempo: haste discreta + marcas nos "nós" da escala
  // não-linear (mesmos limites de museu4dYearToT em app.js).
  var axisMat = new THREE.LineBasicMaterial({ color: 0x6b5a38, transparent: true, opacity: 0.5 });
  var axisGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, HYPERCUBE_HEIGHT, 0)]);
  scene.add(new THREE.Line(axisGeo, axisMat));
  var axisLabels = makeLabelLayer(container);
  var axisKnotYears = [-100000, -10000, -500, 500, 1500, 1900];
  axisKnotYears.forEach(function (y) {
    var t = yearToT(y);
    var ringY = t * HYPERCUBE_HEIGHT;
    var ring = new THREE.Mesh(new THREE.RingGeometry(0.05, 0.09, 20), new THREE.MeshBasicMaterial({ color: 0x8a7248, transparent: true, opacity: 0.6, side: THREE.DoubleSide }));
    ring.rotation.x = -Math.PI / 2; ring.position.y = ringY; scene.add(ring);
    axisLabels.add(new THREE.Vector3(0.5, ringY, 0), y < 0 ? Math.abs(y) + " a.C." : String(y), "museu-label-group");
  });

  var positions = museuLayoutHypercube(rootId, tree, yearOf, yearToT);
  var group = new THREE.Group(); scene.add(group);
  var nodeMeshes = {}, edgeMeshes = [];
  var labels = makeLabelLayer(container);

  tree.forEach(function (n) {
    var p = positions[n.id]; if (!p) return;
    var color = regionColor(n.region);
    var r = n.kind === "milestone" ? 0.26 : (n.kind === "group" ? 0.17 : 0.13);
    var mat = new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.85, roughness: 0.4, metalness: 0.25, transparent: true, opacity: 1 });
    var mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 18, 14), mat);
    mesh.position.set(p.x, p.y, p.z);
    mesh.userData.nodeId = n.id;
    mesh.userData.year = p.year;
    mesh.userData.baseScale = 1;
    mesh.userData.targetOpacity = 1;
    group.add(mesh);
    nodeMeshes[n.id] = mesh;
    var halo = makeHaloSprite(color, r * 6);
    halo.position.copy(mesh.position);
    halo.userData.baseScale = r * 6;
    halo.material.transparent = true;
    mesh.userData.halo = halo;
    group.add(halo);
    if (n.kind === "milestone" || n.kind === "group") labels.add(mesh.position, n.name, n.kind === "milestone" ? "museu-label-major" : "museu-label-group");

    if (n.parent) {
      var pp = positions[n.parent];
      if (pp) {
        var curve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(pp.x, pp.y, pp.z),
          new THREE.Vector3((pp.x + p.x) / 2, (pp.y + p.y) / 2, (pp.z + p.z) / 2),
          new THREE.Vector3(p.x, p.y, p.z),
        ]);
        var tubeMat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending, depthWrite: false });
        var tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 16, 0.016, 6, false), tubeMat);
        tube.userData.year = p.year;
        tube.userData.targetOpacity = 0.7;
        group.add(tube);
        edgeMeshes.push(tube);
      }
    }
  });

  // plano "corte temporal": marca o instante atual, sobe/desce com o scrubber
  var slicePlane = new THREE.Mesh(
    new THREE.CircleGeometry(6.5, 48),
    new THREE.MeshBasicMaterial({ color: 0xe2b04d, transparent: true, opacity: 0.07, side: THREE.DoubleSide, depthWrite: false })
  );
  slicePlane.rotation.x = -Math.PI / 2;
  scene.add(slicePlane);
  var sliceRing = new THREE.Mesh(new THREE.RingGeometry(6.35, 6.5, 64), new THREE.MeshBasicMaterial({ color: 0xf6dfa0, transparent: true, opacity: 0.55, side: THREE.DoubleSide, blending: THREE.AdditiveBlending }));
  sliceRing.rotation.x = -Math.PI / 2;
  scene.add(sliceRing);

  camera.position.set(11, 7, 11);
  var controls = attachOrbitControls(canvas, camera, new THREE.Vector3(0, HYPERCUBE_HEIGHT * 0.4, 0), { radius: 16, theta: 0.8, phi: 1.15, minRadius: 4, maxRadius: 34 });

  var raycaster = new THREE.Raycaster(), mouse = new THREE.Vector2();
  var meshList = Object.keys(nodeMeshes).map(function (k) { return nodeMeshes[k]; });
  function onClick(ev) {
    if (controls.wasDragged()) return;
    var rect = canvas.getBoundingClientRect();
    mouse.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    var hits = raycaster.intersectObjects(meshList);
    if (hits.length && callbacks.onSelect) callbacks.onSelect(hits[0].object.userData.nodeId);
  }
  canvas.addEventListener("click", onClick);

  var currentDate = yearToT ? Infinity : Infinity; // definido via setDate() logo após init
  function applyDate(year) {
    currentDate = year;
    var t = yearToT(year);
    var y = t * HYPERCUBE_HEIGHT;
    slicePlane.position.y = y; sliceRing.position.y = y;
    meshList.forEach(function (m) { m.userData.targetOpacity = (m.userData.year == null || m.userData.year <= year) ? 1 : 0.08; });
    edgeMeshes.forEach(function (e) { e.userData.targetOpacity = (e.userData.year == null || e.userData.year <= year) ? 0.7 : 0.05; });
  }

  var selectedId = null, pulseT = 0;
  function setSelected(id) {
    selectedId = id;
    meshList.forEach(function (m) { m.userData.baseScale = (m.userData.nodeId === id) ? 1.7 : 1; });
  }

  var raf = null, running = true;
  function frame() {
    if (!running) return;
    pulseT += 0.05;
    controls.tick();
    meshList.forEach(function (m) {
      var pulse = m.userData.nodeId === selectedId ? Math.sin(pulseT) * 0.08 : 0;
      var s = m.userData.baseScale + pulse;
      m.scale.setScalar(s);
      var op = m.material.opacity + (m.userData.targetOpacity - m.material.opacity) * 0.12;
      m.material.opacity = op;
      if (m.userData.halo) {
        m.userData.halo.scale.setScalar(m.userData.halo.userData.baseScale * (s * 0.7 + 0.3));
        m.userData.halo.material.opacity += (m.userData.targetOpacity - m.userData.halo.material.opacity) * 0.12;
      }
    });
    edgeMeshes.forEach(function (e) { e.material.opacity += (e.userData.targetOpacity - e.material.opacity) * 0.12; });
    renderer.render(scene, camera);
    var rect = canvas.getBoundingClientRect();
    labels.update(camera, rect.width, rect.height);
    axisLabels.update(camera, rect.width, rect.height);
    raf = requestAnimationFrame(frame);
  }
  frame();

  var ro = observeResize(container, function (w, h) {
    renderer.setSize(w, h, false);
    camera.aspect = w / Math.max(1, h);
    camera.updateProjectionMatrix();
  });

  return {
    setDate: function (year) { applyDate(year); },
    focus: function (id) {
      setSelected(id);
      var p = positions[id];
      if (p) controls.lookAtPoint(new THREE.Vector3(p.x, p.y, p.z), true);
    },
    setActive: function (active) {
      if (active && !running) { running = true; frame(); }
      else if (!active && running) { running = false; if (raf) cancelAnimationFrame(raf); raf = null; }
    },
    dispose: function () {
      running = false;
      if (raf) cancelAnimationFrame(raf);
      canvas.removeEventListener("click", onClick);
      controls.dispose();
      ro.disconnect();
      labels.dispose();
      axisLabels.dispose();
      renderer.dispose();
      if (renderer.forceContextLoss) renderer.forceContextLoss();
    },
  };
}

// (Opção A deixou de usar Three.js — virou imagem CSS + Ken Burns; o
// painel panorâmico 3D antigo não é mais chamado por app.js e foi
// removido nesta limpeza antes do deploy.)

// ============================================================
// API pública
// ============================================================
window.MuseuThree = {
  ready: true,
  initTree: function (container, callbacks) {
    var canvas = container.querySelector("canvas"); if (!canvas) return;
    var inst = initTree(container, callbacks);
    if (inst) registerInstance(canvas, inst);
    return inst;
  },
  initMap: function (container, callbacks) {
    var canvas = container.querySelector("canvas"); if (!canvas) return;
    var inst = initMap(container, callbacks);
    if (inst) registerInstance(canvas, inst);
    return inst;
  },
  initHypercube: function (container, callbacks) {
    var canvas = container.querySelector("canvas"); if (!canvas) return;
    var inst = initHypercube(container, callbacks);
    if (inst) registerInstance(canvas, inst);
    return inst;
  },
  destroyAll: function () {
    Object.keys(instances).forEach(function (k) { try { instances[k].dispose(); } catch (e) {} });
    instances = {};
  },
};
window.dispatchEvent(new Event("museu-three-ready"));

</script>
