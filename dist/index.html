<style>
/* ============================================================
   RELIGIÕES EM COMPARAÇÃO - folha de estilos
   Sistema de design: espaçamento, tipografia e breakpoints
   consistentes sobre a identidade visual existente (azul-marinho,
   dourado, branco, cinzas, verde, âmbar, vermelho).
   ============================================================ */

:root {
  --navy-950: #0a1830;
  --navy-900: #101f3d;
  --navy-800: #16294f;
  --navy-700: #1d3461;
  --navy-600: #2a4478;
  --gold: #c9a227;
  --gold-light: #e2c25a;
  --gold-dark: #9c7d18;
  --gold-text: #7a611c; /* uso em texto sobre fundo claro - contraste WCAG AA */
  --white: #ffffff;
  --gray-25: #fbfbfd;
  --gray-50: #f5f6f9;
  --gray-100: #eceef3;
  --gray-200: #dde1e9;
  --gray-300: #c3c9d4;
  --gray-500: #7c8494;
  --gray-600: #5b6472;
  --gray-700: #3f4757;
  --gray-800: #232a36;
  --green: #1e7b34;
  --green-light: #e6f4ea;
  --amber: #8a5d0a; /* escurecido para contraste de texto AA sobre --amber-light */
  --amber-light: #fbf1da;
  --blue: #2563a8;
  --blue-light: #e6eefa;
  --red: #a01f1f;
  --red-light: #fbe9e9;
  --purple: #5d3f96;
  --purple-light: #efe9fb;
  --gray-neutral-light: #eef0f2;

  /* ---- Cores semânticas (hierarquia de estado) ---- */
  --color-primary: var(--navy-900);
  --color-accent: var(--gold);
  --color-positive: var(--green);
  --color-attention: var(--amber);
  --color-conflict: var(--red);
  --color-neutral: var(--gray-600);

  --bg: var(--gray-50);
  --bg-elevated: var(--white);
  --bg-header: linear-gradient(135deg, var(--navy-950), var(--navy-800));
  --text: var(--gray-800);
  --text-muted: var(--gray-600);
  --text-on-dark: #eef1f7;
  --text-muted-on-dark: #aab3c5;
  --border: var(--gray-200);
  --shadow: 0 4px 18px rgba(16, 31, 61, 0.08);
  --shadow-lg: 0 12px 34px rgba(16, 31, 61, 0.14);
  --radius-sm: 8px;
  --radius: 14px;
  --radius-lg: 20px;
  --container: 1280px;

  /* ---- Escala de espaçamento (múltiplos de 4px) ---- */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-7: 32px;
  --space-8: 40px;
  --space-9: 56px;
  --space-10: 72px;

  /* ---- Escala tipográfica responsiva (clamp: mín, fluido, máx) ---- */
  --fs-h1: clamp(28px, 4vw + 10px, 46px);
  --fs-h2: clamp(21px, 1.6vw + 14px, 30px);
  --fs-h3: clamp(16px, 0.5vw + 14px, 18.5px);
  --fs-h4: clamp(13.5px, 0.2vw + 13px, 15px);
  --fs-body: clamp(13.5px, 0.15vw + 13px, 14.5px);
  --fs-lead: clamp(15px, 0.4vw + 14px, 17.5px);
  --fs-small: 12.5px;
  --fs-caption: 11.5px;
  --fs-label: 11px;
  --fs-badge: 11.5px;
  --lh-heading: 1.2;
  --lh-body: 1.6;

  /* ---- Touch target mínimo recomendado ---- */
  --tap-min: 44px;

  --dur-fast: 0.15s;
  --dur-base: 0.22s;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
}

[data-theme="dark"] {
  --bg: #0c1526;
  --bg-elevated: #121e35;
  --bg-header: linear-gradient(135deg, #060d1c, #0e1c38);
  --text: #e7eaf2;
  --text-muted: #a6afc2;
  --text-on-dark: #eef1f7;
  --text-muted-on-dark: #9aa4bb;
  --border: #22304d;
  --shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.45);
  --gray-50: #0f1a30;
  --gray-100: #16233d;
  --gray-200: #223257;
  --green-light: #10301b;
  --amber-light: #33270a;
  --amber: #d9a13e;
  --blue-light: #0f2440;
  --red-light: #391212;
  --red: #e2685f;
  --purple-light: #241a3d;
  --gold-text: var(--gold-light);
  --gray-neutral-light: #1c2740;
}

/* Redução de movimento: desativa/encurta animações e transições
   quando o usuário solicita no sistema operacional. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; overflow-x: hidden; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-width: 320px;
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-feature-settings: "cv11", "ss01";
  background: var(--bg);
  color: var(--text);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  transition: background var(--dur-base) ease, color var(--dur-base) ease;
  overflow-x: hidden;
}
img, svg { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
h1, h2, h3, h4 { line-height: var(--lh-heading); font-weight: 800; margin: 0; overflow-wrap: break-word; }
p { overflow-wrap: break-word; }
.container { max-width: var(--container); margin: 0 auto; padding: 0 var(--space-6); width: 100%; }
@media (max-width: 480px) { .container { padding: 0 var(--space-4); } }
@media (min-width: 1600px) { .container { max-width: 1360px; } }
@media (min-width: 1920px) { .container { max-width: 1440px; } }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 4px; }

/* Skip link - acessibilidade de teclado */
.skip-link {
  position: absolute; left: 12px; top: -60px; z-index: 500;
  background: var(--navy-950); color: var(--text-on-dark); padding: 12px 18px;
  border-radius: var(--radius-sm); font-weight: 700; font-size: 13.5px;
  transition: top var(--dur-base) var(--ease);
}
.skip-link:focus { top: 12px; }

/* ---------- Header ---------- */
.site-header {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg-header);
  box-shadow: var(--shadow);
}
.site-header .container { display: flex; align-items: center; justify-content: space-between; height: 76px; gap: var(--space-4); }
.brand { display: flex; align-items: center; gap: 13px; color: var(--text-on-dark); min-width: 0; transition: opacity var(--dur-fast) ease; }
.brand:hover { opacity: 0.92; }
.brand-icon { width: 42px; height: 42px; flex-shrink: 0; filter: drop-shadow(0 2px 6px rgba(226,194,90,0.28)); }
.brand-name {
  font-family: "Playfair Display", "Georgia", serif; font-weight: 600; line-height: 1;
  font-size: 21px; letter-spacing: 0.015em; white-space: nowrap; color: var(--text-on-dark);
}
.brand-name .gold { color: var(--gold-light); font-weight: 700; }
.main-nav { display: flex; gap: 2px; flex-wrap: nowrap; }
.main-nav a {
  position: relative; color: var(--text-muted-on-dark); font-weight: 600; font-size: 12.2px;
  letter-spacing: 0.01em; padding: 8px 9px; border-radius: 999px; white-space: nowrap;
  transition: color var(--dur-base) var(--ease), background var(--dur-base) var(--ease), box-shadow var(--dur-base) var(--ease);
  min-height: var(--tap-min); display: inline-flex; align-items: center;
}
.main-nav a:hover { color: var(--text-on-dark); background: rgba(255,255,255,0.08); }
.main-nav a.active {
  color: var(--navy-950);
  background: linear-gradient(135deg, var(--gold-light), var(--gold));
  box-shadow: 0 4px 14px rgba(201,162,39,0.35), inset 0 1px 0 rgba(255,255,255,0.4);
  font-weight: 700;
}
.main-nav a:focus-visible { outline-offset: 3px; }
.header-actions { display: flex; align-items: center; gap: var(--space-2); flex-shrink: 0; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.18);
  background: rgba(255,255,255,0.06); color: var(--text-on-dark);
  display: flex; align-items: center; justify-content: center; transition: background var(--dur-fast) ease;
  flex-shrink: 0;
}
.icon-btn:hover { background: rgba(255,255,255,0.16); }
.hamburger { display: none; }

@media (max-width: 1279px) {
  .main-nav { display: none; }
  .hamburger { display: flex; }
}
@media (max-width: 360px) {
  .brand-name { font-size: 12.5px; }
  .brand-icon { width: 34px; height: 34px; }
  .site-header .container { height: 64px; gap: var(--space-2); }
}

.mobile-drawer {
  position: fixed; inset: 0; z-index: 200; display: none;
}
.mobile-drawer.open { display: block; }
.mobile-drawer .backdrop { position: absolute; inset: 0; background: rgba(6,12,24,0.55); }
.mobile-drawer .panel {
  position: absolute; top: 0; right: 0; bottom: 0; width: min(320px, 88vw);
  background: var(--bg-elevated); padding: var(--space-6) var(--space-5); box-shadow: var(--shadow-lg);
  display: flex; flex-direction: column; gap: var(--space-1); overflow-y: auto;
  animation: drawerIn var(--dur-base) var(--ease);
}
@keyframes drawerIn { from { transform: translateX(24px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.mobile-drawer a { padding: 14px 12px; border-radius: var(--radius-sm); font-weight: 600; color: var(--text); min-height: var(--tap-min); display: flex; align-items: center; }
.mobile-drawer a:hover, .mobile-drawer a.active { background: var(--gray-100); color: var(--gold-text); }
.mobile-drawer .close-drawer { align-self: flex-end; margin-bottom: var(--space-2); }

/* ============================================================
   Hero — composição em camadas (ver comentário de cada camada):
   1 fundo azul-marinho · 2 gradientes atmosféricos · 3 rede de pontos
   (mapa-múndi estilizado) · 4 partículas · 5 conteúdo · 6 Bíblia
   (fotografia) · 7 iluminação/sombras · 8 cards/UI
   ============================================================ */
.hero {
  background: var(--bg-header);
  position: relative; overflow: hidden;
  padding: var(--space-9) 0 var(--space-8);
  isolation: isolate;
}

/* Camada 1: fotografia da Bíblia + mapa-múndi como fundo de tela cheia —
   a própria imagem já é a cena inteira (azul-marinho profundo à direita,
   Bíblia + mapa luminoso à esquerda), então ela cobre 100% do hero em vez
   de aparecer como um recorte colado sobre um fundo CSS à parte. */
.hero-bg { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
.hero-bg-photo {
  position: absolute; inset: -2% -2% -2% -2%;
  background-image: var(--hero-photo, none);
  background-size: cover;
  background-position: left center;
  will-change: transform;
}
/* Camada 2: gradientes atmosféricos por cima da foto — reforçam a
   profundidade e garantem contraste onde o texto fica por cima. */
.hero-bg-atmosphere {
  position: absolute; inset: 0;
  background:
    linear-gradient(90deg, rgba(4,10,24,0.28) 0%, rgba(4,10,24,0.06) 42%, transparent 62%),
    radial-gradient(60% 70% at 15% 100%, rgba(0,0,0,0.4), transparent 65%),
    radial-gradient(120% 90% at 50% 100%, rgba(0,0,0,0.28), transparent 55%);
}
/* Camada 3: rede de pontos dourados discreta, reforça o efeito de "mapa
   luminoso" por toda a extensão do hero, inclusive fora da fotografia. */
.hero-bg-dots {
  position: absolute; inset: 0; opacity: 0.35;
  background-image: radial-gradient(circle, rgba(226,194,90,0.22) 1px, transparent 1.5px);
  background-size: 24px 24px;
  mask-image: radial-gradient(85% 75% at 62% 20%, #000 45%, transparent 92%);
  -webkit-mask-image: radial-gradient(85% 75% at 62% 20%, #000 45%, transparent 92%);
}
/* Camada 4: partículas — pontos dourados soltos com leve flutuação,
   independentes da fotografia (dão a segunda "velocidade" de parallax). */
.hero-bg-particles {
  position: absolute; inset: 0;
  background-image:
    radial-gradient(1.6px 1.6px at 12% 22%, rgba(246,228,168,0.85), transparent 60%),
    radial-gradient(1.3px 1.3px at 27% 46%, rgba(226,194,90,0.7), transparent 60%),
    radial-gradient(1.8px 1.8px at 46% 15%, rgba(246,228,168,0.75), transparent 60%),
    radial-gradient(1.4px 1.4px at 63% 34%, rgba(226,194,90,0.65), transparent 60%),
    radial-gradient(1.6px 1.6px at 81% 20%, rgba(246,228,168,0.7), transparent 60%),
    radial-gradient(1.3px 1.3px at 91% 55%, rgba(226,194,90,0.55), transparent 60%),
    radial-gradient(1.5px 1.5px at 35% 68%, rgba(246,228,168,0.5), transparent 60%);
  will-change: transform;
}
@media (prefers-reduced-motion: no-preference) {
  .hero-bg-particles { animation: heroParticlesFloat 22s ease-in-out infinite alternate; }
}
@keyframes heroParticlesFloat {
  from { transform: translate3d(0, 0, 0); }
  to { transform: translate3d(-6px, -10px, 0); }
}

/* Camada 5: conteúdo textual e CTAs, acima do fundo. */
.hero-grid { position: relative; z-index: 1; display: grid; grid-template-columns: 1.08fr 0.92fr; gap: var(--space-7); align-items: start; }
.hero-copy h1 {
  font-size: var(--fs-h1); color: var(--text-on-dark); margin: 0 0 var(--space-4);
  letter-spacing: -0.01em; max-width: 21ch;
  text-shadow: 0 2px 18px rgba(0,0,0,0.45);
}
.hero-copy h1 .gold {
  background: linear-gradient(135deg, var(--gold-light), var(--gold));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero-copy p.lead { color: var(--text-muted-on-dark); font-size: var(--fs-lead); font-weight: 400; max-width: 46ch; margin: 0 0 var(--space-6); line-height: 1.65; }
.hero-actions { display: flex; gap: var(--space-3); flex-wrap: wrap; margin-bottom: var(--space-7); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 9px; padding: 14px 24px; border-radius: 999px;
  font-weight: 700; font-size: 14px; letter-spacing: 0.02em; border: none;
  transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-base) var(--ease), background var(--dur-base) ease;
  min-height: var(--tap-min); text-align: center;
}
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(0); }
.btn-icon { width: 15px; height: 15px; flex-shrink: 0; transition: transform var(--dur-base) var(--ease); }
.btn-cta-primary:hover .btn-icon { transform: translateX(3px); }
.btn-gold {
  background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 55%, var(--gold-dark) 100%);
  color: var(--navy-950);
  box-shadow: 0 10px 28px rgba(201,162,39,0.34), 0 1px 0 rgba(255,255,255,0.35) inset, 0 0 0 1px rgba(255,255,255,0.12) inset;
  position: relative;
}
.btn-gold::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; opacity: 0; pointer-events: none;
  background: linear-gradient(135deg, rgba(255,255,255,0.55), transparent 55%);
  transition: opacity var(--dur-base) ease;
}
.btn-gold:hover { box-shadow: 0 14px 34px rgba(201,162,39,0.44), 0 1px 0 rgba(255,255,255,0.4) inset; }
.btn-gold:hover::after { opacity: 1; }
.btn-outline { background: rgba(255,255,255,0.04); color: var(--text-on-dark); border: 1.5px solid rgba(255,255,255,0.28); backdrop-filter: blur(6px); }
.btn-outline:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.45); }
.btn-outline-light { background: var(--bg-elevated); color: var(--text); border: 1.5px solid var(--border); }
.btn-outline-light:hover { border-color: var(--gold); color: var(--gold-text); }
.btn-navy { background: var(--navy-900); color: var(--text-on-dark); }
.btn-sm { padding: 9px 15px; font-size: 13px; border-radius: 999px; min-height: 38px; }
.btn[disabled], .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

@media (prefers-reduced-motion: no-preference) {
  .hero-parallax-slow, .hero-bg-photo { transition: transform 0.35s ease-out; }
}

/* ---------- Comparator card ---------- */
.side-column { position: relative; z-index: 1; display: flex; flex-direction: column; gap: var(--space-5); min-width: 0; }
.card {
  background: var(--bg-elevated);
  border-radius: var(--radius-lg);
  box-shadow: 0 2px 4px rgba(10,18,35,0.06), 0 24px 48px -12px rgba(10,18,35,0.32);
  padding: var(--space-6);
  border: 1px solid rgba(16,31,61,0.06);
}
.compare-card { position: relative; }
.compare-card::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
  background: linear-gradient(160deg, rgba(226,194,90,0.5), transparent 30%, transparent 70%, rgba(226,194,90,0.25));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
}
.compare-card h2 { margin: 0 0 var(--space-5); font-size: var(--fs-h3); text-align: center; color: var(--text); letter-spacing: 0.02em; font-weight: 800; }
.compare-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: var(--space-3); align-items: end; }
.compare-field { min-width: 0; }
.compare-field label { display: block; font-size: var(--fs-label); font-weight: 800; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
.compare-field select {
  width: 100%; padding: 12px; border-radius: var(--radius-sm); border: 1.5px solid var(--border);
  background: var(--bg); color: var(--text); font-size: 14px; font-weight: 600; min-height: var(--tap-min);
  max-width: 100%; transition: border-color var(--dur-fast) ease;
}
.compare-field select:hover { border-color: var(--gold); }
.vs-badge {
  width: 42px; height: 42px; border-radius: 50%;
  background: linear-gradient(135deg, var(--navy-800), var(--navy-950)); color: var(--gold-light);
  display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px; margin-bottom: 4px;
  flex-shrink: 0; box-shadow: 0 4px 10px rgba(10,18,35,0.25), inset 0 0 0 1px rgba(226,194,90,0.3);
}
.compare-submit { width: 100%; margin-top: var(--space-5); }
.compare-meta { text-align: center; margin-top: var(--space-4); font-size: 13px; color: var(--text-muted); display: flex; flex-direction: column; gap: 4px; }
.compare-meta strong { color: var(--text); }

/* trust cards */
.trust-grid { display: grid; gap: var(--space-3); }
.trust-card {
  display: flex; gap: var(--space-3); align-items: center;
  background: linear-gradient(160deg, var(--navy-800), var(--navy-900));
  border-radius: var(--radius); padding: var(--space-4);
  border: 1px solid rgba(255,255,255,0.08);
  transition: transform var(--dur-base) var(--ease), border-color var(--dur-base) ease, background var(--dur-base) ease;
}
.trust-card:hover { transform: translateY(-2px); border-color: rgba(226,194,90,0.35); background: linear-gradient(160deg, var(--navy-700), var(--navy-800)); }
.trust-icon {
  width: 40px; height: 40px; border-radius: 11px;
  background: rgba(201,162,39,0.16); color: var(--gold-light);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  box-shadow: inset 0 0 0 1px rgba(226,194,90,0.22);
}
.trust-icon svg { width: 19px; height: 19px; }
.trust-card h3 { margin: 0 0 4px; font-size: var(--fs-caption); font-weight: 800; color: var(--text-on-dark); letter-spacing: 0.04em; }
.trust-card p { margin: 0; font-size: var(--fs-caption); color: var(--text-muted-on-dark); line-height: 1.5; }

.hero-bible-spacer { display: none; }

@media (max-width: 980px) {
  .hero-grid { grid-template-columns: 1fr; }
  /* Reserva o espaço logo abaixo dos botões (COMPARAR RELIGIÕES /
     EXPLORAR RITOS) onde a Bíblia fica visível no fundo em tela cheia —
     sem isso, o card branco encostaria direto nos botões e a foto
     ficaria escondida atrás dele. */
  .hero-bible-spacer { display: block; height: clamp(200px, 34vh, 320px); }
  /* Em telas altas e estreitas, "cover" no hero inteiro (que também
     contém o card e os cards informativos) esticaria a foto a ponto de
     esconder a Bíblia fora da área visível. Em vez disso, a foto ocupa
     uma faixa de altura limitada no topo — onde compõe com o título e os
     CTAs, como no desktop — e o restante do hero continua em azul-marinho
     (o próprio tom da foto), sem costura visível. */
  .hero-bg-photo { inset: 0 0 auto 0; height: clamp(480px, 70vh, 680px); background-position: 26% 82%; }
  .hero-bg-atmosphere {
    background:
      linear-gradient(180deg, rgba(4,10,24,0.1) 0%, rgba(4,10,24,0.5) 70%, rgba(4,10,24,0.88) 100%),
      radial-gradient(90% 60% at 50% 100%, rgba(0,0,0,0.35), transparent 65%);
  }
}
@media (max-width: 680px) {
  .hero-copy h1 { max-width: none; }
  .hero-actions { margin-bottom: var(--space-6); }
  .hero-bg-photo { height: clamp(460px, 66vh, 600px); background-position: 24% 84%; }
}

/* ---------- Category strip ---------- */
.category-strip { background: var(--bg-elevated); border-bottom: 1px solid var(--border); padding: var(--space-5) 0; position: relative; }
.category-strip::after {
  content: ""; position: absolute; top: var(--space-5); right: 0; bottom: var(--space-5); width: 40px; pointer-events: none;
  background: linear-gradient(to right, transparent, var(--bg-elevated));
}
.category-scroll {
  display: grid; grid-auto-flow: column; grid-auto-columns: minmax(128px, 140px); gap: var(--space-3);
  overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin;
  scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch;
}
.category-chip {
  display: flex; flex-direction: column; gap: 6px; padding: var(--space-4); border-radius: var(--radius);
  background: var(--gray-50); border: 1px solid var(--border); text-align: left; transition: all var(--dur-fast) var(--ease);
  scroll-snap-align: start; min-height: var(--tap-min);
}
.category-chip:hover, .category-chip:focus-visible { border-color: var(--gold); box-shadow: var(--shadow); transform: translateY(-2px); }
.category-chip .emoji { font-size: 20px; }
.category-chip strong { font-size: var(--fs-caption); letter-spacing: 0.04em; }
.category-chip span.desc { font-size: var(--fs-label); color: var(--text-muted); line-height: 1.35; }

/* ---------- Section headings ---------- */
.section { padding: var(--space-8) 0; }
.section-head { display: flex; justify-content: space-between; align-items: flex-end; gap: var(--space-4); margin-bottom: var(--space-6); flex-wrap: wrap; }
.section-head h2 { margin: 0 0 4px; font-size: var(--fs-h2); }
.section-head p { margin: 0; color: var(--text-muted); font-size: var(--fs-body); max-width: 62ch; }
.eyebrow { display: inline-block; font-size: var(--fs-label); font-weight: 800; letter-spacing: 0.09em; color: var(--gold-text); text-transform: uppercase; margin-bottom: 8px; }

/* ============================================================
   RITOS / PRÁTICAS - tabela comparativa (desktop/tablet) +
   painel "O que o Novo Testamento diz?" + versão mobile em cards
   ============================================================ */
.table-panel-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 348px); gap: var(--space-6); align-items: start; }
@media (max-width: 1100px) { .table-panel-grid { grid-template-columns: 1fr; } .table-panel-grid .nt-panel { position: static; max-width: 640px; } }

.rituals-mobile { display: none; }
@media (max-width: 639px) {
  .rituals-desktop { display: none; }
  .rituals-mobile { display: block; }
}

.table-scroll {
  overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg-elevated);
  box-shadow: var(--shadow); position: relative; -webkit-overflow-scrolling: touch;
}
table.ritual-table { border-collapse: collapse; width: 100%; min-width: 760px; }
table.ritual-table th, table.ritual-table td { padding: 11px 10px; text-align: center; border-bottom: 1px solid var(--border); font-size: 12.5px; }
table.ritual-table thead th {
  background: var(--navy-900); color: var(--text-on-dark); position: sticky; top: 0; z-index: 2; font-size: 11.5px;
  white-space: nowrap; letter-spacing: 0.01em; min-width: 58px; transition: background var(--dur-fast) ease;
}
table.ritual-table thead th:first-child { text-align: left; }
table.ritual-table thead th:hover, table.ritual-table thead th.col-active { background: var(--navy-700); cursor: pointer; }
table.ritual-table th:first-child, table.ritual-table td:first-child {
  position: sticky; left: 0; z-index: 3; text-align: left; min-width: 200px; max-width: 240px;
}
table.ritual-table thead th:first-child { z-index: 4; }
table.ritual-table tbody th:first-child {
  background: var(--gray-50); z-index: 1; font-weight: 700; color: var(--text);
  cursor: pointer; white-space: normal; box-shadow: 2px 0 6px -2px rgba(16,31,61,0.12);
}
table.ritual-table tbody th:first-child:hover { color: var(--gold-text); text-decoration: underline; }
table.ritual-table tbody tr.selected-row th:first-child { background: var(--amber-light); }
table.ritual-table tbody tr:hover td, table.ritual-table tbody tr:hover th { background: var(--gray-100); }
[data-theme="dark"] table.ritual-table tbody tr:hover td, [data-theme="dark"] table.ritual-table tbody tr:hover th { background: var(--gray-100); }
.status-cell { cursor: help; font-size: 17px; transition: background var(--dur-fast) ease; }
.status-cell.col-active, td.status-cell.col-active { background: rgba(201,162,39,0.14); }
table.ritual-table tbody tr.selected-row td.status-cell { background: rgba(201,162,39,0.08); }
table.ritual-table th.col-selected, table.ritual-table td.col-selected { background: rgba(201,162,39,0.22) !important; }
table.ritual-table thead th.col-selected { background: var(--gold-dark) !important; }

.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px 16px; padding: var(--space-4) 4px 0; font-size: var(--fs-caption); color: var(--text-muted); }
.legend > span { display: flex; align-items: center; gap: 8px; }
.legend span.dot { font-size: 15px; }
.observation-note { margin-top: var(--space-4); padding: 12px var(--space-4); background: var(--gray-100); border-left: 3px solid var(--gold); border-radius: 6px; font-size: var(--fs-small); color: var(--text-muted); }
.observation-note strong { color: var(--text); }

/* ---------- Painel "O que o Novo Testamento diz?" ---------- */
.nt-panel {
  background: var(--navy-900); border-radius: var(--radius-lg); padding: var(--space-6); color: var(--text-on-dark);
  box-shadow: var(--shadow-lg); position: sticky; top: 88px; animation: panelIn var(--dur-base) var(--ease);
}
@keyframes panelIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.nt-panel-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.nt-panel h3 { margin: 0; font-size: var(--fs-h3); }
.nt-panel p.sub { margin: 4px 0 16px; font-size: 12.5px; color: var(--text-muted-on-dark); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
.nt-classification { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 800; margin-bottom: 18px; background: rgba(255,255,255,0.1); }
.nt-panel-divider { border: none; border-top: 1px solid rgba(255,255,255,0.12); margin: 14px 0; }
.nt-group { margin-bottom: 4px; }
.nt-group summary {
  display: flex; align-items: center; gap: 10px; cursor: pointer; list-style: none; padding: 12px 0;
  font-size: 13.5px; font-weight: 700; color: var(--text-on-dark);
}
.nt-group summary::-webkit-details-marker { display: none; }
.nt-group summary .ic { width: 30px; height: 30px; border-radius: 8px; background: rgba(201,162,39,0.18); color: var(--gold-light); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 14px; }
.nt-group summary .count { margin-left: auto; font-size: 11.5px; color: var(--text-muted-on-dark); background: rgba(255,255,255,0.08); padding: 3px 9px; border-radius: 999px; }
.nt-group summary .chevron { transition: transform var(--dur-fast) var(--ease); font-size: 11px; color: var(--text-muted-on-dark); }
.nt-group[open] summary .chevron { transform: rotate(90deg); }
.nt-group-body { padding: 2px 0 10px 40px; display: flex; flex-direction: column; gap: 8px; }
.nt-group-body .verse-block { background: rgba(255,255,255,0.06); border-left-color: var(--gold-light); }
.nt-group-body .verse-block .ref { color: var(--gold-light); }
.nt-group-body .verse-block .txt { color: var(--text-muted-on-dark); }
.nt-panel-conclusion { margin-top: 16px; padding: 14px 16px; background: rgba(201,162,39,0.1); border-radius: var(--radius-sm); font-size: 13px; color: var(--text-muted-on-dark); border: 1px solid rgba(201,162,39,0.22); }
.nt-panel-conclusion strong { color: var(--text-on-dark); }
.nt-panel-actions { margin-top: var(--space-5); display: flex; gap: 10px; flex-wrap: wrap; }

/* Versão embutida do painel dentro de um card mobile (mesma estrutura, sem sticky) */
.nt-panel.nt-panel-inline { position: static; box-shadow: none; margin-top: 10px; }

/* ---------- Cards / grids ---------- */
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: var(--space-4); }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: var(--space-4); }

.info-card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-5); box-shadow: var(--shadow); min-width: 0; }
.info-card h3 { margin: 0 0 8px; font-size: var(--fs-h3); font-weight: 800; }
.info-card p { margin: 0; font-size: var(--fs-body); color: var(--text-muted); }
.demographics-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.demographics-table td { padding: 7px 4px; border-bottom: 1px solid var(--border); word-break: break-word; }
.demographics-table td:last-child { text-align: right; color: var(--text); white-space: nowrap; padding-left: 10px; }

.worldview-card { margin-bottom: var(--space-6); }
.worldview-card h3 { font-size: var(--fs-h3); margin-bottom: var(--space-4); }
.worldview-block { padding: var(--space-4) var(--space-4); border-radius: var(--radius); margin-bottom: var(--space-3); }
.worldview-argument { background: var(--gray-100); }
.worldview-response { background: var(--bg-elevated); border: 1px solid var(--border); }
.worldview-block h4 { margin: 0 0 8px; font-size: var(--fs-h4); font-weight: 800; }
.worldview-block p { font-size: var(--fs-body); line-height: 1.55; margin: 0 0 10px; }
.worldview-sources ul { font-size: var(--fs-caption); }
.worldview-conclusion { font-style: italic; color: var(--text-muted); border-top: 1px dashed var(--border); padding-top: 10px; margin-top: 4px; }

/* ---------- Badges ---------- */
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; font-size: var(--fs-badge); font-weight: 700; white-space: nowrap; }
.badge-dentro { background: var(--green-light); color: var(--green); }
.badge-parcial { background: var(--amber-light); color: var(--amber); }
.badge-fora { background: var(--red-light); color: var(--red); }
.status-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; font-size: var(--fs-caption); font-weight: 700; white-space: nowrap; }

/* ---------- Verse blocks ---------- */
.verse-block { background: var(--gray-50); border-left: 3px solid var(--gold); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; padding: 12px 14px; margin: 10px 0; font-size: var(--fs-body); }
.verse-block .ref { font-weight: 800; color: var(--navy-900); }
[data-theme="dark"] .verse-block .ref { color: var(--gold-light); }
.verse-block .txt { font-style: italic; color: var(--text-muted); }
.verse-actions { margin-top: 8px; }
.link-btn { background: none; border: none; color: var(--blue); font-size: 12px; font-weight: 700; padding: 6px 0; text-decoration: underline; min-height: var(--tap-min); display: inline-flex; align-items: center; }
[data-theme="dark"] .link-btn { color: #7fb1e8; }

/* ---------- Glossário ---------- */
.glossary-term { border-bottom: 1.5px dotted var(--gold-dark); cursor: help; position: relative; }
.simple-mode-toggle { display: inline-flex; align-items: center; gap: 8px; }
.switch { position: relative; width: 42px; height: 24px; border-radius: 999px; background: var(--gray-300); border: none; flex-shrink: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform var(--dur-fast) ease; }
.switch.on { background: var(--green); }
.switch.on::after { transform: translateX(18px); }
mark { background: rgba(201,162,39,0.35); color: inherit; border-radius: 3px; padding: 0 2px; }
[data-theme="dark"] mark { background: rgba(226,194,90,0.35); }

/* ---------- Footer ---------- */
.site-footer { background: var(--navy-950); color: var(--text-muted-on-dark); padding: var(--space-8) 0 var(--space-5); margin-top: var(--space-8); }
.footer-grid { display: flex; justify-content: space-between; gap: var(--space-6); flex-wrap: wrap; padding-bottom: var(--space-6); border-bottom: 1px solid rgba(255,255,255,0.1); }
.footer-brand strong { color: var(--text-on-dark); display: block; font-size: 15px; }
.footer-links { display: flex; gap: var(--space-4); flex-wrap: wrap; }
.footer-links a { font-size: 13.5px; color: var(--text-muted-on-dark); min-height: var(--tap-min); display: inline-flex; align-items: center; }
.footer-links a:hover { color: var(--gold-light); }
.footer-bottom { display: flex; justify-content: space-between; padding-top: var(--space-4); font-size: 12.5px; flex-wrap: wrap; gap: 8px; }
.footer-bottom .verse { color: var(--gold-light); font-style: italic; }

/* ---------- Modal ---------- */
.modal-overlay { position: fixed; inset: 0; background: rgba(6,12,24,0.6); z-index: 300; display: none; align-items: center; justify-content: center; padding: var(--space-5); }
.modal-overlay.open { display: flex; animation: overlayIn var(--dur-fast) ease; }
@keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--bg-elevated); border-radius: var(--radius-lg); max-width: 760px; width: 100%;
  max-height: min(86vh, 900px); overflow-y: auto; padding: var(--space-6); box-shadow: var(--shadow-lg);
  position: relative; animation: modalIn var(--dur-base) var(--ease);
}
@keyframes modalIn { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
@media (max-width: 480px) { .modal-overlay { padding: var(--space-2); } .modal { padding: var(--space-4); border-radius: var(--radius); max-height: 92vh; } }
.modal-close { position: absolute; top: 14px; right: 14px; }
/* Especificidade maior que a regra combinada .icon-btn (usada no efeito de
   brilho no hover em vários elementos), que aplicava position:relative e
   left:-14px a QUALQUER .icon-btn - inclusive o botão de fechar modal,
   quebrando seu posicionamento absoluto no canto superior direito. */
.modal .modal-close { position: absolute; top: 14px; right: 14px; left: auto; }
.modal h3 { margin: 0 var(--space-7) 4px 0; font-size: var(--fs-h3); }
.modal p.sub { margin: 0 0 var(--space-4); color: var(--text-muted); font-size: var(--fs-small); }
table.similarity-table { width: 100%; border-collapse: collapse; font-size: 13px; }
table.similarity-table th, table.similarity-table td { padding: 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
table.similarity-table th { background: var(--gray-50); font-size: var(--fs-label); text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); }

/* ---------- Comparador bíblico ---------- */
.bible-form { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: var(--space-4); }
.bible-form input[type="text"] { flex: 1; min-width: 180px; padding: 12px 14px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px; min-height: var(--tap-min); }
.version-checks { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: var(--space-4); }
.version-chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; border: 1.5px solid var(--border); font-size: 12.5px; font-weight: 600; background: var(--bg); min-height: 38px; }
.version-chip input { accent-color: var(--gold-dark); width: 16px; height: 16px; }
.bible-results { display: flex; flex-direction: column; gap: var(--space-3); }
.bible-result { background: var(--gray-50); border-radius: var(--radius-sm); padding: var(--space-4); border-left: 3px solid var(--blue); }
.bible-result.error { border-left-color: var(--red); color: var(--red); font-size: 13px; }
.bible-result .v-label { font-weight: 800; font-size: 12.5px; color: var(--navy-900); margin-bottom: 4px; }
[data-theme="dark"] .bible-result .v-label { color: var(--gold-light); }
.api-status { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.api-note { font-size: 12px; background: var(--amber-light); color: var(--amber); padding: 10px 12px; border-radius: var(--radius-sm); margin-bottom: var(--space-4); }

/* ---------- Página de religião ---------- */
.religion-hero { background: var(--bg-header); padding: var(--space-7) 0; color: var(--text-on-dark); }
.tag { display: inline-block; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; margin-bottom: 10px; }
.religion-hero .tag { background: rgba(255,255,255,0.12); }
.religion-hero h1 { margin: 0 0 10px; font-size: var(--fs-h1); }
.facts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: var(--space-3); margin-top: var(--space-6); }
.fact { background: rgba(255,255,255,0.06); border-radius: var(--radius-sm); padding: 12px 14px; min-width: 0; }
.fact .label { font-size: var(--fs-label); text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted-on-dark); }
.fact .value { font-size: 13.5px; font-weight: 700; margin-top: 3px; word-break: break-word; }

.doctrine-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--space-3); }

/* ---------- Anexos / listas de fontes ---------- */
.source-list { display: flex; flex-direction: column; gap: 10px; margin: 10px 0 0; padding: 0; list-style: none; }
.source-item {
  display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--bg);
}
.source-item .src-icon {
  width: 34px; height: 34px; border-radius: 9px; background: var(--gray-100); color: var(--gold-text);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 15px;
}
.source-item .src-body { min-width: 0; flex: 1; }
.source-item .src-title { font-weight: 700; font-size: 13.5px; color: var(--text); }
.source-item .src-type { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); font-weight: 700; }
.source-item .src-desc { font-size: var(--fs-small); color: var(--text-muted); margin-top: 3px; }
.source-item .src-action { margin-top: 6px; display: inline-block; font-size: 12px; font-weight: 700; color: var(--blue); }
[data-theme="dark"] .source-item .src-action { color: #7fb1e8; }

/* ============================================================
   LINHA DO TEMPO - árvore histórica interativa
   ============================================================ */
/* Página premium "Linha do Tempo" - fundo azul-marinho fixo, independente do
   toggle claro/escuro do site (mesmo tratamento do .hero da Home: é uma
   seção de marca, não uma seção de leitura). */
.tl-premium {
  --tlp-navy-950: #070d1c; --tlp-navy-900: #0a1830; --tlp-navy-800: #122649;
  --tlp-gold: #c9a227; --tlp-gold-light: #e6c869; --tlp-gold-pale: #f3dfa0; --tlp-gold-dark: #8a6b16;
  --tlp-ink: #eef1f7; --tlp-ink-soft: #c3cbdc; --tlp-ink-mute: #8b96ad;
  --tlp-line: rgba(226,196,105,0.16); --tlp-line-soft: rgba(255,255,255,0.07);
  background:
    radial-gradient(1100px 620px at 82% -6%, rgba(201,162,39,0.14), transparent 60%),
    radial-gradient(900px 500px at 8% 8%, rgba(60,90,160,0.14), transparent 55%),
    linear-gradient(180deg, var(--tlp-navy-950) 0%, #060b17 55%, #05080f 100%);
  padding: var(--space-9) 0 var(--space-10);
  color: var(--tlp-ink);
  position: relative; overflow: hidden;
}
.tl-atmosphere { position: absolute; inset: -10%; z-index: -1; pointer-events: none; opacity: 0.6; }
.tl-atmosphere::before, .tl-atmosphere::after {
  content: ""; position: absolute; inset: 0;
  background-image:
    radial-gradient(1.4px 1.4px at 10% 20%, rgba(255,255,255,0.55), transparent 60%),
    radial-gradient(1.4px 1.4px at 80% 12%, rgba(255,255,255,0.4), transparent 60%),
    radial-gradient(1px 1px at 32% 68%, rgba(230,200,105,0.55), transparent 60%),
    radial-gradient(1px 1px at 60% 85%, rgba(255,255,255,0.35), transparent 60%),
    radial-gradient(1.4px 1.4px at 90% 55%, rgba(255,255,255,0.4), transparent 60%),
    radial-gradient(1px 1px at 46% 32%, rgba(255,255,255,0.3), transparent 60%),
    radial-gradient(1px 1px at 15% 52%, rgba(230,200,105,0.4), transparent 60%),
    radial-gradient(1.4px 1.4px at 70% 42%, rgba(255,255,255,0.3), transparent 60%);
  background-repeat: repeat; background-size: 360px 360px;
  animation: tlDrift 100s linear infinite;
}
.tl-atmosphere::after { background-size: 520px 520px; opacity: 0.55; animation-duration: 150s; animation-direction: reverse; }
@keyframes tlDrift { from { transform: translate3d(0,0,0); } to { transform: translate3d(-360px,-360px,0); } }
@media (prefers-reduced-motion: reduce) { .tl-atmosphere::before, .tl-atmosphere::after { animation: none; } }
@media (max-width: 860px) { .tl-atmosphere { opacity: 0.35; } }
.tl-hero { position: relative; border-radius: 22px; overflow: hidden; border: 1px solid var(--tlp-line); margin-bottom: var(--space-6); min-height: 220px; display: flex; align-items: center; }
.tl-hero-bg { position: absolute; inset: 0; background-size: cover; background-position: 62% 38%; }
.tl-hero-bg::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--tlp-navy-950) 0%, rgba(9,17,34,0.82) 30%, rgba(9,17,34,0.35) 62%, rgba(9,17,34,0.08) 100%); }
.tl-hero-bg::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 70% 60% at 78% 30%, rgba(230,200,105,0.14), transparent 65%); mix-blend-mode: screen; }
.tl-hero-copy { position: relative; z-index: 1; max-width: 640px; padding: 40px 38px; }
.tl-eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--tlp-gold-light); font-weight: 700; margin-bottom: 12px; }
.tl-eyebrow::before { content: ""; width: 24px; height: 1.5px; background: var(--tlp-gold); display: inline-block; }
.tl-hero-copy h2 { font-size: clamp(26px, 3.4vw, 38px); line-height: 1.15; margin: 0 0 12px; color: #f4f6fb; }
.tl-hero-copy h2 .gold { color: var(--tlp-gold-light); }
.tl-hero-copy p { margin: 0; font-size: 15px; line-height: 1.6; color: var(--tlp-ink-soft); max-width: 520px; }

.tl-filters { background: rgba(16,29,54,0.55); border: 1px solid var(--tlp-line-soft); border-radius: 16px; padding: 18px 20px 16px; margin-bottom: var(--space-6); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.tl-filter-row { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; flex-wrap: wrap; }
.tl-filter-label { font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--tlp-ink-mute); flex: 0 0 auto; }
.tl-chips { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; }
.tl-chip { font-size: 12.5px; font-weight: 600; padding: 7px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.14); color: var(--tlp-ink-soft); background: rgba(255,255,255,0.04); min-height: 34px; }
.tl-chip:hover { border-color: var(--tlp-gold); color: var(--tlp-gold-pale); }
.tl-chip.active { background: linear-gradient(135deg, var(--tlp-gold-light), var(--tlp-gold)); color: #231a05; border-color: transparent; box-shadow: 0 3px 12px rgba(201,162,39,0.3); }
.tl-controls { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--tlp-line-soft); }
.tl-ctrl-btn { width: 32px; height: 32px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.04); color: var(--tlp-ink-soft); font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; min-width: 32px; }
.tl-ctrl-btn:hover { border-color: var(--tlp-gold); color: var(--tlp-gold-pale); }
.tl-ctrl-zoom { font-size: 12.5px; font-weight: 700; color: var(--tlp-ink); padding: 0 10px; min-width: 46px; text-align: center; }
.tl-ctrl-reset { width: auto; padding: 0 14px; gap: 6px; font-size: 12px; }

.tl-grid { --tl-zoom: 1; position: relative; display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
.tl-rail { position: absolute; left: 22px; right: 22px; top: 46px; height: 2px; background: linear-gradient(90deg, transparent, var(--tlp-gold-dark) 3%, var(--tlp-gold) 50%, var(--tlp-gold-dark) 97%, transparent); opacity: 0.85; z-index: 0; }
.tl-col { position: relative; z-index: 1; display: flex; flex-direction: column; background: linear-gradient(180deg, rgba(19,34,62,0.5), rgba(10,18,36,0.58)); border: 1px solid var(--tlp-line); border-radius: 16px; overflow: hidden; box-shadow: 0 16px 34px rgba(0,0,0,0.26); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: opacity var(--dur-fast) ease, filter var(--dur-fast) ease; }
.tl-connectors { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
@media (max-width: 1180px) { .tl-connectors { display: none; } }
.tl-col-head { padding: 18px 12px 14px; text-align: center; border-bottom: 1px solid var(--tlp-line-soft); }
.tl-col-icon { display: block; width: 46px; height: 46px; margin: 0 auto 10px; border-radius: 50%; background: radial-gradient(circle at 34% 30%, rgba(230,200,105,0.28), rgba(20,34,62,0.9) 72%); border: 1.5px solid var(--tlp-gold); box-shadow: 0 0 0 4px var(--tlp-navy-950), 0 4px 12px rgba(201,162,39,0.28); display: flex; align-items: center; justify-content: center; }
.tl-col-icon svg { width: 20px; height: 20px; color: var(--tlp-gold-light); }
.tl-col-title { display: block; font-size: calc(12.5px * var(--tl-zoom)); font-weight: 800; letter-spacing: 0.05em; color: var(--tlp-ink); margin-bottom: 3px; }
.tl-col-range { display: block; font-size: 11px; color: var(--tlp-gold-light); font-weight: 600; }
.tl-col-cards { padding: 12px 10px 14px; display: flex; flex-direction: column; gap: calc(10px * var(--tl-zoom)); flex: 1; }
.tl-col-empty, .timeline-empty { padding: var(--space-5) var(--space-3); text-align: center; color: var(--tlp-ink-mute); font-size: 12px; }
.timeline-empty { background: var(--gray-50); border-radius: var(--radius); color: var(--text-muted); }

.tl-card {
  display: block; width: 100%; text-align: left; font-family: inherit; color: inherit; cursor: pointer;
  border-radius: 12px; overflow: hidden; background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.1);
  box-shadow: 0 8px 16px rgba(0,0,0,0.26); transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease), border-color var(--dur-fast) ease, opacity var(--dur-fast) ease, filter var(--dur-fast) ease;
  animation: nodeIn 0.4s var(--ease) both; min-height: var(--tap-min); padding: 0;
  position: relative; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
.tl-card::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
  background: linear-gradient(135deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 30%);
  mix-blend-mode: screen;
}
.tl-card:hover, .tl-card:focus-visible { transform: translateY(-2px); border-color: var(--tlp-gold); box-shadow: 0 10px 22px rgba(0,0,0,0.34), 0 0 0 2px rgba(201,162,39,0.25); }
@keyframes nodeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.tl-card-img { display: block; height: calc(88px * var(--tl-zoom)); background-size: cover; background-position: center; position: relative; }
.tl-card-rel {
  position: absolute; top: 8px; right: 8px; z-index: 2; font-size: 8.5px; font-weight: 800; letter-spacing: 0.03em;
  padding: 3px 7px; border-radius: 999px; color: #08101f; background: var(--rel-c, #8b96ad);
  box-shadow: 0 2px 6px rgba(0,0,0,0.35); text-transform: uppercase; cursor: help;
}
.tl-card-body { display: block; padding: calc(10px * var(--tl-zoom)) 12px calc(12px * var(--tl-zoom)); }
.tl-card-name { display: block; font-size: calc(13.5px * var(--tl-zoom)); font-weight: 800; color: var(--tlp-ink); line-height: 1.28; margin-bottom: 3px; }
.tl-card-founded { display: block; font-size: calc(11px * var(--tl-zoom)); line-height: 1.5; color: var(--tlp-ink-mute); margin-bottom: 5px; }
.tl-card-founded strong { color: var(--tlp-ink-soft); font-weight: 700; }
.tl-card-meta { display: block; font-size: calc(11px * var(--tl-zoom)); color: var(--tlp-gold-light); font-weight: 600; margin-bottom: 6px; }
.tl-card-tag { display: inline-flex; font-size: 9.5px; font-weight: 700; letter-spacing: 0.02em; padding: 4px 9px; border-radius: 999px; color: #0c1220; background: var(--tag-c, #8b96ad); }

/* ---------- Modo foco ---------- */
.tl-focus-active .tl-card { opacity: 0.16; filter: saturate(0.5) blur(0.2px); }
.tl-focus-active .tl-card.tl-focus-related { opacity: 1; filter: none; }
.tl-focus-active .tl-card.tl-focus-self { box-shadow: 0 0 0 2px var(--tlp-gold), 0 10px 26px rgba(201,162,39,0.35); }
.tl-focus-banner {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  background: linear-gradient(90deg, rgba(201,162,39,0.16), rgba(201,162,39,0.04)); border: 1px solid var(--tlp-line);
  border-radius: 12px; padding: 10px 16px; margin-bottom: var(--space-4); font-size: 12.5px; color: var(--tlp-ink-soft);
}
.tl-focus-banner[hidden] { display: none; }
.tl-focus-banner strong { color: var(--tlp-gold-light); }
.tl-focus-clear { font-size: 11.5px; font-weight: 700; color: var(--tlp-ink); background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); border-radius: 999px; padding: 5px 12px; }
.tl-focus-clear:hover { border-color: var(--tlp-gold); color: var(--tlp-gold-pale); }
.tl-connector-hint { font-size: 11.5px; color: var(--tlp-ink-mute); margin: 0 0 var(--space-4); line-height: 1.5; }

.tl-panel { padding: 16px 15px 17px; flex: 1; display: flex; flex-direction: column; }
.tl-panel-title { font-size: 15.5px; font-weight: 700; color: var(--tlp-gold-light); margin: 0 0 9px; line-height: 1.3; }
.tl-panel-text { font-size: 11.5px; line-height: 1.6; color: var(--tlp-ink-soft); margin: 0 0 14px; }
.tl-panel-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.tl-panel-item { display: flex; align-items: flex-start; gap: 8px; font-size: 11.5px; color: var(--tlp-ink-soft); font-weight: 600; }
.tl-panel-item svg { width: 15px; height: 15px; flex: 0 0 auto; margin-top: 1px; color: var(--tlp-gold-light); }
.tl-panel-quote { margin-top: auto; padding: 12px 13px; border-left: 2px solid var(--tlp-gold); background: rgba(255,255,255,0.03); border-radius: 0 10px 10px 0; }
.tl-panel-quote p { font-style: italic; font-size: 12px; line-height: 1.5; color: var(--tlp-ink); margin: 0 0 5px; }
.tl-panel-quote span { font-size: 10.5px; color: var(--tlp-gold-light); font-weight: 700; }

.tl-legend { margin-top: var(--space-6); padding-top: 18px; border-top: 1px solid var(--tlp-line-soft); display: flex; align-items: center; flex-wrap: wrap; gap: 16px 20px; }
.tl-legend-title { font-size: 11px; font-weight: 800; letter-spacing: 0.05em; color: var(--tlp-ink-mute); text-transform: uppercase; }
.tl-legend-items { display: flex; flex-wrap: wrap; gap: 12px 18px; flex: 1; }
.tl-legend-item { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--tlp-ink-soft); font-weight: 600; }
.tl-legend-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
.tl-legend-footnote { width: 100%; font-size: 10.5px; color: var(--tlp-ink-mute); opacity: 0.85; padding-top: 12px; margin: 4px 0 0; border-top: 1px dashed var(--tlp-line-soft); }

/* ---------- Botão de busca (abre a command palette) ---------- */
.tl-search-btn {
  display: inline-flex; align-items: center; gap: 10px; margin-top: 18px; padding: 10px 16px 10px 14px;
  border-radius: 999px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.05);
  color: var(--tlp-ink-soft); font-size: 13px; font-weight: 600; cursor: pointer; backdrop-filter: blur(8px);
}
.tl-search-btn svg { width: 16px; height: 16px; flex: 0 0 auto; color: var(--tlp-gold-light); }
.tl-search-btn:hover, .tl-search-btn:focus-visible { border-color: var(--tlp-gold); color: var(--tlp-ink); }
.tl-search-kbd { display: inline-flex; gap: 3px; margin-left: 4px; }
.tl-search-kbd kbd {
  font-family: inherit; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 5px;
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16); color: var(--tlp-ink-mute);
}

/* ---------- Command palette (Ctrl/Cmd+K) ---------- */
.tl-palette-overlay {
  position: fixed; inset: 0; z-index: 400; display: none; align-items: flex-start; justify-content: center;
  padding: 12vh 16px 16px; background: rgba(4,8,16,0.72); backdrop-filter: blur(4px);
}
.tl-palette-overlay.open { display: flex; animation: overlayIn var(--dur-fast) ease; }
.tl-palette {
  width: 100%; max-width: 560px; max-height: 66vh; display: flex; flex-direction: column; overflow: hidden;
  background: linear-gradient(180deg, rgba(18,32,58,0.96), rgba(8,14,28,0.98)); border: 1px solid var(--tlp-line);
  border-radius: 16px; box-shadow: 0 30px 70px rgba(0,0,0,0.55); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
}
.tl-palette-input-row { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--tlp-line-soft); flex: 0 0 auto; }
.tl-palette-icon { width: 18px; height: 18px; flex: 0 0 auto; color: var(--tlp-gold-light); }
.tl-palette-input { flex: 1; background: none; border: none; outline: none; color: var(--tlp-ink); font-size: 15px; font-family: inherit; }
.tl-palette-input::placeholder { color: var(--tlp-ink-mute); }
.tl-palette-close { font-size: 10.5px; font-weight: 700; color: var(--tlp-ink-mute); background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-radius: 6px; padding: 4px 8px; }
.tl-palette-results { overflow-y: auto; padding: 8px; flex: 1; }
.tl-palette-item { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px 10px; border-radius: 10px; background: none; border: none; color: inherit; font-family: inherit; cursor: pointer; }
.tl-palette-item:hover, .tl-palette-item:focus-visible { background: rgba(255,255,255,0.06); }
.tl-palette-item-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
.tl-palette-item-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.tl-palette-item-name { font-size: 13.5px; font-weight: 700; color: var(--tlp-ink); }
.tl-palette-item-meta { font-size: 11px; color: var(--tlp-ink-mute); }
.tl-palette-item-rel { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; color: var(--rel-c, #8b96ad); flex: 0 0 auto; }
.tl-palette-hint, .tl-palette-empty { padding: 16px 12px; font-size: 12.5px; color: var(--tlp-ink-mute); line-height: 1.7; }
.tl-palette-suggest { display: inline-flex; margin: 2px 3px; font-size: 11.5px; font-weight: 700; color: var(--tlp-gold-light); background: rgba(230,200,105,0.1); border: 1px solid rgba(230,200,105,0.25); border-radius: 999px; padding: 3px 10px; }
.tl-palette-suggest:hover { background: rgba(230,200,105,0.2); }
@media (max-width: 640px) { .tl-palette-overlay { padding: 8vh 10px 10px; } .tl-palette { max-height: 76vh; } .tl-search-btn { font-size: 12px; padding: 9px 12px; } }

/* ---------- Painel do nó (modal "Linha do Tempo") ---------- */
.modal.tl-node-modal { background: linear-gradient(165deg, rgba(18,32,58,0.98), rgba(7,13,26,0.99)); border: 1px solid var(--tlp-line); color: var(--tlp-ink); animation: tlPanelIn var(--dur-fast) var(--ease) both; }
@keyframes tlPanelIn { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
.modal.tl-node-modal .sub { color: var(--tlp-ink-soft); }
.modal.tl-node-modal .fact { background: rgba(255,255,255,0.04); border: 1px solid var(--tlp-line-soft); }
.modal.tl-node-modal .fact .label { color: var(--tlp-ink-mute); }
.modal.tl-node-modal .fact .value { color: var(--tlp-ink); }
.modal.tl-node-modal .modal-close { color: var(--tlp-ink-soft); }
.modal.tl-node-modal .btn-outline-light { background: rgba(255,255,255,0.06); color: var(--tlp-ink); border-color: rgba(255,255,255,0.18); }
.modal.tl-node-modal .btn-outline-light:hover { border-color: var(--tlp-gold); color: var(--tlp-gold-pale); }
.tl-reliability-badge { display: inline-flex; font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; padding: 4px 10px; border-radius: 999px; color: #08101f; background: var(--rel-c, #8b96ad); cursor: help; }
.tl-reliability-note { font-size: 11.5px; line-height: 1.6; color: var(--tlp-ink-mute); margin: 10px 0 0; }
.tl-lineage { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 10px 0 4px; }
.tl-lineage-item { font-size: 11.5px; font-weight: 700; color: var(--tlp-ink-soft); background: rgba(255,255,255,0.05); border: 1px solid var(--tlp-line-soft); border-radius: 999px; padding: 4px 11px; }
.tl-lineage-item.tl-lineage-current { color: #08101f; background: var(--tlp-gold-light); border-color: transparent; }
.tl-lineage-arrow { color: var(--tlp-ink-mute); font-size: 12px; }
.tl-lineage-root { font-size: 10.5px; color: var(--tlp-ink-mute); font-weight: 600; }
.tl-modal-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

@media (max-width: 1180px) { .tl-grid { grid-template-columns: repeat(3, 1fr); } .tl-rail { display: none; } }
@media (max-width: 860px) { .tl-grid { grid-template-columns: repeat(2, 1fr); } .tl-hero-copy { max-width: 100%; } }
@media (max-width: 980px) { .tl-filter-row { align-items: flex-start; } .tl-filter-label { width: 100%; } }
@media (max-width: 560px) {
  .tl-grid { grid-template-columns: 1fr; }
  .tl-hero { min-height: 0; }
  .tl-hero-bg { position: absolute; inset: 0; opacity: 0.55; }
  .tl-hero-copy { padding: 28px 22px; max-width: 100%; }
  .tl-controls { justify-content: flex-start; }
}

/* Detalhe do nó (dentro do modal) */
.tl-detail-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 14px 0; }
.tl-detail-facts .fact { background: var(--gray-50); }
.tl-detail-facts .fact .value { color: var(--text); }

/* legado: lista simples usada em fallback (sem JS de timeline) */
.timeline { position: relative; padding-left: 28px; border-left: 3px solid var(--border); display: flex; flex-direction: column; gap: 22px; }
.timeline-item { position: relative; }
.timeline-item::before { content: ""; position: absolute; left: -34px; top: 4px; width: 14px; height: 14px; border-radius: 50%; background: var(--gold); border: 3px solid var(--bg); box-shadow: 0 0 0 2px var(--gold); }
.timeline-item .year { font-weight: 800; color: var(--gold-text); font-size: 13px; }
.timeline-item h4 { margin: 4px 0; font-size: 16px; }
.timeline-item p { margin: 0; font-size: 13.5px; color: var(--text-muted); }

/* ============================================================
   LINHA DO TEMPO DA HUMANIDADE - "museu histórico interativo"
   (#/humanidade). Página adicional, com identidade visual própria
   (escura, azul/violeta/dourado) independente do tema claro/escuro do
   restante do site - mesmo tratamento de "seção de marca" da home e da
   Linha do Tempo dos Fundadores.
   ============================================================ */
.mh-page {
  --mh-bg: #07060a; --mh-surface: #120e0a; --mh-glass: rgba(24,18,10,0.72);
  --mh-blue: #e2b04d; --mh-cyan: #f6cf7a; --mh-violet: #c9822f; --mh-gold: #e2b04d; --mh-gold-bright: #f6dfa0; --mh-emerald: #31c48d;
  --mh-text: #f5efe0; --mh-text-soft: #d8caa8; --mh-text-mute: #a8987a;
  --mh-line: rgba(226,176,77,0.16); --mh-line-soft: rgba(226,176,77,0.09);
  background: radial-gradient(1100px 620px at 82% -8%, rgba(226,176,77,0.10), transparent 60%), radial-gradient(900px 500px at 10% 105%, rgba(180,120,40,0.08), transparent 60%), var(--mh-bg);
  color: var(--mh-text); padding-bottom: var(--space-9);
}
.mh-page .container.mh-container { padding-top: var(--space-6); padding-bottom: var(--space-6); }

/* ---- header ---- */
.mh-header { border-bottom: 1px solid var(--mh-line); background: rgba(8,5,2,0.88); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.mh-header-inner { display: flex; align-items: center; gap: 20px; padding: 16px 0; flex-wrap: wrap; }
.mh-header-brand { display: flex; align-items: center; gap: 12px; flex: 0 0 auto; }
.mh-header-brand svg { width: 28px; height: 28px; color: var(--mh-gold); flex: 0 0 auto; }
.mh-header-titles { display: flex; flex-direction: column; line-height: 1.2; }
.mh-title { font-family: "Playfair Display", serif; font-size: 17px; font-weight: 700; color: var(--mh-text); }
.mh-subtitle { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mh-text-mute); }
.mh-header-search { flex: 1 1 260px; max-width: 420px; display: flex; align-items: center; gap: 8px; background: var(--mh-glass); border: 1px solid var(--mh-line); border-radius: 999px; padding: 9px 16px; }
.mh-header-search svg { width: 16px; height: 16px; color: var(--mh-blue); flex: 0 0 auto; }
.mh-header-search input { flex: 1; background: none; border: none; outline: none; color: var(--mh-text); font-size: 13px; font-family: inherit; }
.mh-header-search input::placeholder { color: var(--mh-text-mute); }
.mh-header-btn { flex: 0 0 auto; font-size: 12.5px; font-weight: 700; color: var(--mh-text-soft); background: rgba(255,255,255,0.05); border: 1px solid var(--mh-line); border-radius: 999px; padding: 9px 16px; }
.mh-header-btn:hover { border-color: var(--mh-blue); color: var(--mh-blue); }

/* ---- shell: sidebar + main + detail ---- */
.mh-shell { display: grid; grid-template-columns: 200px 1fr 320px; gap: 18px; align-items: start; }
@media (max-width: 1180px) { .mh-shell { grid-template-columns: 180px 1fr; } .mh-detail { grid-column: 1 / -1; } }
@media (max-width: 860px) { .mh-shell { grid-template-columns: 1fr; } .mh-sidebar { grid-row: 2; } .mh-main { grid-row: 1; } .mh-detail { grid-row: 3; } }

/* ---- sidebar ---- */
.mh-sidebar { display: flex; flex-direction: column; gap: 16px; background: var(--mh-glass); border: 1px solid var(--mh-line); border-radius: 16px; padding: 14px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); position: sticky; top: 16px; }
.mh-nav { display: flex; flex-direction: column; gap: 3px; }
.mh-nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; font-size: 12.5px; font-weight: 600; color: var(--mh-text-soft); text-align: left; background: none; border: 1px solid transparent; }
.mh-nav-item svg { width: 16px; height: 16px; flex: 0 0 auto; color: var(--mh-text-mute); }
.mh-nav-item:hover { background: rgba(255,255,255,0.05); color: var(--mh-text); }
.mh-nav-item.active { background: rgba(226,176,77,0.16); border-color: rgba(226,176,77,0.35); color: var(--mh-text); }
.mh-nav-item.active svg { color: var(--mh-blue); }
.mh-stats { display: flex; flex-direction: column; gap: 10px; padding-top: 14px; border-top: 1px solid var(--mh-line-soft); }
.mh-stat { display: flex; flex-direction: column; gap: 2px; }
.mh-stat-label { font-size: 11px; font-weight: 800; letter-spacing: 0.06em; color: var(--mh-text-mute); }
.mh-stat-value { font-family: "SFMono-Regular", Consolas, monospace; font-size: 18px; font-weight: 700; color: var(--mh-text); }
.mh-legend { display: flex; flex-direction: column; gap: 8px; padding-top: 14px; border-top: 1px solid var(--mh-line-soft); }
.mh-legend-title { font-size: 11px; font-weight: 800; letter-spacing: 0.06em; color: var(--mh-text-mute); margin-bottom: 2px; }
.mh-legend-item { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--mh-text-soft); font-weight: 600; }
.mh-legend-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }

/* ---- main: hero + eras + card strip ---- */
.mh-main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.mh-hero { position: relative; border-radius: 16px; overflow: hidden; border: 1px solid var(--mh-line); padding: 22px 24px; min-height: 150px; display: flex; flex-direction: column; justify-content: flex-end; }
.mh-skyline { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.9; }
.mh-hero-title { position: relative; z-index: 1; font-family: "Playfair Display", serif; font-size: clamp(20px, 2.6vw, 28px); font-weight: 700; color: var(--mh-text); text-shadow: 0 2px 10px rgba(0,0,0,0.6); }
.mh-hero-subtitle { position: relative; z-index: 1; font-size: 11px; letter-spacing: 0.14em; color: var(--mh-gold); font-weight: 700; text-shadow: 0 2px 8px rgba(0,0,0,0.6); }
.mh-era-tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.mh-era-chip { font-size: 11.5px; font-weight: 700; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--mh-line); background: var(--mh-glass); color: var(--mh-text-soft); }
.mh-era-chip:hover { border-color: var(--mh-blue); color: var(--mh-text); }
.mh-era-chip.active { background: linear-gradient(135deg, var(--mh-blue), var(--mh-violet)); border-color: transparent; color: #05070a; }

.mh-card-strip { display: flex; gap: 12px; overflow-x: auto; padding: 4px 2px 10px; scroll-snap-type: x proximity; }
.mh-card-empty { padding: var(--space-6); text-align: center; color: var(--mh-text-mute); font-size: 12.5px; background: var(--mh-glass); border-radius: 14px; border: 1px solid var(--mh-line); }
.mh-card {
  flex: 0 0 168px; scroll-snap-align: start; display: flex; flex-direction: column; gap: 6px; text-align: left;
  padding: 14px 13px; border-radius: 14px; background: var(--mh-glass); border: 1px solid var(--mh-line);
  position: relative; cursor: pointer; transition: transform var(--dur-fast) ease, border-color var(--dur-fast) ease, box-shadow var(--dur-fast) ease;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.mh-card:hover, .mh-card:focus-visible { transform: translateY(-3px); border-color: var(--region-c, var(--mh-blue)); }
.mh-card.selected { border-color: var(--region-c, var(--mh-blue)); box-shadow: 0 0 0 2px var(--region-c, var(--mh-blue)), 0 12px 26px rgba(0,0,0,0.4); }
.mh-card-emblem { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--region-c, #4da3ff) 18%, transparent); border: 1px solid var(--region-c, var(--mh-blue)); }
.mh-card-emblem svg { width: 18px; height: 18px; color: var(--region-c, var(--mh-blue)); }
.mh-card-rel { position: absolute; top: 12px; right: 12px; font-size: 8px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; padding: 3px 7px; border-radius: 999px; color: #05070a; background: var(--rel-c, #8d9aaa); cursor: help; }
.mh-card-name { font-size: 13px; font-weight: 700; color: var(--mh-text); line-height: 1.3; margin-top: 4px; }
.mh-card-period { font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; color: var(--mh-text-mute); }
.mh-card-region { font-size: 11px; font-weight: 700; color: var(--region-c, var(--mh-blue)); }

/* cartões com ilustração de referência: imagem preenche o cartão, texto
   sobre um gradiente escuro na base — mesma informação, visual do mockup */
.mh-card.has-thumb { padding: 0; overflow: hidden; min-height: 210px; justify-content: flex-end; }
.mh-card-thumb { position: absolute; inset: 0; background-size: cover; background-position: center; z-index: 0; }
.mh-card-thumb::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(0deg, rgba(7,6,10,0.94) 0%, rgba(7,6,10,0.68) 38%, rgba(7,6,10,0.08) 72%, transparent 100%);
}
.mh-card.has-thumb .mh-card-rel { z-index: 2; }
.mh-card.has-thumb .mh-card-name,
.mh-card.has-thumb .mh-card-period,
.mh-card.has-thumb .mh-card-region { position: relative; z-index: 2; padding: 0 13px; }
.mh-card.has-thumb .mh-card-name { margin-top: 0; }
.mh-card.has-thumb .mh-card-region { padding-bottom: 13px; }
.mh-card.has-thumb:hover .mh-card-thumb, .mh-card.has-thumb:focus-visible .mh-card-thumb { transform: scale(1.045); }
.mh-card-thumb { transition: transform 0.5s ease; }

/* ---- placeholder (mapa / árvore / glossário) ---- */
.mh-placeholder { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; background: var(--mh-glass); border: 1px solid var(--mh-line); border-radius: 16px; padding: var(--space-7); }
.mh-placeholder-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: rgba(226,176,77,0.14); border: 1px solid rgba(226,176,77,0.35); }
.mh-placeholder-icon svg { width: 22px; height: 22px; color: var(--mh-blue); }
.mh-placeholder h3 { font-size: 17px; margin: 4px 0 0; color: var(--mh-text); }
.mh-placeholder p { font-size: 13px; line-height: 1.6; color: var(--mh-text-soft); max-width: 520px; margin: 0 0 6px; }

/* ---- detail panel ---- */
.mh-detail { background: var(--mh-glass); border: 1px solid var(--mh-line); border-radius: 16px; padding: 18px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 20px 50px rgba(0,0,0,0.4); }
.mh-detail-badge { display: inline-flex; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; padding: 4px 10px; border-radius: 999px; color: #05070a; background: var(--region-c, var(--mh-blue)); }
.mh-detail-name { font-family: "Playfair Display", serif; font-size: 19px; margin: 10px 0 2px; color: var(--mh-text); line-height: 1.25; }
.mh-detail-period { font-family: "SFMono-Regular", Consolas, monospace; font-size: 12px; color: var(--mh-text-mute); margin: 0 0 12px; }
.mh-detail-emblem-wrap { width: 100%; height: 76px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, color-mix(in srgb, var(--region-c, #4da3ff) 20%, transparent), transparent); border: 1px solid var(--mh-line); margin-bottom: 14px; }
.mh-detail-emblem-wrap svg { width: 30px; height: 30px; color: var(--region-c, var(--mh-blue)); }
.mh-detail-facts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.mh-detail-facts-grid .fact { background: rgba(255,255,255,0.03); border: 1px solid var(--mh-line-soft); border-radius: 10px; padding: 8px 10px; }
.mh-detail-facts-grid .fact .label { color: var(--mh-text-mute); font-size: 11px; }
.mh-detail-facts-grid .fact .value { color: var(--mh-text); font-size: 12px; }
.mh-detail-link { font-size: 12px; font-weight: 700; color: var(--mh-blue); background: none; border: none; padding: 0; text-align: left; }
.mh-detail-link:hover { text-decoration: underline; }
.mh-detail-block { margin-bottom: 14px; }
.mh-detail-title { display: block; font-size: 11px; font-weight: 800; letter-spacing: 0.06em; color: var(--mh-text-mute); margin-bottom: 6px; }
.mh-detail-summary { font-size: 12.5px; line-height: 1.65; color: var(--mh-text-soft); margin: 0; }
.mh-facts-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 7px; }
.mh-fact-item { display: flex; align-items: flex-start; gap: 8px; font-size: 12px; line-height: 1.55; color: var(--mh-text-soft); }
.mh-fact-check { flex: 0 0 auto; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: #05070a; background: var(--rel-c, var(--mh-emerald)); margin-top: 1px; }
.mh-descendant-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.mh-descendant-list li { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12px; padding: 7px 10px; background: rgba(255,255,255,0.03); border-radius: 8px; }
.mh-descendant-name { color: var(--mh-text); font-weight: 600; }
.mh-descendant-period { color: var(--mh-text-mute); font-size: 11px; font-family: "SFMono-Regular", Consolas, monospace; }
.mh-source-list { list-style: none; padding: 0; margin: 0 0 8px; display: flex; flex-direction: column; gap: 6px; }
.mh-source-item { display: flex; flex-direction: column; font-size: 11.5px; }
.mh-source-author { color: var(--mh-text); font-weight: 700; }
.mh-source-work { color: var(--mh-text-mute); font-style: italic; }
.mh-detail-more { font-size: 12px; font-weight: 700; color: var(--mh-blue); }
.mh-detail-more:hover { text-decoration: underline; }

/* ---- footer filters ---- */
.mh-footer { border-top: 1px solid var(--mh-line); margin-top: var(--space-7); padding-top: var(--space-5); }
.mh-footer-inner { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px 24px; }
.mh-footer-filters { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.mh-footer-label { font-size: 11px; font-weight: 800; letter-spacing: 0.06em; color: var(--mh-text-mute); }
.mh-select { background: var(--mh-glass); color: var(--mh-text); border: 1px solid var(--mh-line); border-radius: 8px; padding: 7px 10px; font-size: 12px; font-family: inherit; }
.mh-clear-link { font-size: 12px; font-weight: 700; color: var(--mh-blue); background: none; border: none; }
.mh-clear-link:hover { text-decoration: underline; }
.mh-footer-reliability { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.mh-rel-legend { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.mh-rel-legend-item { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--mh-text-soft); font-weight: 600; cursor: help; }

/* ---- crosslink pill on the Linha do Tempo (Fundadores) hero ---- */
.tl-crosslink { display: inline-flex; margin-top: 12px; font-size: 12px; font-weight: 600; color: var(--tlp-gold-pale); background: rgba(230,200,105,0.08); border: 1px solid rgba(230,200,105,0.22); border-radius: 999px; padding: 8px 16px; max-width: 100%; }
.tl-crosslink:hover { background: rgba(230,200,105,0.16); }
@media (max-width: 560px) { .tl-crosslink { white-space: normal; } }

/* ---- Museu Histórico Interativo v2: três faixas empilhadas         ----
   (Timeline + Árvore Genealógica 3D + Mapa Múndi), cada uma com o mesmo
   grid sidebar/main/detail acima, WebGL real (Three.js, museu-three.js)
   desenhado dentro de .museu-canvas-wrap. Reaproveita as classes .mh-*
   já existentes (badges, facts, fontes) para o conteúdo dos 3 painéis. */
.museu-header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.museu-section { padding-top: var(--space-6); padding-bottom: var(--space-6); border-top: 1px solid var(--mh-line-soft); }
.museu-section:first-of-type { border-top: none; padding-top: var(--space-5); }
.museu-section-label { font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mh-gold); margin-bottom: 10px; }
.museu-sidebar-title { display: block; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: var(--mh-text-mute); line-height: 1.55; padding-bottom: 10px; margin-bottom: 2px; border-bottom: 1px solid var(--mh-line-soft); }

.museu-canvas-wrap { position: relative; width: 100%; min-height: 280px; border-radius: 16px; overflow: hidden; border: 1px solid var(--mh-line); background: #03050a; touch-action: none; }
.museu-canvas-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
.museu-canvas-wrap canvas:active { cursor: grabbing; }
.museu-canvas-hint { position: absolute; bottom: 10px; right: 14px; z-index: 2; font-size: 11px; color: var(--mh-text-soft); background: rgba(5,7,10,0.6); padding: 4px 10px; border-radius: 999px; pointer-events: none; }
.museu-labels { position: absolute; inset: 0; z-index: 1; overflow: hidden; pointer-events: none; }
.museu-label { position: absolute; transform: translate(-50%, -130%); font-size: 11px; font-weight: 700; color: var(--mh-text); text-shadow: 0 1px 5px rgba(0,0,0,0.85); white-space: nowrap; }
.museu-label-major { font-size: 11.5px; color: #fff; }
.museu-label-group { opacity: 0.75; }

.museu-hero { min-height: 230px; }
.museu-hero .museu-canvas-wrap { position: absolute; inset: 0; min-height: 0; border: none; border-radius: 0; z-index: 0; }
.museu-hero .mh-hero-title, .museu-hero .mh-hero-subtitle { position: relative; z-index: 1; }
.museu-hero.has-illustration {
  min-height: 280px;
  background-image:
    linear-gradient(0deg, rgba(7,6,10,0.92) 0%, rgba(7,6,10,0.45) 42%, rgba(7,6,10,0.18) 70%, rgba(7,6,10,0.35) 100%),
    var(--museu-hero-img);
  background-size: cover, 130% auto;
  background-position: center bottom, 50% 38%;
  background-repeat: no-repeat, no-repeat;
}
@media (prefers-reduced-motion: no-preference) {
  .museu-hero.has-illustration { animation: museuHeroKenBurns 26s ease-in-out infinite alternate; }
}
@keyframes museuHeroKenBurns {
  from { background-position: center bottom, 46% 34%; background-size: cover, 132% auto; }
  to   { background-position: center bottom, 54% 42%; background-size: cover, 122% auto; }
}
.museu-illustration-caption {
  position: absolute; z-index: 1; bottom: 8px; right: 14px;
  font-size: 11px; color: var(--mh-text-mute); opacity: 0.75; letter-spacing: 0.02em;
}
#museu-tree-canvas-wrap, #museu-map-canvas-wrap { min-height: 440px; }

.museu-toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.museu-tool-btn { font-size: 11.5px; font-weight: 700; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--mh-line); background: var(--mh-glass); color: var(--mh-text-soft); }
.museu-tool-btn:hover { border-color: var(--mh-blue); color: var(--mh-text); }
.museu-tool-btn.active { background: linear-gradient(135deg, var(--mh-blue), var(--mh-violet)); border-color: transparent; color: #05070a; }

.mh-search-mini { padding-top: 2px; }
.mh-search-mini input { width: 100%; background: var(--mh-glass); border: 1px solid var(--mh-line); border-radius: 8px; padding: 8px 10px; font-size: 12px; color: var(--mh-text); font-family: inherit; }
.mh-search-mini input::placeholder { color: var(--mh-text-mute); }
.museu-filter-label { display: flex; flex-direction: column; gap: 6px; font-size: 11px; font-weight: 700; color: var(--mh-text-mute); letter-spacing: 0.04em; margin-top: 8px; }
.museu-drag-hint { font-size: 11px; color: var(--mh-text-mute); margin: 2px 2px 0; }

@keyframes museuPulseKF { 0% { box-shadow: 0 0 0 0 var(--region-c, var(--mh-blue)); } 70% { box-shadow: 0 0 0 10px rgba(0,0,0,0); } 100% { box-shadow: none; } }
.museu-pulse { animation: museuPulseKF 0.65s ease; }

#museu-4d-canvas-wrap { min-height: 440px; }

/* ---- Modo 4D: scrubber temporal + playback ---- */
.museu4d-scrubber-wrap { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; padding: 14px 16px; border-radius: 14px; background: var(--mh-glass); border: 1px solid var(--mh-line); }
.museu4d-scrubber-row { display: flex; align-items: center; gap: 14px; }
.museu4d-play-btn { flex: 0 0 auto; }
.museu4d-range { flex: 1; -webkit-appearance: none; appearance: none; height: 5px; border-radius: 999px; background: linear-gradient(90deg, var(--mh-gold), var(--mh-violet)); outline: none; cursor: pointer; }
.museu4d-range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--mh-gold-bright); border: 2px solid #07060a; box-shadow: 0 0 0 3px rgba(226,176,77,0.25); cursor: grab; }
.museu4d-range::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--mh-gold-bright); border: 2px solid #07060a; box-shadow: 0 0 0 3px rgba(226,176,77,0.25); cursor: grab; }
.museu4d-date-readout { flex: 0 0 auto; min-width: 92px; text-align: right; font-family: "SFMono-Regular", Consolas, monospace; font-size: 13.5px; font-weight: 700; color: var(--mh-gold-bright); }
.museu4d-speed-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
