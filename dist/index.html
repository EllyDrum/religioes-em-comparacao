.museu4d-speed-label { font-size: 11px; font-weight: 800; letter-spacing: 0.06em; color: var(--mh-text-mute); margin-right: 2px; }
.museu4d-speed-btn { padding: 5px 11px; font-size: 11px; }

@media (max-width: 860px) {
  #museu-tree-canvas-wrap, #museu-map-canvas-wrap, #museu-4d-canvas-wrap { min-height: 320px; }
  .museu-hero { min-height: 190px; }
  .museu4d-scrubber-row { flex-wrap: wrap; }
  .museu4d-range { flex: 1 1 100%; order: 3; }
}

/* ============================================================
   BUSCA INTELIGENTE
   ============================================================ */
.search-hero { text-align: center; padding: var(--space-7) 0 10px; }
.search-box { display: flex; gap: 10px; max-width: 620px; margin: 0 auto; }
.search-box input { flex: 1; padding: 15px 18px; border-radius: 999px; border: 1.5px solid var(--border); font-size: 15px; background: var(--bg-elevated); color: var(--text); min-height: var(--tap-min); min-width: 0; }
.search-suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: var(--space-4); }
.search-suggestions button { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg-elevated); font-size: 12.5px; color: var(--text-muted); min-height: 36px; }
.search-suggestions button:hover { border-color: var(--gold); color: var(--gold-text); }

.search-filters { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: var(--space-5); }
.search-filters button { padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--border); background: var(--bg-elevated); font-size: 12.5px; font-weight: 700; color: var(--text-muted); min-height: 36px; }
.search-filters button .n { opacity: 0.7; font-weight: 600; margin-left: 4px; }
.search-filters button.active { background: var(--navy-900); border-color: var(--navy-900); color: var(--text-on-dark); }

.search-results { margin-top: var(--space-6); display: flex; flex-direction: column; gap: var(--space-4); }
.search-result-card { display: block; padding: var(--space-4) var(--space-5); }
.search-result-card .src-type-badge {
  display: inline-block; font-size: 10.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
  padding: 4px 10px; border-radius: 999px; background: var(--blue-light); color: var(--blue);
}
[data-theme="dark"] .search-result-card .src-type-badge { color: #8fb8ea; }
.search-result-card h3 { margin: 8px 0 4px; font-size: 15.5px; }
.search-result-card .reason { font-size: 11.5px; color: var(--text-muted); margin-top: 6px; font-style: italic; }
.search-result-card .examine { display: inline-flex; align-items: center; gap: 4px; margin-top: 8px; font-size: 12.5px; font-weight: 700; color: var(--gold-text); }
.search-recent { margin-top: var(--space-5); }
.search-recent .label { font-size: var(--fs-label); font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 8px; display: block; text-align: center; }

.ai-ask-panel {
  max-width: 700px; margin: var(--space-6) auto 0; padding: var(--space-5); border-radius: 16px;
  background: var(--bg-elevated); border: 1.5px solid var(--gold); box-shadow: 0 2px 14px rgba(0,0,0,0.06);
}
.ai-ask-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.ai-ask-head h3 { margin: 0; font-size: 17px; }
.ai-ask-badge {
  display: inline-flex; align-items: center; font-size: 11px; font-weight: 800; letter-spacing: 0.04em;
  padding: 3px 10px; border-radius: 999px; background: var(--gold); color: var(--navy-900);
}
.ai-ask-panel .search-box { margin: var(--space-4) 0 0; max-width: none; }
.ai-ask-result:empty { margin-top: 0; }
.ai-ask-result { margin-top: var(--space-4); }
.ai-ask-loading { text-align: center; }
.ai-ask-answer {
  padding: var(--space-4); border-radius: 12px; background: var(--bg); border: 1px solid var(--border);
  font-size: 15px; line-height: 1.6; white-space: normal;
}
.ai-ask-sources { margin-top: var(--space-3); font-size: 12.5px; color: var(--text-muted); }
.ai-ask-sources ul { margin: 6px 0 0; padding-left: 18px; }
.ai-ask-sources li { margin-bottom: 2px; }
.ai-ask-disclaimer { margin-top: var(--space-3); color: var(--text-muted); font-style: italic; }

/* ============================================================
   Ritos - versão mobile (cards por rito, seletor de religião)
   ============================================================ */
.mobile-ritual-controls { display: flex; flex-direction: column; gap: var(--space-3); margin-bottom: var(--space-4); }
.mobile-ritual-select-row { display: flex; flex-direction: column; gap: 6px; }
.mobile-ritual-select-row label { font-size: var(--fs-label); font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-muted); }
.mobile-ritual-select-row select {
  width: 100%; padding: 12px 14px; border-radius: var(--radius-sm); border: 1.5px solid var(--border);
  background: var(--bg-elevated); color: var(--text); font-size: 14px; font-weight: 600; min-height: var(--tap-min);
}
.mobile-compare-toggle { display: flex; align-items: center; gap: 10px; padding: 10px 4px; }
.mobile-compare-toggle label { font-size: 13px; font-weight: 700; color: var(--text); }

.mobile-ritual-list { display: flex; flex-direction: column; gap: var(--space-3); }
.mobile-ritual-card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-4); box-shadow: var(--shadow); }
.mobile-ritual-card .mrc-head { display: flex; align-items: center; gap: 10px; }
.mobile-ritual-card .mrc-icon { font-size: 20px; }
.mobile-ritual-card h4 { font-size: 14.5px; margin: 0; flex: 1; }
.mobile-ritual-card .mrc-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }

/* ============================================================
   COMPARADOR - página de comparação lado a lado
   Estrutura: topbar → VS header → chips de navegação → tabela
   (desktop/tablet) ou cards por tema (mobile) → resumo → fontes.
   Verde = semelhança, âmbar = diferença, cinza = não se aplica.
   As cores nunca indicam "religião boa/religião ruim" - apenas se
   as duas tradições concordam ou divergem no ponto comparado.
   ============================================================ */
.compare-page { padding-top: var(--space-6); }
.compare-topbar { display: flex; align-items: center; gap: var(--space-4); margin-bottom: var(--space-5); }
.compare-back {
  font-size: 13px; font-weight: 700; color: var(--text-muted); display: inline-flex; align-items: center;
  gap: 4px; min-height: var(--tap-min); padding: 6px 4px;
}
.compare-back:hover { color: var(--gold-text); }
.compare-eyebrow { font-size: var(--fs-label); font-weight: 800; letter-spacing: 0.1em; color: var(--text-muted); text-transform: uppercase; }

.compare-vs-header {
  display: flex; align-items: center; justify-content: center; gap: var(--space-7); padding: var(--space-6) 0 var(--space-7);
  text-align: center; flex-wrap: wrap;
}
.compare-side { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.compare-name { margin: 0; font-size: var(--fs-h2); letter-spacing: 0.01em; text-transform: uppercase; line-height: 1.15; max-width: 20ch; }
.compare-vs-circle {
  width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, var(--gold-light), var(--gold));
  color: var(--navy-950); display: flex; align-items: center; justify-content: center; font-weight: 900;
  font-size: 15px; flex-shrink: 0; box-shadow: 0 8px 20px rgba(201,162,39,0.3);
}

/* Chips de navegação rápida por tema */
.compare-nav-chips {
  display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px var(--space-5); scrollbar-width: thin;
  -webkit-overflow-scrolling: touch;
}
.compare-nav-chip {
  flex-shrink: 0; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 999px;
  padding: 8px 14px; font-size: 12.5px; font-weight: 700; color: var(--text-muted); white-space: nowrap;
  min-height: 36px; transition: all var(--dur-fast) var(--ease);
}
.compare-nav-chip:hover, .compare-nav-chip:focus-visible { border-color: var(--gold); color: var(--gold-text); }

/* Tabela (desktop / tablet) */
.compare-mobile { display: none; }
@media (max-width: 680px) { .compare-desktop { display: none; } .compare-mobile { display: block; } }

.compare-table-scroll { max-height: 74vh; }
table.compare-table { width: 100%; table-layout: fixed; border-collapse: collapse; background: var(--bg-elevated); min-width: 800px; }
table.compare-table th, table.compare-table td { padding: var(--space-4) var(--space-4); border-bottom: 1px solid var(--border); font-size: 13.5px; vertical-align: top; text-align: left; overflow-wrap: break-word; }
table.compare-table thead th {
  background: var(--navy-900); color: var(--text-on-dark); position: sticky; top: 0; z-index: 2;
  font-size: 11.5px; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 800;
}
/* table-layout:fixed usa a largura das células da primeira linha (thead)
   para definir as colunas - por isso os percentuais ficam aqui, e não
   só nas classes .pos-cell/.comparativo-cell do corpo da tabela. */
table.compare-table thead th:nth-child(1) { width: 190px; }
table.compare-table thead th:nth-child(2) { width: 27%; }
table.compare-table thead th:nth-child(3) { width: 26%; }
table.compare-table thead th:nth-child(4) { width: 27%; }
table.compare-table thead th.theme-col-head { left: 0; z-index: 4; }
table.compare-table th.theme-cell, table.compare-table thead th.theme-col-head { position: sticky; left: 0; }
table.compare-table th.theme-cell {
  z-index: 1; background: var(--bg-elevated); white-space: normal;
  box-shadow: 2px 0 6px rgba(16,31,61,0.05);
}
table.compare-table tbody tr.compare-theme-row:hover th.theme-cell,
table.compare-table tbody tr.compare-theme-row:hover td { background: var(--gray-50); }
table.compare-table tbody tr.compare-theme-row.open th.theme-cell,
table.compare-table tbody tr.compare-theme-row.open td.comparativo-cell { background: var(--gray-100); }
.theme-toggle {
  background: none; border: none; padding: 0; display: flex; align-items: center; gap: 8px; width: 100%;
  text-align: left; font-weight: 700; font-size: 13.5px; color: var(--text); min-height: var(--tap-min);
}
.theme-icon { font-size: 17px; flex-shrink: 0; transition: transform var(--dur-fast) var(--ease); }
.theme-toggle:hover .theme-icon { transform: scale(1.12); }
.theme-label { flex: 1; }
.theme-chevron { font-size: 11px; color: var(--text-muted); transition: transform var(--dur-fast) var(--ease); flex-shrink: 0; }
.compare-theme-row.open .theme-chevron { transform: rotate(90deg); color: var(--gold-text); }
.pos-cell { color: var(--text-muted); line-height: 1.55; width: 27%; }
.comparativo-cell { width: 26%; }
.comparativo-note { margin: 8px 0 0; font-size: 12.5px; color: var(--text-muted); line-height: 1.5; }
.compare-detail-row td { padding: 0; border-bottom: 2px solid var(--gold); background: var(--gray-50); }
.compare-detail-row[hidden] { display: none; }

.comparativo-pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px;
  font-size: var(--fs-badge); font-weight: 800; white-space: nowrap;
}
.rel-sim { background: var(--green-light); color: var(--green); }
.rel-diff { background: var(--amber-light); color: var(--amber); }
.rel-na { background: var(--gray-neutral-light); color: var(--gray-600); }
[data-theme="dark"] .rel-na { color: var(--gray-300); }

/* Painel de detalhe (expandido a partir da linha, ou dentro do card mobile) */
.compare-detail-grid { display: grid; grid-template-columns: 1fr minmax(260px, 340px) 1fr; gap: var(--space-5); padding: var(--space-5); align-items: start; }
.compare-detail-grid-2 { grid-template-columns: 1fr 1fr; }
@media (max-width: 980px) { .compare-detail-grid { grid-template-columns: 1fr; } }
.compare-detail-side h4 { margin: 0 0 8px; font-size: var(--fs-h4); }
.compare-detail-side p { margin: 8px 0 0; font-size: 13px; color: var(--text-muted); line-height: 1.55; }
.compare-detail-label { font-size: var(--fs-label); font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-muted); margin-top: 12px !important; }
.compare-detail-actions { display: flex; gap: 10px; flex-wrap: wrap; padding: 0 var(--space-5) var(--space-5); }

/* Realce ao navegar via chip/atalho */

@keyframes compareFlash {
  0% { box-shadow: 0 0 0 3px rgba(201,162,39,0.55); }
  100% { box-shadow: 0 0 0 0 rgba(201,162,39,0); }
}

/* Versão mobile: um card por tema (não é a tabela encolhida) */
.compare-mobile-list { display: flex; flex-direction: column; gap: var(--space-4); }
.compare-mobile-card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-4); box-shadow: var(--shadow); scroll-margin-top: 90px; }

.compare-mobile-card h4 { margin: 0; font-size: 14.5px; }

.cmc-side:first-of-type { border-top: none; }
.cmc-rel-name { font-size: 11.5px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-muted); }
.cmc-side p { margin: 6px 0 0; font-size: 13px; color: var(--text); line-height: 1.5; }
.cmc-comparativo { padding: 12px; margin: 4px 0; background: var(--gray-50); border-radius: var(--radius-sm); }

.cmc-details summary { cursor: pointer; list-style: none; font-size: 12.5px; font-weight: 700; color: var(--gold-text); display: flex; align-items: center; gap: 6px; min-height: 36px; }

.cmc-details[open] summary .chevron { transform: rotate(90deg); }
.cmc-details-body { padding-top: 6px; }
.cmc-details-body .compare-detail-grid, .cmc-details-body .compare-detail-actions { padding-left: 0; padding-right: 0; }

/* Resumo dinâmico: semelhanças e diferenças principais */
.compare-summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); margin-top: var(--space-8); }
@media (max-width: 800px) { .compare-summary-grid { grid-template-columns: 1fr; } }
.summary-card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-5); box-shadow: var(--shadow); }
.summary-card h3 { margin: 0 0 var(--space-3); font-size: var(--fs-h4); }

.diff-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }

/* Fontes e referências */
.compare-sources-cta {
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-5); flex-wrap: wrap;
  margin-top: var(--space-7); padding: var(--space-5); background: var(--gray-50); border: 1px solid var(--border);
  border-radius: var(--radius);
}

/* ---------- Disclaimer ---------- */
.disclaimer { background: var(--amber-light); color: var(--gray-800); border: 1px solid rgba(138,93,10,0.3); border-radius: var(--radius); padding: var(--space-5); font-size: var(--fs-body); }

/* ---------- Utilidades ---------- */
.mt-0{margin-top:0}.mb-0{margin-bottom:0}

/* ============================================================
   BREAKPOINTS GERAIS
   ============================================================ */

  .grid-3, .grid-2 { grid-template-columns: 1fr; }
  .doctrine-grid { grid-template-columns: 1fr; }
}

/* ============================================================
   EFEITOS SACROS — luz divina, partículas celestiais, rastro do
   cursor e microinterações douradas.

   Camada 100% aditiva sobre a identidade visual existente: nenhuma
   regra abaixo altera layout, proporções, cores de marca ou
   estrutura — apenas acrescenta iluminação, halos e partículas
   sutis, sempre em ouro/dourado/branco quente/âmbar sobre o
   azul-marinho já predominante. Toda animação contínua respeita
   `prefers-reduced-motion` (a regra global no topo do arquivo já
   zera durações; as consultas de mídia abaixo seguem o mesmo padrão
   já usado em `.hero-bg-particles` só por clareza/consistência).
   Em telas pequenas a quantidade de partículas é reduzida via JS
   (ver effects.js) e os halos abaixo usam apenas CSS leve
   (transform/opacity/filter), sem custo de layout.
   ============================================================ */

/* ---------- 1-2. Bíblia: luz divina + partículas douradas ---------- */
/* Camada 6 do hero (ver comentário no topo do bloco .hero): auréola
   quente ancorada sobre a região onde a Bíblia aparece na fotografia
   de fundo (canto inferior esquerdo), como se a luz emanasse do
   próprio livro. Usa mix-blend-mode:screen para só acrescentar luz,
   nunca escurecer a cena. */
.hero-bible-aura {
  position: absolute;
  left: 7%; top: 30%;
  width: min(620px, 50vw); height: min(620px, 50vw);
  border-radius: 50%;
  background: radial-gradient(circle,
    rgba(255,247,222,0.55) 0%,
    rgba(246,228,168,0.34) 26%,
    rgba(226,194,90,0.16) 48%,
    rgba(201,162,39,0.06) 66%,
    transparent 78%);
  filter: blur(6px);
  mix-blend-mode: screen;
  opacity: 0.85;
  pointer-events: none;
  will-change: opacity, transform;
}
@media (prefers-reduced-motion: no-preference) {
  .hero-bible-aura { animation: bibleAuraBreathe 8s ease-in-out infinite alternate; }
}
@keyframes bibleAuraBreathe {
  from { opacity: 0.68; transform: scale(0.97); }
  to   { opacity: 1;    transform: scale(1.04); }
}

/* Feixes de luz volumétrica muito discretos, girando lentamente ao
   redor do mesmo centro da auréola - lembram raios atravessando uma
   atmosfera escura, sem parecer efeito de jogo. */
.hero-bible-rays {
  position: absolute;
  left: 3%; top: 18%;
  width: min(760px, 62vw); height: min(760px, 62vw);
  background: conic-gradient(from 210deg at 50% 50%,
    transparent 0deg,
    rgba(255,247,222,0.14) 5deg, transparent 12deg,
    transparent 52deg,
    rgba(226,194,90,0.10) 58deg, transparent 66deg,
    transparent 140deg,
    rgba(255,247,222,0.12) 147deg, transparent 156deg,
    transparent 250deg,
    rgba(226,194,90,0.09) 257deg, transparent 266deg,
    transparent 360deg);
  mask-image: radial-gradient(circle at 50% 50%, #000 0%, transparent 62%);
  -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 0%, transparent 62%);
  mix-blend-mode: screen;
  opacity: 0.55;
  pointer-events: none;
  will-change: transform;
}
@media (prefers-reduced-motion: no-preference) {
  .hero-bible-rays { animation: bibleRaysDrift 110s linear infinite; }
}
@keyframes bibleRaysDrift {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

/* Canvas das partículas douradas orgânicas (ver effects.js) -
   ocupa todo o hero (ou, em telas estreitas, só a faixa onde a foto
   aparece — ver media queries abaixo) e as partículas nascem apenas
   perto da Bíblia, subindo devagar e desaparecendo com suavidade. */
.hero-bible-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

@media (max-width: 980px) {
  /* Nesta faixa a foto (.hero-bg-photo) vira uma banda de altura
     fixa no topo do hero (não a altura inteira, que aqui é bem maior
     por causa do conteúdo empilhado abaixo) - por isso a auréola, os
     raios e o canvas de partículas usam a MESMA expressão de altura
     da foto (clamp) em vez de porcentagem do hero inteiro, senão
     ficariam "soltos" bem abaixo da Bíblia. */
  .hero-bible-aura { left: 4%; top: calc(clamp(480px, 70vh, 680px) * 0.34); width: min(78vw, 520px); height: min(78vw, 520px); }
  .hero-bible-rays { left: -6%; top: calc(clamp(480px, 70vh, 680px) * 0.18); width: min(96vw, 680px); height: min(96vw, 680px); }
  .hero-bible-canvas { top: 0; bottom: auto; height: clamp(480px, 70vh, 680px); }
}
@media (max-width: 680px) {
  .hero-bible-aura { left: 2%; top: calc(clamp(460px, 66vh, 600px) * 0.32); width: min(84vw, 460px); height: min(84vw, 460px); }
  .hero-bible-rays { left: -8%; top: calc(clamp(460px, 66vh, 600px) * 0.16); width: min(104vw, 600px); height: min(104vw, 600px); }
  .hero-bible-canvas { height: clamp(460px, 66vh, 600px); }
}

/* ---------- 3. Rastro celestial do cursor (ver effects.js) ---------- */
/* Canvas único, criado uma vez via JS e anexado a <body>; some
   sozinho (JS nem é iniciado) em toque, telas pequenas ou quando o
   usuário pede menos movimento. */
.celestial-cursor-canvas {
  position: fixed; inset: 0; width: 100vw; height: 100vh;
  pointer-events: none; z-index: 40; mix-blend-mode: screen;
}

/* ---------- 4-5. Halo dourado em elementos interativos ---------- */
/* Anel de brilho suave por trás de controles pequenos (ícones,
   botões não-dourados, chips, itens de menu). Usa ::before próprio
   (nenhuma destas classes já usa ::before/::after) e não interfere
   no hover original de cada uma - só soma um halo que aparece e
   desaparece em opacidade. */
.icon-btn,
.main-nav a,
.mobile-drawer a,
.footer-links a,
.category-chip,

// Monta a lista final de nós { id, kind, parent, name, region, year, refType, refSlug, summary }.
function museuBuildTree() {
  var nodes = [];

  HUMANIDADE_MILESTONES.forEach(function (m) {
    nodes.push({
      id: "m:" + m.slug, kind: "milestone",
      parent: m.predecessor ? "m:" + m.predecessor : null,
      name: m.name, region: m.region, year: m.year,
      refType: "milestone", refSlug: m.slug,
    });
  });

  MUSEU_GROUPS.forEach(function (g) {
    nodes.push({
      id: "g:" + g.key, kind: "group",
      parent: g.parent, name: g.name, region: g.region,
      year: null, refType: "group", refSlug: g.key, summary: g.summary,
    });
  });

  RELIGIONS.forEach(function (r) {
    nodes.push({
      id: "r:" + r.slug, kind: "religion",
      parent: MUSEU_RELIGION_PARENT[r.slug] || "m:mundo-contemporaneo",
      name: r.shortName || r.name,
      region: MUSEU_REGION_BY_RELIGION_SLUG[r.slug] || "global",
      year: MUSEU_YEAR_BY_RELIGION_SLUG[r.slug] || null,
      refType: "religion", refSlug: r.slug,
    });
  });

  return nodes;
}

var MUSEU_TREE = museuBuildTree();
var MUSEU_TREE_BY_ID = {};
MUSEU_TREE.forEach(function (n) { MUSEU_TREE_BY_ID[n.id] = n; });

function museuNode(id) { return MUSEU_TREE_BY_ID[id] || null; }
function museuChildren(id) { return MUSEU_TREE.filter(function (n) { return n.parent === id; }); }
function museuAncestorChain(id) {
  var out = [], n = museuNode(id), guard = 0;
  while (n && n.parent && guard++ < 12) { out.push(n.parent); n = museuNode(n.parent); }
  return out;
}
function museuDescendantIds(id) {
  var out = [];
  museuChildren(id).forEach(function (c) { out.push(c.id); out = out.concat(museuDescendantIds(c.id)); });
  return out;
}

// Estatísticas reais (nunca números inventados): contam os próprios
// registros/arestas já existentes nos dois datasets de origem.
function museuComputeStats() {
  var branches = MUSEU_TREE.filter(function (n) { return n.parent; }).length;
  var events = 0;
  HUMANIDADE_MILESTONES.forEach(function (m) { events += (m.facts || []).length; });
  RELIGIONS.forEach(function (r) { events += ((r.assessment || {}).verses || []).length; });
  return {
    traditions: HUMANIDADE_MILESTONES.length + RELIGIONS.length,
    branches: branches,
    events: events,
  };
}


// ============================================================
// BIBLE-API - integração ao vivo com "A Bíblia Digital"
// (https://www.abibliadigital.com.br) para comparar um mesmo
// versículo em diferentes versões da Bíblia cristã em português.
// Roda inteiramente no navegador do usuário (client-side fetch).
// Se a API estiver indisponível, o site continua funcionando
// normalmente com os textos já cadastrados (Almeida).
// ============================================================

const BIBLE_API_BASE = "https://www.abibliadigital.com.br/api";

// Nomes amigáveis para códigos de versão conhecidos (a lista real
// e definitiva vem sempre de GET /versions, buscada ao vivo).
const VERSION_LABELS = {
  nvi: "NVI - Nova Versão Internacional",
  acf: "ACF - Almeida Corrigida Fiel",
  ra: "ARA - Almeida Revista e Atualizada",
  aa: "AA - Almeida Atualizada",
  rc: "ARC - Almeida Revista e Corrigida",
  ntlh: "NTLH - Nova Tradução na Linguagem de Hoje",
  nvt: "NVT - Nova Versão Transformadora",
  kjf: "King James Fiel 1611 (português)",
  apee: "Almeida Século 21",
};

// Só interessam versões da Bíblia cristã em português - qualquer
// código claramente não-português (ex.: inglês) é filtrado.
const NON_PORTUGUESE_CODES = new Set(["bbe", "kjv", "en_bbe"]);

let _versionsCache = null;
let _booksCache = null;

function normalize(str) {
  return (str || "")
    .toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[ºª.]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

async function fetchVersions() {
  if (_versionsCache) return _versionsCache;
  const res = await fetch(`${BIBLE_API_BASE}/versions`);
  if (!res.ok) throw new Error("Falha ao carregar versões (" + res.status + ")");
  const data = await res.json();
  const list = (Array.isArray(data) ? data : []).filter((v) => {
    const code = (v.version || v.code || v).toString().toLowerCase();
    return !NON_PORTUGUESE_CODES.has(code);
  });
  _versionsCache = list.length ? list : Object.keys(VERSION_LABELS).map((code) => ({ version: code }));
  return _versionsCache;
}

async function fetchBooks() {
  if (_booksCache) return _booksCache;
  const res = await fetch(`${BIBLE_API_BASE}/books`);
  if (!res.ok) throw new Error("Falha ao carregar livros (" + res.status + ")");
  _booksCache = await res.json();
  return _booksCache;
}

// Aceita referências como "João 3:16", "Romanos 12:1-2", "1 Coríntios 10:20"
function parseReference(text) {
  const m = text.trim().match(/^([1-3]?\s?[A-Za-zÀ-ÿ.]+)\s+(\d+)\s*(?::\s*(\d+)(?:\s*-\s*(\d+))?)?$/);
  if (!m) return null;
  return {
    bookQuery: m[1].trim(),
    chapter: parseInt(m[2], 10),
    verseStart: m[3] ? parseInt(m[3], 10) : null,
    verseEnd: m[4] ? parseInt(m[4], 10) : null,
  };
}

async function findBookAbbrev(bookQuery) {
  const books = await fetchBooks();
  const target = normalize(bookQuery);
  let best = null;
  for (const b of books) {
    const candidates = [b.name, b.abbrev && b.abbrev.pt, b.abbrev && b.abbrev.en].filter(Boolean).map(normalize);
    if (candidates.includes(target)) return b.abbrev.pt;
    if (!best && candidates.some((c) => c.startsWith(target) || target.startsWith(c))) best = b.abbrev.pt;
  }
  return best;
}

async function fetchVerseOrRange(version, abbrev, chapter, verseStart, verseEnd) {
  if (!verseStart) {
    const res = await fetch(`${BIBLE_API_BASE}/verses/${version}/${abbrev}/${chapter}`);
    if (!res.ok) throw new Error("Capítulo não encontrado (" + res.status + ")");
    const data = await res.json();
    return (data.verses || []).map((v) => v.text).join(" ");
  }
  if (!verseEnd || verseEnd === verseStart) {
    const res = await fetch(`${BIBLE_API_BASE}/verses/${version}/${abbrev}/${chapter}/${verseStart}`);
    if (!res.ok) throw new Error("Versículo não encontrado (" + res.status + ")");
    const data = await res.json();
    return data.text;
  }
  const parts = [];
  for (let n = verseStart; n <= verseEnd; n++) {
    const res = await fetch(`${BIBLE_API_BASE}/verses/${version}/${abbrev}/${chapter}/${n}`);
    if (res.ok) {
      const data = await res.json();
      parts.push(data.text);
    }
  }
  if (!parts.length) throw new Error("Versículos não encontrados");
  return parts.join(" ");
}

// Função principal usada pela interface: recebe uma referência em
// texto e uma lista de códigos de versão, devolve um array de
// { version, label, text } ou { version, label, error }.
async function compareVerse(referenceText, versionCodes) {
  const ref = parseReference(referenceText);
  if (!ref) throw new Error("Não entendi a referência. Use o formato \"Livro capítulo:versículo\", ex.: João 3:16");
  const abbrev = await findBookAbbrev(ref.bookQuery);
  if (!abbrev) throw new Error(`Livro "${ref.bookQuery}" não encontrado.`);

  const results = await Promise.all(
    versionCodes.map(async (code) => {
      const label = VERSION_LABELS[code] || code.toUpperCase();
      try {
        const text = await fetchVerseOrRange(code, abbrev, ref.chapter, ref.verseStart, ref.verseEnd);
        return { version: code, label, text };
      } catch (e) {
        return { version: code, label, error: e.message };
      }
    })
  );
  return { ref, results };
}

if (typeof module !== "undefined") {
  module.exports = { BIBLE_API_BASE, VERSION_LABELS, fetchVersions, fetchBooks, parseReference, findBookAbbrev, compareVerse };
}

    var rows = RITUALS.map(function (rit) {
      var cells = ritualReligions.map(function (r) {
        var cell = (MATRIX[r.slug] || {})[rit.id] || { status: "naplica" };
        var st = STATUS[cell.status] || STATUS.naplica;
        var title = esc(r.name) + " - " + st.label + (cell.usage ? " - " + esc(cell.usage) : "");
        return '<td class="status-cell" style="color:' + st.color + '" title="' + title + '">' + st.icon + "</td>";
      }).join("");
      return (
        '<tr data-ritual-row="' + rit.id + '"' + (rit.id === activeRitualId ? ' class="selected-row"' : "") + '>' +
        '<th data-action="open-ritual" data-ritual="' + rit.id + '">' + rit.icon + " " + esc(rit.name) + "</th>" +
        cells + "</tr>"
      );
    }).join("");

    var legend = Object.keys(STATUS).map(function (k) {
      var s = STATUS[k];
      return '<span><span class="dot" style="color:' + s.color + '">' + s.icon + "</span>" + s.label + "</span>";
    }).join("");

    return (
      '<div class="table-panel-grid">' +
      '<div>' +
      '<div class="rituals-desktop">' +
      '<div class="table-scroll"><table class="ritual-table"><thead>' + thead + "</thead><tbody>" + rows + "</tbody></table></div>" +
      '<div class="legend">' + legend + "</div>" +
      '<div class="observation-note"><strong>Observação ≠ Aprovação.</strong> Esta tabela mostra apenas o que cada tradição pratica. A avaliação bíblica aparece no painel ao lado.</div>' +
      '<p class="small" style="margin-top:10px">Clique no nome de um rito para ver a análise completa, ou no nome de uma religião para destacar sua coluna. Passe o mouse sobre uma célula para ver o detalhe.</p>' +
      "</div>" +
      '<div class="rituals-mobile">' + mobileRitualsMarkup() + "</div>" +
      "</div>" +
      '<div id="nt-panel-slot">' + ntPanel(activeRitualId) + "</div>" +
      "</div>"
    );
  }

  // ---------- Versão mobile: seletor de religião + cards por rito ----------
  function mobileReligionSelectRow(id, selectedSlug, labelText) {
    return (
      '<div class="mobile-ritual-select-row"><label for="' + id + '">' + esc(labelText) + "</label>" +
      '<select id="' + id + '">' + religionOptions(selectedSlug) + "</select></div>"
    );
  }

  function mobileRitualsMarkup() {
    return (
      '<div class="mobile-ritual-controls">' +
      mobileReligionSelectRow("mobile-religion-a-select", STATE.mobileReligionA, "Escolha uma religião") +
      '<div class="mobile-compare-toggle"><input type="checkbox" id="mobile-compare-toggle"' + (STATE.mobileCompareOn ? " checked" : "") + '><label for="mobile-compare-toggle">Comparar 2 religiões</label></div>' +
      (STATE.mobileCompareOn ? mobileReligionSelectRow("mobile-religion-b-select", STATE.mobileReligionB, "Comparar com") : "") +
      "</div>" +
      '<div id="mobile-ritual-list-slot">' + mobileRitualListMarkup() + "</div>"
    );
  }

  function mobileRitualListMarkup() {
    var a = findReligion(STATE.mobileReligionA) || RELIGIONS[0];
    var b = STATE.mobileCompareOn ? findReligion(STATE.mobileReligionB) || RELIGIONS[1] : null;
    var cards = RITUALS.map(function (rit) {
      var ca = (MATRIX[a.slug] || {})[rit.id] || { status: "naplica" };
      var sta = STATUS[ca.status] || STATUS.naplica;
      var rowB = "";
      if (b) {
        var cb = (MATRIX[b.slug] || {})[rit.id] || { status: "naplica" };
        var stb = STATUS[cb.status] || STATUS.naplica;
        rowB = '<div class="mrc-row"><span class="rel-name">' + esc(b.shortName) + '</span><span class="status-pill" style="background:' + stb.color + '22;color:' + stb.color + '">' + stb.icon + " " + esc(stb.label) + "</span></div>";
      }
      return (
        '<div class="mobile-ritual-card">' +
        '<div class="mrc-head"><span class="mrc-icon">' + rit.icon + '</span><h4>' + esc(rit.name) + "</h4></div>" +
        '<div class="mrc-row"><span class="rel-name">' + esc(a.shortName) + '</span><span class="status-pill" style="background:' + sta.color + '22;color:' + sta.color + '">' + sta.icon + " " + esc(sta.label) + "</span></div>" +
        rowB +
        (ca.usage ? '<p class="mrc-usage">' + glossify(ca.usage) + "</p>" : "") +
        '<details class="nt-group-mobile"><summary>📖 Ver análise bíblica<span class="chevron">▸</span></summary>' + ntPanelBody(rit) + "</details>" +
        "</div>"
      );
    }).join("");
    return '<div class="mobile-ritual-list">' + cards + "</div>";
  }

  // ---------- Painel "O que o Novo Testamento diz?" ----------
  function ntVerseGroup(icon, title, texts) {
    if (!texts || !texts.length) {
      return '<div class="nt-group"><div style="padding:10px 0;font-size:12.5px;color:var(--text-muted-on-dark)"><span class="ic" style="display:inline-flex;width:24px;height:24px;border-radius:6px;background:rgba(201,162,39,0.14);align-items:center;justify-content:center;margin-right:8px;vertical-align:middle">' + icon + "</span>" + esc(title) + ": nenhum texto direto identificado.</div></div>";
    }
    return (
      '<details class="nt-group"><summary><span class="ic">' + icon + "</span>" + esc(title) + '<span class="count">' + texts.length + '</span><span class="chevron">▸</span></summary>' +
      '<div class="nt-group-body">' + texts.map(function (v) { return verseBlock(v, { noAction: true }); }).join("") + "</div>" +
      "</details>"
    );
  }

  function ntPanelBody(rit) {
    var cl = CLASSIFICATIONS[rit.nt.classification];
    return (
      '<div class="nt-classification" style="color:' + esc(cl.color) + '">' + cl.icon + " " + esc(cl.label) + "</div>" +
      ntVerseGroup("✅", "Textos que apoiam", rit.nt.supportTexts) +
      '<hr class="nt-panel-divider">' +
      ntVerseGroup("⚠️", "Textos que limitam", rit.nt.limitTexts) +
      '<hr class="nt-panel-divider">' +
      ntVerseGroup("✖️", "Textos que rejeitam", rit.nt.rejectTexts) +
      '<div class="nt-panel-conclusion"><strong>Conclusão:</strong> ' + glossify(rit.nt.conclusion || rit.nt.context || "") + "</div>"
    );
  }

  function ntPanel(ritualId) {
    var rit = findRitual(ritualId);
    if (!rit) return "";
    return (
      '<div class="nt-panel">' +
      '<div class="nt-panel-head"><h3>' + rit.icon + " " + esc(rit.name) + "</h3></div>" +
      '<p class="sub">O que o Novo Testamento diz?</p>' +
      ntPanelBody(rit) +
      '<div class="nt-panel-actions"><a class="btn btn-gold btn-sm" href="#/biblia/' + rit.id + '">Examinar na Bíblia →</a> <button class="btn btn-outline-light btn-sm" data-action="open-similarities" data-ritual="' + rit.id + '">Ver semelhanças</button></div>' +
      "</div>"
    );
  }

  // ============================================================
  // COMPARADOR - motor de comparação tema a tema (dados reais)
  // ============================================================
  // Temas doutrinários (texto livre em data-religions.js) - comparados
  // por sobreposição de palavras-chave reais dos dois textos cadastrados.
  var COMPARE_DOCTRINE_THEMES = [
    { key: "god", icon: "🌌", label: "Deus", field: "god" },
    { key: "jesus", icon: "✝", label: "Jesus", field: "jesus" },
    { key: "salvation", icon: "🔑", label: "Salvação", field: "salvation" },
    { key: "afterlife", icon: "🌅", label: "Vida após a morte", field: "afterlife" },
  ];
  // Temas rituais (categóricos em data-matrix.js) - todos os ritos já
  // cadastrados no sistema entram na comparação, na mesma ordem usada
  // na tabela geral de ritos e práticas.
  var COMPARE_RITUAL_THEME_IDS = [
    "escrituras", "agua", "oracao", "batismo", "ceia-comunhao", "jejum",
    "sacerdocio", "acesso-a-deus", "confissao", "imagens", "oleo-uncao",
    "imposicao-maos", "oferendas", "incorporacao", "peregrinacao",
    "velas-incenso", "roupa-branca",
  ];
  var COMPARE_STOPWORDS = {
    que: 1, como: 1, para: 1, com: 1, uma: 1, um: 1, de: 1, da: 1, do: 1, das: 1, dos: 1,
    em: 1, por: 1, sobre: 1, nao: 1, sao: 1, foi: 1, ser: 1, tem: 1, seu: 1, sua: 1, seus: 1,
    suas: 1, mais: 1, pela: 1, pelo: 1, aos: 1, num: 1, numa: 1, esta: 1, este: 1, isso: 1,
    essa: 1, esse: 1, mas: 1, ou: 1, ao: 1, na: 1, no: 1, se: 1, sem: 1, ja: 1, the: 1, and: 1,
  };
  function compareTokens(str) {
    return normalizeText(str).split(/[^a-z0-9]+/i).filter(function (w) { return w.length > 2 && !COMPARE_STOPWORDS[w]; });
  }
  function jaccardSim(tokensA, tokensB) {
    var setB = {};
    tokensB.forEach(function (t) { setB[t] = true; });
    var union = {}, unionCount = 0, inter = 0, seenA = {};
    tokensA.concat(tokensB).forEach(function (t) { if (!union[t]) { union[t] = true; unionCount++; } });
    tokensA.forEach(function (t) { if (!seenA[t]) { seenA[t] = true; if (setB[t]) inter++; } });
    return unionCount ? inter / unionCount : 0;
  }
  function sharedTokens(tokensA, tokensB, n) {
    var setB = {}, seen = {}, out = [];
    tokensB.forEach(function (t) { setB[t] = true; });
    tokensA.forEach(function (t) { if (setB[t] && !seen[t]) { seen[t] = true; out.push(t); } });
    return out.slice(0, n || 3);
  }
  function excerpt(str, n) {
    str = (str || "").toString().trim();
    if (str.length <= n) return str;
    var cut = str.slice(0, n);
    var lastSpace = cut.lastIndexOf(" ");
    if (lastSpace > n * 0.6) cut = cut.slice(0, lastSpace);
    return cut + "…";
  }

  function compareDoctrineTheme(def, a, b) {
    var aText = a.doctrines[def.field] || "", bText = b.doctrines[def.field] || "";
    var ta = compareTokens(aText), tb = compareTokens(bText);
    var score = jaccardSim(ta, tb);
    var relation = score >= 0.12 ? "semelhante" : "diferente";
    var note;
    if (relation === "semelhante") {
      var shared = sharedTokens(ta, tb, 4);
      note = shared.length
        ? "Pontos em comum identificados nos textos cadastrados de ambas: " + shared.join(", ") + "."
        : "As posições registradas para as duas tradições convergem em termos gerais.";
    } else {
      note = a.shortName + ": “" + excerpt(aText, 100) + "” · " + b.shortName + ": “" + excerpt(bText, 100) + "”";
    }
    return { key: def.key, icon: def.icon, label: def.label, kind: "doctrine", aText: aText, bText: bText, relation: relation, note: note };
  }

  function compareRitualTheme(ritId, a, b) {
    var rit = findRitual(ritId);
    var ca = (MATRIX[a.slug] || {})[ritId], cb = (MATRIX[b.slug] || {})[ritId];
    var sa = ca ? ca.status : "naplica", sb = cb ? cb.status : "naplica";
    var aPractices = sa !== "nao" && sa !== "naplica";
    var bPractices = sb !== "nao" && sb !== "naplica";
    var relation, note;
    if (sa === "naplica" || sb === "naplica") {
      relation = "naplica";
      note = sa === "naplica" && sb === "naplica"
        ? "Não há dado cadastrado sobre " + rit.name + " para nenhuma das duas tradições."
        : "Não há dado comparável sobre " + rit.name + " para " + (sa === "naplica" ? a.shortName : b.shortName) + ".";
    } else if (!aPractices && !bPractices) {
      relation = "naplica";
      note = "Nenhuma das duas tradições pratica " + rit.name + ".";
    } else if (aPractices !== bPractices) {
      relation = "diferente";
      var who = aPractices ? a.shortName : b.shortName, other = aPractices ? b.shortName : a.shortName;
      var whoUsage = aPractices ? ca.usage : cb.usage;
      note = who + " pratica " + rit.name + (whoUsage ? " (" + whoUsage + ")" : "") + "; " + other + " não pratica.";
    } else if (sa === sb) {
      relation = "semelhante";
      note = "Ambas praticam de forma semelhante entre si (" + STATUS[sa].label.toLowerCase() + ").";
    } else {
      relation = "diferente";
      note = a.shortName + ": " + (ca.purpose || ca.usage || STATUS[sa].label) + " · " + b.shortName + ": " + (cb.purpose || cb.usage || STATUS[sb].label);
    }
    return {
      key: ritId, icon: rit.icon, label: rit.name, kind: "ritual", rit: rit,
      aText: ca && ca.usage ? ca.usage : (STATUS[sa] ? STATUS[sa].label : "Não se aplica"),
      bText: cb && cb.usage ? cb.usage : (STATUS[sb] ? STATUS[sb].label : "Não se aplica"),
      relation: relation, note: note,
    };
  }

  function buildComparisonThemes(aSlug, bSlug) {
    var a = findReligion(aSlug), b = findReligion(bSlug);
    var themes = [];
    COMPARE_DOCTRINE_THEMES.forEach(function (def) { themes.push(compareDoctrineTheme(def, a, b)); });
    COMPARE_RITUAL_THEME_IDS.forEach(function (id) { if (findRitual(id)) themes.push(compareRitualTheme(id, a, b)); });
    return themes;
  }

  function summarizeComparison(themes, a, b) {
    var sims = themes.filter(function (t) { return t.relation === "semelhante"; });
    var diffs = themes.filter(function (t) { return t.relation === "diferente"; });
    if (a.assessment.status !== b.assessment.status) {
      diffs.unshift({
        key: "assessment", icon: "⚖️", label: "Avaliação bíblica geral", relation: "diferente",
        note: a.shortName + " está classificada como “" + statusLabel(a.assessment.status) + "”, enquanto " + b.shortName + " está como “" + statusLabel(b.assessment.status) + "”.",
      });
    }
    return { sims: sims, diffs: diffs };
  }

  var COMPARE_RELATION_META = {
    semelhante: { icon: "🟢", label: "Ensinamento semelhante", cls: "rel-sim" },
    diferente: { icon: "🟠", label: "Ensinamento diferente", cls: "rel-diff" },
    naplica: { icon: "⚪", label: "Não se aplica", cls: "rel-na" },
  };
  function compareRelationPill(relation) {
    var m = COMPARE_RELATION_META[relation] || COMPARE_RELATION_META.naplica;
    return '<span class="comparativo-pill ' + m.cls + '">' + m.icon + " " + esc(m.label) + "</span>";
  }

  function compareHeaderMarkup(a, b) {
    return (
      '<div class="compare-topbar">' +
      '<a class="compare-back" href="#/comparar">← Voltar</a>' +
      '<span class="compare-eyebrow">Comparação de Religiões</span>' +
      "</div>" +
      '<div class="compare-vs-header">' +
      '<div class="compare-side"><span class="badge ' + statusBadgeClass(a.assessment.status) + '">' + statusLabel(a.assessment.status) + '</span><h1 class="compare-name">' + esc(a.name) + "</h1></div>" +
      '<div class="compare-vs-circle" aria-hidden="true">VS</div>' +
      '<div class="compare-side"><span class="badge ' + statusBadgeClass(b.assessment.status) + '">' + statusLabel(b.assessment.status) + '</span><h1 class="compare-name">' + esc(b.name) + "</h1></div>" +
      "</div>"
    );
  }

    return (
      '<nav class="compare-nav-chips" aria-label="Navegar por tema">' +
      themes.map(function (t) {
        return '<button type="button" class="compare-nav-chip" data-action="compare-jump" data-key="' + t.key + '">' + t.icon + " " + esc(t.label) + "</button>";
      }).join("") +
      "</nav>"

  function compareDetailMarkup(t, a, b) {
    if (t.kind === "ritual") {
      var rit = t.rit;
      var ca = (MATRIX[a.slug] || {})[rit.id] || { status: "naplica" };
      var cb = (MATRIX[b.slug] || {})[rit.id] || { status: "naplica" };
      var sta = STATUS[ca.status] || STATUS.naplica, stb = STATUS[cb.status] || STATUS.naplica;
      return (
        '<div class="compare-detail-grid">' +
        '<div class="compare-detail-side"><h4>' + esc(a.name) + '</h4><span class="status-pill" style="background:' + sta.color + '22;color:' + sta.color + '">' + sta.icon + " " + esc(sta.label) + "</span>" +
        (ca.usage ? "<p>" + glossify(ca.usage) + "</p>" : "") +
        (ca.purpose ? '<p class="compare-detail-label">Finalidade</p><p>' + glossify(ca.purpose) + "</p>" : "") +

  var TIMELINE_ERAS = [

    { key: "idade-media", label: "Idade Média", range: "500–1499", test: function (y) { return y >= 500 && y < 1500; } },
    { key: "reforma", label: "Reforma", range: "1500–1799", test: function (y) { return y >= 1500 && y < 1800; } },
    { key: "seculo-xix", label: "Século XIX", range: "1800–1899", test: function (y) { return y >= 1800 && y < 1900; } },
    { key: "seculo-xx", label: "Século XX", range: "1900–1999", test: function (y) { return y >= 1900 && y < 2000; } },
    { key: "contemporaneo", label: "Contemporâneo", range: "a partir de 2000", test: function (y) { return y >= 2000; } },
  ];
  function approxYear(str) {
    if (!str) return null;
    var m = str.match(/(\d{1,4})/);
    if (!m) return null;
    var num = parseInt(m[1], 10);

  }
  function eraFor(year) {
    if (year === null) return null;
    for (var i = 0; i < TIMELINE_ERAS.length; i++) if (TIMELINE_ERAS[i].test(year)) return TIMELINE_ERAS[i];
    return null;
  }

  // Genealogia simplificada por tradição (nível de categoria, não por
  // denominação individual) - usada só para desenhar as linhas de
  // ramificação/cisão da árvore genealógica visual da linha do tempo.
  // É uma simplificação histórica para tornar a estrutura de "ramos"
  // legível; não substitui pesquisa acadêmica detalhada sobre cada cisão.
  var TIMELINE_CAT_PARENT = {
    "protestante-historica": "catolica",
    "reformada": "catolica",
    "pentecostal": "protestante-historica",
    "neopentecostal": "pentecostal",
    "restauracionista": "protestante-historica",
  };
  function categoryAncestors(cat) {
    var out = [], c = cat, guard = 0;
    while (TIMELINE_CAT_PARENT[c] && guard++ < 10) { c = TIMELINE_CAT_PARENT[c]; out.push(c); }
    return out;
  }
  function categoryDescendants(cat) {
    var out = [];
    Object.keys(TIMELINE_CAT_PARENT).forEach(function (k) {
      if (TIMELINE_CAT_PARENT[k] === cat) { out.push(k); out = out.concat(categoryDescendants(k)); }
    });

  }

    if (!STATE.timelineFocusSlug) return false;

    if (!focusR) return false;

    var lineage = categoryAncestors(focusR.category).concat(categoryDescendants(focusR.category));
    return lineage.indexOf(cat) !== -1;

  // Classificação de confiabilidade histórica exibida em cada nó. Heurística

  // "sem fundador único" / tradição oral / data aproximada) - não é uma
  // avaliação teológica nem uma afirmação sobre a veracidade de nenhuma fé.
  var TIMELINE_RELIABILITY = {
    confirmado: { label: "Confirmado", short: "Confirmado", color: "#3fb178", desc: "Fundador e data específicos, com boa documentação histórica." },
    provavel: { label: "Provável", short: "Provável", color: "#5f8ce6", desc: "Evidência histórica relevante, mas com data aproximada, dupla ou atribuição feita pela própria tradição." },
    tradicional: { label: "Tradicional", short: "Tradicional", color: "#e2a13c", desc: "Sem um fundador individual documentado - baseado em tradição oral/religiosa ou continuidade institucional reivindicada." },
  };
  function yearIsApproxOrRange(str) {
    str = (str || "").toString();
    if (/~|séc/i.test(str)) return true;
    if (/\d\s*[–-]\s*\d/.test(str)) return true;
    if (/\d{3,4}\s+e\s+\d{3,4}/.test(str)) return true;

  function reliabilityFor(r) {

    if (/sem fundador único|reivindica continuidade/i.test(f)) return "tradicional";

    if (yearIsApproxOrRange(r.foundationYear)) return "provavel";
    return "confirmado";
  }

  function timelineTreeMarkup() {

    var withYear = list.map(function (r) { return { r: r, y: approxYear(r.foundationYear) }; });

    }

    var noEra = [];

      '<div class="tl-rail"></div>' +
      '<svg id="tl-connectors" class="tl-connectors" aria-hidden="true"></svg>' +
      cols + noEraCol +
      "</div>"
    );
  }

  // ---------- Conectores da árvore genealógica (linhas entre fundadores da
  // mesma tradição, em ordem cronológica, e entre uma tradição-mãe e a
  // tradição que dela se ramificou) ----------
  function branchPathD(a, b) {
    var midX = (a.cx + b.cx) / 2;
    return "M" + a.cx + "," + a.cy + " C" + midX + "," + a.cy + " " + midX + "," + b.cy + " " + b.cx + "," + b.cy;
  }
  function renderTimelineConnectors() {
    var svg = $("#tl-connectors");
    var grid = $(".tl-grid");
    if (!svg || !grid) return;
    var gridRect = grid.getBoundingClientRect();
    if (!gridRect.width || !gridRect.height) return;
    svg.setAttribute("width", gridRect.width);
    svg.setAttribute("height", gridRect.height);
    svg.setAttribute("viewBox", "0 0 " + gridRect.width + " " + gridRect.height);

    var byCat = {};
    $all(".tl-card", grid).forEach(function (card) {
      var slug = card.getAttribute("data-slug");
      var r = findReligion(slug);
      if (!r) return;
      var rect = card.getBoundingClientRect();
      var y = approxYear(r.foundationYear);
      (byCat[r.category] = byCat[r.category] || []).push({
        slug: slug, cx: rect.left - gridRect.left + rect.width / 2, cy: rect.top - gridRect.top + rect.height / 2,
        y: y === null ? 999999 : y,
      });
    });
    Object.keys(byCat).forEach(function (k) { byCat[k].sort(function (a, b) { return a.y - b.y; }); });

    var paths = "";
    Object.keys(byCat).forEach(function (cat) {
      var nodes = byCat[cat];
      var color = TIMELINE_CAT_COLOR[cat] || "#8b96ad";
      var related = isCategoryFocusRelated(cat) || (STATE.timelineFocusSlug && findReligion(STATE.timelineFocusSlug) && findReligion(STATE.timelineFocusSlug).category === cat);
      var op = STATE.timelineFocusSlug ? (related ? 0.9 : 0.06) : 0.32;
      for (var i = 1; i < nodes.length; i++) {
        paths += '<path d="' + branchPathD(nodes[i - 1], nodes[i]) + '" fill="none" stroke="' + color + '" stroke-width="1.6" opacity="' + op + '" filter="url(#tl-glow)"/>';
      }
    });
    Object.keys(TIMELINE_CAT_PARENT).forEach(function (childCat) {
      var parentCat = TIMELINE_CAT_PARENT[childCat];
      var childNodes = byCat[childCat], parentNodes = byCat[parentCat];
      if (!childNodes || !childNodes.length || !parentNodes || !parentNodes.length) return;
      var from = parentNodes[parentNodes.length - 1], to = childNodes[0];
      var color = TIMELINE_CAT_COLOR[childCat] || "#8b96ad";
      var related = isCategoryFocusRelated(childCat) || isCategoryFocusRelated(parentCat);
      var op = STATE.timelineFocusSlug ? (related ? 0.95 : 0.04) : 0.5;
      paths += '<path d="' + branchPathD(from, to) + '" fill="none" stroke="' + color + '" stroke-width="1.3" stroke-dasharray="2 5" opacity="' + op + '" filter="url(#tl-glow)"/>';
    });

    svg.innerHTML = '<defs><filter id="tl-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>' + paths;
  }

  function applyTimelineFocusVisual() {
    var root = $(".tl-premium");
    if (!root) return;
    root.classList.toggle("tl-focus-active", !!STATE.timelineFocusSlug);
    $all(".tl-card", root).forEach(function (card) {
      var slug = card.getAttribute("data-slug");
      var r = findReligion(slug);
      var related = r && isCategoryFocusRelated(r.category);
      card.classList.toggle("tl-focus-related", !!related);
      card.classList.toggle("tl-focus-self", slug === STATE.timelineFocusSlug);
    });
    var banner = $("#tl-focus-banner");
    if (banner) {
      var fr = STATE.timelineFocusSlug ? findReligion(STATE.timelineFocusSlug) : null;
      if (fr) {
        banner.innerHTML = '<span>Modo foco: <strong>' + esc(fr.founder) + "</strong> — " + esc(fr.name) + " e sua linhagem</span>" +
          '<button type="button" class="tl-focus-clear" data-action="clear-timeline-focus">Sair do foco ✕</button>';
        banner.hidden = false;
      } else {
        banner.hidden = true;
        banner.innerHTML = "";
      }
    }
    renderTimelineConnectors();
  }

  // ---------- Busca tipo "command palette" (Ctrl/Cmd+K) na linha do tempo ----------
  function timelineSearchScore(r, qNorm) {
    var fields = [
      { text: r.founder, w: 5 }, { text: r.name, w: 4 }, { text: r.shortName, w: 4 },
      { text: categoryLabel(r.category), w: 2 }, { text: r.originCountry, w: 1 }, { text: r.foundationYear, w: 1 },
    ];
    var score = 0;
    fields.forEach(function (f) {
      var norm = normalizeText(f.text);
      if (norm && norm.indexOf(qNorm) !== -1) score += f.w * (norm === qNorm ? 2 : 1);
    });
    return score;
  }
  function timelineSearchResults(q) {
    var qNorm = normalizeText(q);
    if (!qNorm) return [];
    return RELIGIONS.map(function (r) { return { r: r, score: timelineSearchScore(r, qNorm) }; })
      .filter(function (x) { return x.score > 0; })
      .sort(function (a, b) { return b.score - a.score; })
      .map(function (x) { return x.r; });
  }
  function timelineSearchResultsMarkup(q) {
    q = (q || "").trim();
    if (!q) {
      return '<div class="tl-palette-hint">Digite o nome de um fundador, religião, país ou período. Experimente: ' +
        ['Lutero', 'Brasil', '1517', 'Calvino'].map(function (s) {
          return '<button type="button" class="tl-palette-suggest" data-action="timeline-search-fill" data-q="' + esc(s) + '">' + esc(s) + "</button>";
        }).join(" ") + "</div>";
    }
    var results = timelineSearchResults(q);
    if (!results.length) return '<div class="tl-palette-empty">Nenhum resultado para "' + esc(q) + '".</div>';
    return results.map(function (r) {
      var rel = TIMELINE_RELIABILITY[reliabilityFor(r)];
      return (
        '<button type="button" class="tl-palette-item" data-action="timeline-search-result" data-slug="' + r.slug + '">' +
        '<span class="tl-palette-item-dot" style="background:' + (TIMELINE_CAT_COLOR[r.category] || "#8b96ad") + '"></span>' +
        '<span class="tl-palette-item-body">' +
        '<span class="tl-palette-item-name">' + esc(r.founder) + "</span>" +
        '<span class="tl-palette-item-meta">fundou ' + esc(r.name) + " · " + esc(r.foundationYear) + " · " + esc(r.originCountry) + "</span>" +
        "</span>" +
        '<span class="tl-palette-item-rel" style="--rel-c:' + rel.color + '">' + esc(rel.short) + "</span>" +
        "</button>"
      );
    }).join("");
  }
  function timelinePaletteMarkup() {
    return (
      '<div class="tl-palette-overlay" id="tl-palette-overlay" aria-hidden="true">' +
      '<div class="tl-palette" role="dialog" aria-modal="true" aria-label="Buscar na linha do tempo">' +
      '<div class="tl-palette-input-row">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="tl-palette-icon" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2" stroke-linecap="round"/></svg>' +
      '<input type="text" id="tl-palette-input" class="tl-palette-input" placeholder="Buscar fundador, religião, país, período..." autocomplete="off" spellcheck="false" aria-label="Buscar na linha do tempo">' +
      '<button type="button" class="tl-palette-close" data-action="close-timeline-search" aria-label="Fechar busca">ESC</button>' +
      "</div>" +
      '<div class="tl-palette-results" id="tl-palette-results">' + timelineSearchResultsMarkup("") + "</div>" +
      "</div></div>"
    );
  }
  function openTimelineSearch() {
    var overlay = $("#tl-palette-overlay");
    if (!overlay) return;
    overlay.classList.add("open");
    overlay.setAttribute("aria-hidden", "false");
    var input = $("#tl-palette-input");
    var results = $("#tl-palette-results");
    if (results) results.innerHTML = timelineSearchResultsMarkup("");
    if (input) { input.value = ""; setTimeout(function () { input.focus(); }, 0); }
  }
  function closeTimelineSearch() {
    var overlay = $("#tl-palette-overlay");
    if (!overlay) return;
    overlay.classList.remove("open");
    overlay.setAttribute("aria-hidden", "true");
  }

  var HUMANIDADE_RELIABILITY = {

  function humanidadeEraFor(year) {
    for (var i = 0; i < HUMANIDADE_ERAS.length; i++) if (HUMANIDADE_ERAS[i].test(year)) return HUMANIDADE_ERAS[i];

  // Resolve um nó de MUSEU_TREE (marco, religião ou agrupador) nos
  // dados reais de origem (HUMANIDADE_MILESTONES / RELIGIONS) - nunca
  // duplica texto, sempre lê do cadastro já revisado no restante do site.
  function museuResolve(nodeId) {
    var n = museuNode(nodeId);
    if (!n) return null;
    if (n.refType === "milestone") {
      var m = findMilestone(n.refSlug);
      if (!m) return null;
      return {
        node: n, name: m.name, badge: m.type, period: m.period,
        origin: m.origin, founder: m.originFigures, type: m.type,
        summary: m.summary, facts: m.facts, sources: m.sources, moreHref: null,
      };
    }
    if (n.refType === "religion") {
      var r = findReligion(n.refSlug);
      if (!r) return null;
      return {
        node: n, name: r.shortName || r.name, badge: categoryLabel(r.category), period: r.foundationYear,
        origin: r.originCountry, founder: r.founder, type: categoryLabel(r.category),
        summary: r.description,
        facts: ["Fundador ou figura central: " + r.founder, "Ano aproximado de fundação: " + r.foundationYear, "País de origem: " + r.originCountry],
        sources: null, moreHref: "#/religiao/" + r.slug,
      };
    }
    return {
      node: n, name: n.name, badge: "Agrupamento", period: null,
      origin: null, founder: null, type: "Agrupamento de tradições",
      summary: n.summary, facts: [], sources: null, moreHref: null,
    };
  }

  // ============================================================
  // OPÇÃO D — Modo 4D Unificado (scrubber temporal + hipercubo 3D)
  // ============================================================
  // Eixo do tempo não-linear: mesmos limites de era usados na Linha do
  // Tempo (HUMANIDADE_ERAS), distribuídos em frações iguais do slider -
  // sem isso, ~100.000 anos de pré-história esmagariam os últimos 500
  // anos (onde está a maior parte dos dados) num pixel só.
  var MUSEU4D_YEAR_NOW = new Date().getFullYear();
  var MUSEU4D_KNOTS = [-100000, -10000, -500, 500, 1500, 1900, MUSEU4D_YEAR_NOW];
  function museu4dYearToT(year) {
    year = Math.max(MUSEU4D_KNOTS[0], Math.min(MUSEU4D_YEAR_NOW, year));
    for (var i = 0; i < MUSEU4D_KNOTS.length - 1; i++) {
      var a = MUSEU4D_KNOTS[i], b = MUSEU4D_KNOTS[i + 1];
      if (year >= a && year <= b) {
        var frac = b === a ? 0 : (year - a) / (b - a);
        return (i + frac) / (MUSEU4D_KNOTS.length - 1);
      }
    }
    return 1;
  }
  function museu4dTToYear(t) {
    t = Math.max(0, Math.min(1, t));
    var scaled = t * (MUSEU4D_KNOTS.length - 1);
    var i = Math.min(MUSEU4D_KNOTS.length - 2, Math.floor(scaled));
    var frac = scaled - i;
    var a = MUSEU4D_KNOTS[i], b = MUSEU4D_KNOTS[i + 1];
    return Math.round(a + (b - a) * frac);
  }
  function museu4dFormatYear(year) {
    year = Math.round(year);
    return year < 0 ? Math.abs(year) + " a.C." : year + " d.C.";
  }
  // ano representativo de cada nó (marcos/religiões já têm year; nós de
  // agrupamento sintético herdam o ano do filho mais antigo, senão do pai)
  var museu4dYearCache = {};
  function museu4dYearOf(nodeId) {
    if (museu4dYearCache[nodeId] !== undefined) return museu4dYearCache[nodeId];
    var n = museuNode(nodeId);
    if (!n) return (museu4dYearCache[nodeId] = null);
    if (n.year != null) return (museu4dYearCache[nodeId] = n.year);
    var kids = museuChildren(nodeId).map(function (c) { return museu4dYearOf(c.id); }).filter(function (y) { return y != null; });
    if (kids.length) return (museu4dYearCache[nodeId] = Math.min.apply(null, kids));
    if (n.parent) return (museu4dYearCache[nodeId] = museu4dYearOf(n.parent));
    return (museu4dYearCache[nodeId] = -100000);
  }

  function museuSelect(nodeId) {
    if (!museuNode(nodeId)) return;
    STATE.museuSelected = nodeId;
    var stripSlot = $("#museu-card-strip-slot"); if (stripSlot) stripSlot.innerHTML = museuCardStripMarkup();
    museuRefreshDetailPanels();
    museuPulse(nodeId);
    var n = museuNode(nodeId);
    if (window.__museuTreeInst) window.__museuTreeInst.focus(nodeId);
    if (window.__museuMapInst && n.region) window.__museuMapInst.focusRegion(n.region);
    if (window.__museu4dInst) window.__museu4dInst.focus(nodeId);
    if (n.year != null) {
      var era = humanidadeEraFor(n.year);
      if (era) { STATE.museuEra = era.key; var tabs = $("#museu-era-tabs"); if (tabs) tabs.outerHTML = museuEraTabsMarkup(); }
      // Regra 4D: selectedDate é a fonte primária de sincronização — selecionar

      if (!STATE.museu4dPlaying) museu4dSetDate(n.year, { silent: true });

  function museuSelectRegion(region) {
    STATE.museuMapRegion = region;
    var sel = $("#museu-map-region"); if (sel) sel.value = region;
    var first = MUSEU_TREE.filter(function (n) { return n.region === region; })[0];
    if (first) museuSelect(first.id);
  }
  function museuInitThreeIfMounted() {
    var treeEl = $("#museu-tree-canvas-wrap"), mapEl = $("#museu-map-canvas-wrap"), cubeEl = $("#museu-4d-canvas-wrap");
    if (!treeEl || !mapEl || !window.MuseuThree) return;
    window.__museuTreeInst = window.MuseuThree.initTree(treeEl, { onSelect: museuSelect });
    window.__museuMapInst = window.MuseuThree.initMap(mapEl, { onSelectRegion: museuSelectRegion });
    if (cubeEl && window.MuseuThree.initHypercube) {
      window.__museu4dInst = window.MuseuThree.initHypercube(cubeEl, {
        onSelect: museuSelect,
        yearOf: museu4dYearOf,
        yearToT: museu4dYearToT,
      });
      if (window.__museu4dInst) window.__museu4dInst.setDate(STATE.museu4dDate);
    }
    if (STATE.museuSelected) museuSelect(STATE.museuSelected);
    if (STATE.museuAutoRotate && window.__museuTreeInst) window.__museuTreeInst.toggleRotate();

    // Economia de bateria/CPU: as 3 cenas WebGL (árvore, mapa, hipercubo)
    // ficam com o loop de animação pausado sempre que sua seção sai da
    // tela, e retomam automaticamente quando o usuário rola de volta.
    // Sem isso, os três renderers continuariam rodando em requestAnimationFrame
    // o tempo todo, mesmo enquanto o visitante ainda está lendo o topo da
    // página (Opção A) e nunca chegou a rolar até B/C/D.
    if (window.__museuVisObserver) { window.__museuVisObserver.disconnect(); window.__museuVisObserver = null; }
    var visTargets = [
      { el: treeEl, inst: window.__museuTreeInst },
      { el: mapEl, inst: window.__museuMapInst },
      { el: cubeEl, inst: window.__museu4dInst },
    ].filter(function (t) { return t.el && t.inst && typeof t.inst.setActive === "function"; });
    if (visTargets.length && "IntersectionObserver" in window) {
      var elToInst = new Map(visTargets.map(function (t) { return [t.el, t.inst]; }));
      window.__museuVisObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          var inst = elToInst.get(entry.target);
          if (inst) inst.setActive(entry.isIntersecting);
        });
      }, { rootMargin: "200px 0px 200px 0px", threshold: 0.01 });
      visTargets.forEach(function (t) { window.__museuVisObserver.observe(t.el); });
    }
  }

  // ---- Modo 4D: controle central do eixo do tempo (scrubber + playback) ----
  function museu4dRefreshUI() {
    var readout = $("#museu4d-date-readout"); if (readout) readout.textContent = museu4dFormatYear(STATE.museu4dDate);
    var stat = $("#museu4d-stat-date"); if (stat) stat.textContent = museu4dFormatYear(STATE.museu4dDate);
    var range = $("#museu4d-scrub"); if (range) range.value = Math.round(museu4dYearToT(STATE.museu4dDate) * 1000);
    var playBtn = document.querySelector('[data-action="museu4d-toggle-play"].museu4d-play-btn');
    if (playBtn) playBtn.innerHTML = STATE.museu4dPlaying ? "⏸ Pausar" : "▶ Reproduzir";
  }
  function museu4dSetDate(year, opts) {
    opts = opts || {};
    STATE.museu4dDate = Math.max(MUSEU4D_KNOTS[0], Math.min(MUSEU4D_YEAR_NOW, Math.round(year)));
    museu4dRefreshUI();
    if (window.__museu4dInst) window.__museu4dInst.setDate(STATE.museu4dDate);
    if (!opts.silent) {
      var era = humanidadeEraFor(STATE.museu4dDate);
      if (era) { STATE.museuEra = era.key; var tabs = $("#museu-era-tabs"); if (tabs) tabs.outerHTML = museuEraTabsMarkup(); }
    }
  }
  var museu4dRAF = null;
  function museu4dLoop() {
    if (!STATE.museu4dPlaying) { museu4dRAF = null; return; }
    var nextYear = STATE.museu4dDate + STATE.museu4dSpeed / 60;
    if (nextYear >= MUSEU4D_YEAR_NOW) { museu4dSetDate(MUSEU4D_YEAR_NOW, { silent: true }); STATE.museu4dPlaying = false; museu4dRefreshUI(); museu4dRAF = null; return; }
    museu4dSetDate(nextYear, { silent: true });
    museu4dRAF = requestAnimationFrame(museu4dLoop);
  }
  function museu4dTogglePlay() {
    STATE.museu4dPlaying = !STATE.museu4dPlaying;
    museu4dRefreshUI();
    if (STATE.museu4dPlaying) {
      if (STATE.museu4dDate >= MUSEU4D_YEAR_NOW) museu4dSetDate(MUSEU4D_KNOTS[0], { silent: true });
      if (!museu4dRAF) museu4dRAF = requestAnimationFrame(museu4dLoop);
    }
  }

  function searchBodyMarkup(q) {
    var all = q ? runSearch(q) : [];
    var counts = {};
    all.forEach(function (r) { counts[r.type] = (counts[r.type] || 0) + 1; });
    if (STATE.searchFilter !== "todas" && !counts[STATE.searchFilter]) STATE.searchFilter = "todas";
    var results = STATE.searchFilter === "todas" ? all : all.filter(function (r) { return r.type === STATE.searchFilter; });
    var recent = !q ? loadRecentSearches() : [];
    var filterChips = q ? SEARCH_TYPES.filter(function (t) { return t.key === "todas" || counts[t.key]; }).map(function (t) {
      var n = t.key === "todas" ? all.length : counts[t.key] || 0;
      return '<button type="button" class="' + (STATE.searchFilter === t.key ? "active" : "") + '" data-action="filter-search" data-type="' + t.key + '">' + esc(t.label) + '<span class="n">(' + n + ")</span></button>";
    }).join("") : "";

      (q ? '<div class="search-filters">' + filterChips + "</div>" : "") +
      (!q && recent.length ? '<div class="search-recent"><span class="label">Buscas recentes</span><div class="search-suggestions">' + recent.map(function (t) { return '<button type="button" data-action="search-suggestion" data-q="' + esc(t) + '">' + esc(t) + "</button>"; }).join("") + "</div></div>" : "") +

  }

  var BIB_DEFAULT_TRADITION = "Protestantismo e Neopentecostalismo";

  function findBibliotecaTopic(id) {
    for (var i = 0; i < BIBLIOTECA_TOPICS.length; i++) {
      if (BIBLIOTECA_TOPICS[i].id === id) return BIBLIOTECA_TOPICS[i];
    }
    return null;
  }

  function bibliotecaTradition(t) {
    return t.tradition || BIB_DEFAULT_TRADITION;
  }

  function bibliotecaAllTraditions() {
    var out = [];
    BIBLIOTECA_TOPICS.forEach(function (t) {
      var tr = bibliotecaTradition(t);
      if (out.indexOf(tr) === -1) out.push(tr);
    });

  }

  // Busca inteligente da Biblioteca Bíblica: sem servidor, sem chave de
  // API e sem custo (roda inteiramente no navegador da pessoa) - combina
  // (1) um pequeno dicionário de sinônimos/apelidos comuns, (2) distância
  // de edição (Levenshtein) para tolerar erros de digitação, e (3) uma
  // pontuação de relevância por tema. Não é um modelo de linguagem: é um
  // algoritmo de busca e ranqueamento, mais parecido com o "corretor" de
  // um buscador do que com um chat de IA - ver explicação para o usuário
  // sobre por que uma IA generativa de verdade exigiria um servidor.
  var BIB_SYNONYMS = {
    dizimo: ["dizimos", "dizimar", "dez por cento", "10%"],
    oferta: ["ofertas", "semente", "sementes", "oferta de fe"],
    prosperidade: ["riqueza", "prosperar", "teologia da prosperidade"],
    maldicao: ["maldicoes", "maldicao geracional", "amaldicoado"],
    demonio: ["demonios", "exorcismo", "libertacao", "amarrar", "desatar"],
    lingua: ["linguas", "glossolalia", "falar em linguas"],
    pastor: ["pastores", "apostolo", "bispo", "lider", "mediador"],
    confissao: ["declaracao", "confissao positiva", "boca da fe"],
    cura: ["curas", "sarar", "sarado", "doenca", "doente"],
    uncao: ["uncoes", "cair no espirito", "descanso no espirito"],
    milionario: ["milionarios", "bilionario", "fortuna", "patrimonio", "rico", "ricos"],
    purgatorio: ["purificacao apos a morte"],
    maria: ["nossa senhora", "corredentora", "medianeira", "santos", "santo"],
    catolico: ["catolicismo", "catolica", "romano", "vaticano", "papa"],
    protestante: ["protestantismo", "evangelico", "evangelicos"],
    pentecostal: ["neopentecostal", "neopentecostalismo", "assembleia"],
    espirita: ["espiritismo", "kardecismo", "reencarnacao", "umbanda", "candomble"],
    testemunha: ["testemunhas de jeova", "jeova"],
    mormon: ["mormons", "mormonismo", "sud", "ultimos dias"],
  };

  function levenshtein(a, b) {
    if (a === b) return 0;
    var la = a.length, lb = b.length;
    if (!la) return lb;
    if (!lb) return la;
    var prev = [];
    for (var j = 0; j <= lb; j++) prev[j] = j;
    for (var i = 1; i <= la; i++) {
      var cur = [i];
      for (var k = 1; k <= lb; k++) {
        var cost = a.charAt(i - 1) === b.charAt(k - 1) ? 0 : 1;
        cur[k] = Math.min(prev[k] + 1, cur[k - 1] + 1, prev[k - 1] + cost);
      }
      prev = cur;
    }
    return prev[lb];
  }

  function bibliotecaExpandQuery(tokens) {
    var out = tokens.slice();
    tokens.forEach(function (tok) {
      Object.keys(BIB_SYNONYMS).forEach(function (root) {
        var group = BIB_SYNONYMS[root].concat([root]);
        if (group.indexOf(tok) !== -1) {
          group.forEach(function (syn) { if (out.indexOf(syn) === -1) out.push(syn); });
        }
      });
    });
    return out;
  }

  // Duas "camadas" de texto por tema: a primária (título, resumo,
  // categoria, tradição) pesa muito mais que o corpo do artigo - assim,
  // uma menção incidental dentro de um parágrafo histórico (ex.: o tema
  // "Purgatório" cita a "Reforma Protestante" no contexto histórico) não
  // faz esse tema aparecer numa busca por "evangélico" só por causa dessa
  // única palavra solta no meio do texto.
  function bibliotecaTopicHaystacks(t) {
    return {
      primary: normalizeText([t.title, t.summary, t.category, bibliotecaTradition(t)].join(" ")),
      body: normalizeText([t.today, t.oldTestament.context, t.newCovenant.context, t.historical, t.conclusion].join(" ")),
    };
  }

  function bibliotecaScoreTopic(hs, qTokens) {
    var score = 0;
    var primaryTokens = hs.primary.split(/\s+/).filter(Boolean);
    qTokens.forEach(function (qt) {
      if (!qt) return;
      if (hs.primary.indexOf(qt) !== -1) { score += 20; return; }
      if (hs.body.indexOf(qt) !== -1) { score += 3; return; }
      // Tolerância a erro de digitação: só contra título/resumo/tags, não
      // contra o corpo inteiro do artigo (evita ruído em textos longos).
      var maxDist = qt.length <= 4 ? 0 : (qt.length <= 7 ? 1 : 2);
      var best = Infinity;
      for (var i = 0; i < primaryTokens.length; i++) {
        var ht = primaryTokens[i];
        if (Math.abs(ht.length - qt.length) > maxDist) continue;
        var d = levenshtein(qt, ht);
        if (d < best) best = d;
        if (best === 0) break;
      }
      if (best <= maxDist) score += Math.max(6, 12 - best * 3);
    });
    return score;
  }

  function bibliotecaFilterTopics(query, tradition) {
    var base = BIBLIOTECA_TOPICS.filter(function (t) {
      return !tradition || tradition === "todas" || bibliotecaTradition(t) === tradition;
    });
    var qTokens = normalizeText(query || "").split(/\s+/).filter(Boolean);
    if (!qTokens.length) return base;
    qTokens = bibliotecaExpandQuery(qTokens);
    var scored = base.map(function (t) {
      return { t: t, score: bibliotecaScoreTopic(bibliotecaTopicHaystacks(t), qTokens) };
    }).filter(function (s) { return s.score >= 6; });
    scored.sort(function (a, b) { return b.score - a.score; });
    return scored.map(function (s) { return s.t; });
  }

  function bibliotecaRenderGrouped(topics) {
    if (!topics.length) {
      return '<p class="bib-no-results">Nenhum tema encontrado para essa busca. Tente outra palavra-chave - por exemplo, o nome de uma prática (“dízimo”), de uma religião (“catolicismo”) ou de uma doutrina (“purgatório”).</p>';
    }
    var cats = [];
    topics.forEach(function (t) { if (cats.indexOf(t.category) === -1) cats.push(t.category); });
    return cats.map(function (cat) {
      var group = topics.filter(function (t) { return t.category === cat; });
      return (
        '<div class="bib-category-group">' +
        "<h3 class=\"bib-category-title\">" + esc(cat) + "</h3>" +
        '<div class="bib-topic-grid">' + group.map(bibliotecaTopicCard).join("") + "</div>" +
        "</div>"
      );
    }).join("");
  }

  // Para resultados de busca (query não vazia): lista única ordenada por
  // relevância, sem agrupar por categoria - preserva o ranqueamento.
  function bibliotecaRenderRanked(topics) {
    if (!topics.length) {
      return '<p class="bib-no-results">Nenhum tema encontrado para essa busca. Tente outra palavra-chave - por exemplo, o nome de uma prática (“dízimo”), de uma religião (“catolicismo”) ou de uma doutrina (“purgatório”).</p>';
    }
    return '<div class="bib-topic-grid">' + topics.map(bibliotecaTopicCard).join("") + "</div>";
  }

  function initBibliotecaSearch() {
    var form = $("#bib-search-form");
    var input = $("#bib-search-input");
    var chipsEl = $("#bib-filter-chips");
    var resultsEl = $("#bib-results-container");
    var countEl = $("#bib-results-count");
    if (!form || !input || !resultsEl) return;
    var activeTradition = "todas";

    function run() {
      var q = input.value.trim();
      var filtered = bibliotecaFilterTopics(q, activeTradition);
      resultsEl.innerHTML = q ? bibliotecaRenderRanked(filtered) : bibliotecaRenderGrouped(filtered);
      if (q || activeTradition !== "todas") {
        countEl.textContent = filtered.length + (filtered.length === 1 ? " tema encontrado" : " temas encontrados");
      } else {
        countEl.textContent = "";
      }
    }

    input.addEventListener("input", debounce(run, 120));
    form.addEventListener("submit", function (e) { e.preventDefault(); run(); });
    if (chipsEl) {
      chipsEl.addEventListener("click", function (e) {
        var chip = e.target.closest(".bib-chip");
        if (!chip) return;
        $all(".bib-chip", chipsEl).forEach(function (c) { c.classList.remove("active"); });
        chip.classList.add("active");
        activeTradition = chip.getAttribute("data-tradition");
        run();
      });
    }
  }

  function openSimilaritiesModal(ritualId, triggerEl) {
    var rit = findRitual(ritualId);
    var rows = RELIGIONS.map(function (r) {
      var c = (MATRIX[r.slug] || {})[ritualId];
      if (!c || c.status === "nao" || c.status === "naplica") return "";
      var st = STATUS[c.status];
      return "<tr><td><a href='#/religiao/" + r.slug + "'>" + esc(r.shortName) + "</a></td><td>" + esc(c.usage || "-") + "</td><td>" + esc(c.purpose || "-") + "</td><td><span class='status-pill' style='background:" + st.color + "22;color:" + st.color + "'>" + st.icon + " " + esc(c.similarity || st.label) + "</span></td></tr>";

  // ---------- Comparador bíblico: lógica ----------
  function simplifyRefForApi(ref) {
    var m = ref.match(/^(.+?)\s+(\d+):(.+)$/);
    if (!m) return ref;
    var book = m[1], chapter = m[2], versePart = m[3];
    var firstToken = versePart.split(",")[0].trim();
    return book + " " + chapter + ":" + firstToken;
  }

  function initBibleComparator(prefillRef) {
    var checksEl = $("#bible-version-checks");
    var form = $("#bible-compare-form");
    var resultsEl = $("#bible-results");
    if (!form) return;

    fetchVersions().then(function (versions) {
      var codes = versions.map(function (v) { return (v.version || v.code || v).toString().toLowerCase(); }).filter(function (c) { return c && c.length <= 6; });
      if (!codes.length) codes = Object.keys(VERSION_LABELS);
      var defaultOn = ["nvi", "acf", "ra", "ntlh"].filter(function (c) { return codes.indexOf(c) !== -1; });
      if (!defaultOn.length) defaultOn = codes.slice(0, 3);
      checksEl.innerHTML = codes.map(function (c) {
        var label = VERSION_LABELS[c] || c.toUpperCase();
        return '<label class="version-chip"><input type="checkbox" value="' + esc(c) + '"' + (defaultOn.indexOf(c) !== -1 ? " checked" : "") + "> " + esc(label) + "</label>";
      }).join("");
      if (prefillRef) form.dispatchEvent(new Event("submit"));
    }).catch(function () {
      var codes = ["nvi", "acf", "ra", "ntlh"];
      checksEl.innerHTML =
        '<span class="api-note" style="width:100%">Não foi possível confirmar a lista de versões com o servidor agora - mostrando as versões mais comuns. Se a busca abaixo falhar, tente novamente em instantes.</span>' +
        codes.map(function (c) {
          return '<label class="version-chip"><input type="checkbox" value="' + c + '" checked> ' + esc(VERSION_LABELS[c]) + "</label>";
        }).join("");
      if (prefillRef) form.dispatchEvent(new Event("submit"));
    });

    form.onsubmit = function (e) {
      e.preventDefault();
      var raw = $("#bible-ref-input").value.trim();
      if (!raw) return;
      var refToUse = simplifyRefForApi(raw);
      var selected = $all('#bible-version-checks input[type="checkbox"]:checked').map(function (i) { return i.value; });
      if (!selected.length) { resultsEl.innerHTML = '<p class="api-note">Selecione ao menos uma versão para comparar.</p>'; return; }
      resultsEl.innerHTML = '<p class="small">Buscando…</p>';
      compareVerse(refToUse, selected).then(function (out) {
        resultsEl.innerHTML = out.results.map(function (r) {
          if (r.error) return '<div class="bible-result error"><div class="v-label">' + esc(r.label) + "</div>" + esc(r.error) + "</div>";
          return '<div class="bible-result"><div class="v-label">' + esc(r.label) + '</div><div>“' + esc(r.text) + "”</div></div>";
        }).join("") + '<p class="api-status">Referência interpretada: ' + esc(refToUse) + " · fonte: A Bíblia Digital (ao vivo)</p>";
      }).catch(function (err) {
        resultsEl.innerHTML = '<p class="api-note">' + esc(err.message || "Não foi possível comparar agora. A API bíblica pode estar temporariamente indisponível ou o limite de consultas sem login foi atingido (20/hora). Os versículos já cadastrados no site continuam disponíveis normalmente nas páginas de cada religião.") + "</p>";
      });
    };
  }
